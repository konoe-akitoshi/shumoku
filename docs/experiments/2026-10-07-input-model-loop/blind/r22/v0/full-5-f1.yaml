name: Headquarters
groups:
  - id: server-room
    label: Server room
  - id: ap-northeast-1a
    label: ap-northeast-1a
routingDomains:
  - id: guest
    label: guest
  - id: vpc-main
    label: main
    prefix: 10.0.0.0/16
segments:
  - id: vlan-10
    label: Business
    vlan: 10
    prefix: 192.168.10.0/24
    addresses:
      web-1: 192.168.10.20
  - id: vlan-20
    label: Guest
    vlan: 20
    routingDomain: guest
connections:
  - id: vpn-1
    label: IPsec Site-to-Site VPN
nodes:
  - id: rt-1
    type: router
    product: yamaha/rtx3510
    group: server-room
  - id: sw-1
    type: switch
    product: ?/swx2322p-16mt
    group: server-room
  - id: hv-1
    type: server
    product: dell/poweredge-r750
    software: VMware ESXi
    group: server-room
  - id: web-1
    type: vm
    host: hv-1
  - id: vpc-main
    label: AWS Tokyo VPC main
    type: cloud
  - id: igw-1
    type: internet-gateway
  - id: vgw-1
    type: vpn-gateway
links:
  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: "1"
    speed: 1G
    cable: cat6
    length: 3m
    segments: [vlan-10, vlan-20]
  - endpoints:
      - node: hv-1
      - node: sw-1
    speed: 10G
  - endpoints:
      - node: web-1
      - segment: vlan-10
    virtual: true
  - endpoints:
      - node: igw-1
      - routingDomain: vpc-main
  - endpoints:
      - node: rt-1
      - node: vgw-1
    connection: vpn-1
    description: 2 IPsec tunnels
