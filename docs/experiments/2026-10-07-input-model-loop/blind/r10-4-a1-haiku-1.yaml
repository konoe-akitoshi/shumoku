name: 'On-Premises and AWS Integration'
description: 'Server room with ESXi cluster and AWS Tokyo region VPC with Transit Gateway'

groups:
  - id: server-room
    label: 'Server Room'
  - id: ap-northeast-1a
    label: 'ap-northeast-1a'
  - id: ap-northeast-1c
    label: 'ap-northeast-1c'

segments:
  - id: vlan-10
    label: 'VLAN 10'
    vlan: 10
    prefix: '192.168.10.0/24'
    group: server-room
    addresses:
      rt-1: []
      hv-1: []
      hv-2: []
      fw-v:
        - '192.168.10.2'
      app-1:
        - '192.168.10.20'
  - id: sub-a
    label: 'sub-a'
    prefix: '10.0.1.0/24'
    group: ap-northeast-1a
    addresses:
      web-c:
        - '10.0.1.10'
      vpc-main: []
      tgw-1: []
  - id: sub-c
    label: 'sub-c'
    prefix: '10.0.2.0/24'
    group: ap-northeast-1c
    addresses:
      db-c:
        - '10.0.2.20'
      vpc-main: []
      tgw-1: []

redundancy:
  - id: prod
    label: 'prod'
    nodes:
      - hv-1
      - hv-2

nodes:
  - id: rt-1
    label: 'rt-1'
    product: 'yamaha/rtx3510'
    group: server-room
  - id: hv-1
    label: 'hv-1'
    product: 'dell/poweredge/r750'
    software: 'vmware/esxi'
    group: server-room
  - id: hv-2
    label: 'hv-2'
    product: 'dell/poweredge/r750'
    software: 'vmware/esxi'
    group: server-room
  - id: fw-v
    label: 'fw-v'
    product: 'paloaltonetworks/vm-series'
    host: hv-1
  - id: app-1
    label: 'app-1'
    software: 'ubuntu'
    host: prod
  - id: web-c
    label: 'web-c'
    product: 'amazon/ec2/t3.medium'
    software: 'amazon-linux'
    group: ap-northeast-1a
  - id: db-c
    label: 'db-c'
    product: 'amazon/rds'
    software: 'mysql'
    group: ap-northeast-1c
  - id: igw-1
    label: 'igw-1'
    product: 'amazon/internet-gateway'
  - id: tgw-1
    label: 'tgw-1'
    product: 'amazon/transit-gateway'
  - id: vpc-main
    label: 'vpc-main'
    product: 'amazon/vpc'

links:
  - endpoints:
      - node: rt-1
      - node: hv-1
    speed: '10G'
    segments:
      - vlan-10
  - endpoints:
      - node: rt-1
      - node: hv-2
    speed: '10G'
    segments:
      - vlan-10
  - endpoints:
      - node: rt-1
      - node: tgw-1
    virtual: true
    description: 'Site-to-Site VPN (2x IPsec tunnels)'
  - endpoints:
      - node: igw-1
      - node: vpc-main
    virtual: true
    description: 'Internet Gateway attachment to VPC'
