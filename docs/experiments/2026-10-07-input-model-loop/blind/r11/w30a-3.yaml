name: AS64500
nodes:
  - id: br1
    type: router
    asn: 64500
    group: dc-a
  - id: br2
    type: router
    asn: 64500
    group: dc-a
  - id: as64510-router
    type: router
    asn: 64510
    assumed: true
  - id: ix-t
    type: internet-exchange
  - id: as64520
    type: router
    asn: 64520
  - id: as64530
    type: router
    asn: 64530
  - id: as64540
    type: router
    asn: 64540
groups:
  - id: dc-a
    label: DC-A
segments:
  - id: ix-t-peering-lan
    label: IX-T peering LAN
    prefix: 198.51.100.0/24
    addresses:
      br2: 198.51.100.10
      as64520: 198.51.100.20
      as64530: 198.51.100.30
    routingDomain: as64500
routingDomains:
  - id: as64500
    label: AS64500
connections:
  - id: br1-as64510-ebgp
    label: eBGP to AS64510
  - id: br2-as64520-ebgp
    label: Settlement-free eBGP peer to AS64520 over IX-T
  - id: br2-as64540-ebgp
    label: Transit eBGP to AS64540
links:
  - endpoints:
      - node: br1
        port: xe-0/0/0
      - node: as64510-router
    speed: 10G
    connection: br1-as64510-ebgp
  - endpoints:
      - node: br2
      - segment: ix-t-peering-lan
  - endpoints:
      - node: as64520
      - segment: ix-t-peering-lan
    connection: br2-as64520-ebgp
    virtual: true
  - endpoints:
      - node: br2
      - node: as64540
    connection: br2-as64540-ebgp
    virtual: true
