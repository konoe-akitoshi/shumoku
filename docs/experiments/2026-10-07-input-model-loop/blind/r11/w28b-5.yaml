name: AS64500 network
autonomousSystems:
  - asn: 64500
  - asn: 64510
  - asn: 64520
  - asn: 64530
  - asn: 64540
groups:
  - id: DC-A
nodes:
  - id: br1
    as: 64500
    group: DC-A
  - id: br2
    as: 64500
    group: DC-A
  - id: transit-64510-router
    as: 64510
    assumed: true
  - id: ix-t-as64520
    as: 64520
  - id: ix-t-as64530
    as: 64530
segments:
  - id: IX-T-peering-LAN
    label: IX-T peering LAN
    prefix: 198.51.100.0/24
    addresses:
      br2: 198.51.100.10
      ix-t-as64520: 198.51.100.20
      ix-t-as64530: 198.51.100.30
links:
  - endpoints:
      - node: br1
        port: xe-0/0/0
      - node: transit-64510-router
    speed: 10G
    connection: ebgp-as64510
    description: Transit from AS64510
  - endpoints:
      - node: br2
      - segment: IX-T-peering-LAN
  - endpoints:
      - node: br2
      - node: ix-t-as64520
    virtual: true
    connection: ebgp-as64520
    description: Settlement-free eBGP peering over IX-T
  - endpoints:
      - node: br2
      - as: 64540
    virtual: true
    connection: ebgp-as64540
    description: Purchased transit
connections:
  - id: ebgp-as64510
    label: eBGP session with AS64510
  - id: ebgp-as64520
    label: Settlement-free eBGP session with AS64520 over IX-T
  - id: ebgp-as64540
    label: Purchased transit eBGP session with AS64540
