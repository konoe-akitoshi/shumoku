name: 本社とAWS東京VPC main
groups:
  - id: headquarters
    label: 本社
  - id: server-room
    label: サーバ室
    parent: headquarters
  - id: aws-tokyo
    label: AWS 東京
  - id: vpc-main
    label: VPC main
    parent: aws-tokyo
  - id: subnet-sub-a
    label: サブネット sub-a
    parent: vpc-main
routingDomains:
  - id: guest
    label: guest
segments:
  - id: vlan-10
    label: 業務
    vlan: 10
    prefix: 192.168.10.0/24
  - id: vlan-20
    label: 来客
    vlan: 20
    routingDomain: guest
  - id: vpc-main
    label: VPC main
    prefix: 10.0.0.0/16
  - id: sub-a
    label: サブネット sub-a (ap-northeast-1a)
    prefix: 10.0.1.0/24
nodes:
  - id: rt-1
    type: router
    product: Yamaha RTX3510
    group: server-room
  - id: sw-1
    type: switch
    product: SWX2322P-16MT
    group: server-room
  - id: hv-1
    type: virtualization host
    product: Dell PowerEdge R750
    software: VMware ESXi
    group: server-room
  - id: web-1
    type: VM
    host: hv-1
    address: 192.168.10.20
  - id: igw-1
    type: internet gateway
    group: vpc-main
  - id: vgw-1
    type: virtual private gateway
    group: vpc-main
connections:
  - id: site-to-site-vpn
    label: IPsec Site-to-Site VPN (2 tunnels)
links:
  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: port 1
    speed: 1G
    cable: Cat6
    length: 3m
    segments:
      - vlan-10
      - vlan-20
  - endpoints:
      - node: sw-1
      - node: hv-1
    speed: 10G
  - endpoints:
      - node: rt-1
      - node: vgw-1
    connection: site-to-site-vpn
    virtual: true
