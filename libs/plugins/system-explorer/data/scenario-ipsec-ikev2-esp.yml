  - title: "ESP の SA ができる"
    desc: "向きごとに1つずつ、計2つの SA ができました。トンネルの完成です。"
    detail: |
      SA は一方通行です。A→B 用の SA は SPI 0xc1a2b3c4 (B が受け取るときに使う番号なので B が決めた値)、B→A 用は SPI 0x8f3e2d1c です。鍵は SK_d とノンスから計算され、カーネルの SA データベース (SAD) に登録されます。

      Linux なら `ip xfrm state` / `ip xfrm policy` で、この SA とポリシーを見ることができます。
    facts:
      - [A → B, "SPI 0xc1a2b3c4"]
      - [B → A, "SPI 0x8f3e2d1c"]
      - [寿命, "例: 1時間 (期限前に作り直す)"]
    state:
      ga: "SA 2本 ✓"
      gb: "SA 2本 ✓"
    events:
      - kind: local
        node: ga
        label: "SA をカーネルに登録"
        text: "送信用 SA (SPI 0xc1a2b3c4) と受信用 SA (SPI 0x8f3e2d1c) をカーネルに登録。保留していた ping を送り出す。"
      - kind: local
        node: gb
        label: "SA をカーネルに登録"
        text: "受信用 SA (SPI 0xc1a2b3c4) と送信用 SA (SPI 0x8f3e2d1c) を登録。"
        with: true

  - title: "ESP でデータを送る"
    desc: "ゲートウェイ A は元のパケットを丸ごと暗号化し、外側に新しい IP ヘッダを付けて送ります。"
    detail: |
      インターネット上を流れるのは「198.51.100.10 → 203.0.113.20 の ESP パケット」だけです。中の宛先 (10.2.0.20) も、ping であることも見えません。

      ゲートウェイ B は SPI を見てどの SA の鍵で復号するか決め、ICV で改ざんがないことを確認し、取り出した元のパケットをサーバ-B に転送します。サーバ-B から見ると、普通の ping が届いただけです。
    facts:
      - [外側, "198.51.100.10 → 203.0.113.20 (ESP)"]
      - [内側 (暗号化), "10.1.0.10 → 10.2.0.20 (ICMP)"]
    events:
      - kind: pkt
        from: ha
        to: ga
        color: blue
        label: ping
        packet:
          summary: "ping 10.1.0.10 → 10.2.0.20 (拠点内は暗号化なし)"
          layers:
            - ipv4: {src: 10.1.0.10, dst: 10.2.0.20, proto: 1, id: 0x31c5}
            - name: "ICMP Echo Request"
              fields:
                - u8: [タイプ, 8, "8 (Echo Request)"]
                - u8: [コード, 0, "0"]
                - csum: [チェックサム, "", {kind: icmp4}]
                - u16: [識別子, 0x0b0c, "0x0b0c"]
                - u16: [シーケンス番号, 1, "1"]
                - str: [データ, "abcdefghijklmnopqrstuvwabcdefghi"]
      - kind: pkt
        from: ga
        to: gb
        color: green
        label: ESP
        packet:
          summary: "ESP: ゲートウェイ A → B (中身は 10.1.0.10 からの ping)"
          note: "インターネット上では、外側の IP (ゲートウェイ同士) と SPI・シーケンス番号しか見えない。元のパケットは宛先 IP も含めて丸ごと暗号化されている (トンネルモード)。"
          layers:
            - ipv4: {src: 198.51.100.10, dst: 203.0.113.20, proto: 50, id: 0x1b10, name: "外側の IPv4"}
            - name: ESP
              fields:
                - u32: [SPI, 0xc1a2b3c4, "0xc1a2b3c4", "受け取る側がどの SA (鍵) で復号するかを決める番号。IKE_AUTH で受け取る側が決めた値"]
                - u32: [シーケンス番号, 1, "1", "SA ごとに 1 ずつ増える。同じパケットの再送り込み (リプレイ攻撃) を防ぐ"]
                - blob: [IV, esp-iv-false, 8, "(8 バイト)"]
                - blob: [暗号文, esp-ct-false, 64, "(64 バイト) 元の IP パケット + トレーラ"]
                - blob: ["ICV (改ざん検知)", esp-icv-false, 16, "(16 バイト)", "AES-GCM の認証タグ"]
              embed:
                namePrefix: "元の "
                spec:
                  summary: ""
                  layers:
                    - ipv4: {src: 10.1.0.10, dst: 10.2.0.20, proto: 1, id: 0x31c5}
                    - name: "ICMP Echo Request"
                      fields:
                        - u8: [タイプ, 8, "8 (Echo Request)"]
                        - u8: [コード, 0, "0"]
                        - csum: [チェックサム, "", {kind: icmp4}]
                        - u16: [識別子, 0x0b0c, "0x0b0c"]
                        - u16: [シーケンス番号, 1, "1"]
                        - str: [データ, "abcdefghijklmnopqrstuvwabcdefghi"]
            - name: "ESP トレーラ"
              decoded: true
              fields:
                - raw: [パディング, [1, 2], "01 02", "長さを 4 バイト境界にそろえる"]
                - u8: [パディング長, 2, "2"]
                - u8: [次ヘッダ, 4, "4 (IPv4)", "中身が IP パケットまるごと = トンネルモード"]
      - kind: pkt
        from: gb
        to: hb
        color: blue
        label: ping
        packet:
          summary: "ping 10.1.0.10 → 10.2.0.20 (拠点内は暗号化なし)"
          layers:
            - ipv4: {src: 10.1.0.10, dst: 10.2.0.20, proto: 1, id: 0x31c5}
            - name: "ICMP Echo Request"
              fields:
                - u8: [タイプ, 8, "8 (Echo Request)"]
                - u8: [コード, 0, "0"]
                - csum: [チェックサム, "", {kind: icmp4}]
                - u16: [識別子, 0x0b0c, "0x0b0c"]
                - u16: [シーケンス番号, 1, "1"]
                - str: [データ, "abcdefghijklmnopqrstuvwabcdefghi"]

  - title: "返事も ESP で"
    desc: "逆向きは、もう1本の SA (SPI 0x8f3e2d1c) で暗号化されて戻ります。"
    events:
      - kind: pkt
        from: hb
        to: gb
        color: blue
        label: "ping 応答"
        packet:
          summary: "ping 応答 10.2.0.20 → 10.1.0.10 (拠点内は暗号化なし)"
          layers:
            - ipv4: {src: 10.2.0.20, dst: 10.1.0.10, proto: 1, id: 0x7e01}
            - name: "ICMP Echo Reply"
              fields:
                - u8: [タイプ, 0, "0 (Echo Reply)"]
                - u8: [コード, 0, "0"]
                - csum: [チェックサム, "", {kind: icmp4}]
                - u16: [識別子, 0x0b0c, "0x0b0c"]
                - u16: [シーケンス番号, 1, "1"]
                - str: [データ, "abcdefghijklmnopqrstuvwabcdefghi"]
      - kind: pkt
        from: gb
        to: ga
        color: green
        label: ESP
        packet:
          summary: "ESP: ゲートウェイ B → A (中身は 10.2.0.20 からの ping 応答)"
          note: "インターネット上では、外側の IP (ゲートウェイ同士) と SPI・シーケンス番号しか見えない。元のパケットは宛先 IP も含めて丸ごと暗号化されている (トンネルモード)。"
          layers:
            - ipv4: {src: 203.0.113.20, dst: 198.51.100.10, proto: 50, id: 0x5c10, name: "外側の IPv4"}
            - name: ESP
              fields:
                - u32: [SPI, 0x8f3e2d1c, "0x8f3e2d1c", "受け取る側がどの SA (鍵) で復号するかを決める番号。IKE_AUTH で受け取る側が決めた値"]
                - u32: [シーケンス番号, 1, "1", "SA ごとに 1 ずつ増える。同じパケットの再送り込み (リプレイ攻撃) を防ぐ"]
                - blob: [IV, esp-iv-true, 8, "(8 バイト)"]
                - blob: [暗号文, esp-ct-true, 64, "(64 バイト) 元の IP パケット + トレーラ"]
                - blob: ["ICV (改ざん検知)", esp-icv-true, 16, "(16 バイト)", "AES-GCM の認証タグ"]
              embed:
                namePrefix: "元の "
                spec:
                  summary: ""
                  layers:
                    - ipv4: {src: 10.2.0.20, dst: 10.1.0.10, proto: 1, id: 0x7e01}
                    - name: "ICMP Echo Reply"
                      fields:
                        - u8: [タイプ, 0, "0 (Echo Reply)"]
                        - u8: [コード, 0, "0"]
                        - csum: [チェックサム, "", {kind: icmp4}]
                        - u16: [識別子, 0x0b0c, "0x0b0c"]
                        - u16: [シーケンス番号, 1, "1"]
                        - str: [データ, "abcdefghijklmnopqrstuvwabcdefghi"]
            - name: "ESP トレーラ"
              decoded: true
              fields:
                - raw: [パディング, [1, 2], "01 02", "長さを 4 バイト境界にそろえる"]
                - u8: [パディング長, 2, "2"]
                - u8: [次ヘッダ, 4, "4 (IPv4)", "中身が IP パケットまるごと = トンネルモード"]
      - kind: pkt
        from: ga
        to: ha
        color: blue
        label: "ping 応答"
        packet:
          summary: "ping 応答 10.2.0.20 → 10.1.0.10 (拠点内は暗号化なし)"
          layers:
            - ipv4: {src: 10.2.0.20, dst: 10.1.0.10, proto: 1, id: 0x7e01}
            - name: "ICMP Echo Reply"
              fields:
                - u8: [タイプ, 0, "0 (Echo Reply)"]
                - u8: [コード, 0, "0"]
                - csum: [チェックサム, "", {kind: icmp4}]
                - u16: [識別子, 0x0b0c, "0x0b0c"]
                - u16: [シーケンス番号, 1, "1"]
                - str: [データ, "abcdefghijklmnopqrstuvwabcdefghi"]

  - title: "生きているか確認する"
    desc: "しばらく通信がないと、IKE で「生きてる？」と確認します (DPD)。応答がなければ SA を消して作り直します。"
    detail: "IKE SA と ESP の SA には寿命があり、切れる前に CREATE_CHILD_SA 交換で新しい鍵に入れ替えます (リキー)。こうして、同じ鍵を長く使いすぎないようにしています。"
    events:
      - kind: pkt
        from: ga
        to: gb
        color: amber
        label: INFORMATIONAL
        packet:
          summary: "INFORMATIONAL 要求 (空) = 生きてる？"
          note: "中身が空の暗号化メッセージ。正しく復号・応答できること自体が「生きている」証拠になる (DPD: Dead Peer Detection)。"
          layers:
            - ipv4: {src: 198.51.100.10, dst: 203.0.113.20, proto: 17, id: 0x1c01}
            - udp: {sport: 500, dport: 500, sname: IKE, dname: IKE}
            - name: "IKEv2 ヘッダ"
              fields:
                - hex: ["イニシエータ SPI", d4671ec32c9f96dd, d4 67 1e c3 2c 9f 96 dd, "開始側が決めた 8 バイトの番号。この IKE SA を識別する"]
                - hex: ["レスポンダ SPI", c48c83d4ba16892c, c4 8c 83 d4 ba 16 89 2c, "応答側が決める番号"]
                - u8: [次ペイロード, 46, "46 (SK (暗号化))", "IKE はペイロードを数珠つなぎにする。各ペイロードが「次は何か」を持つ"]
                - u8: [バージョン, 0x20, "2.0"]
                - u8: [交換タイプ, 37, "37 (INFORMATIONAL)"]
                - u8: [フラグ, 0x08, "I (イニシエータからの要求)"]
                - u32: ["メッセージ ID", 2, "2", "要求と応答の組を対応づける番号。再送の検出にも使う"]
                - len: [長さ, 4, "IKE メッセージ全体の長さ", {from: rest}]
            - name: "ペイロード: SK (暗号化されたペイロード)"
              fields:
                - u8: [次ペイロード, 0, "0 (なし)"]
                - u8: [クリティカル / 予約, 0, "0"]
                - len: [ペイロード長, 2, "このペイロードの長さ"]
                - blob: [IV, iv-info-false, 8, "(8 バイト)"]
                - blob: [暗号文, ct-info-false, 1, "(1 バイト) パディング長のみ"]
                - blob: [ICV, icv-info-false, 16, "(16 バイト)"]
      - kind: pkt
        from: gb
        to: ga
        color: violet
        label: INFORMATIONAL
        packet:
          summary: "INFORMATIONAL 応答 (空)"
          note: "中身が空の暗号化メッセージ。正しく復号・応答できること自体が「生きている」証拠になる (DPD: Dead Peer Detection)。"
          layers:
            - ipv4: {src: 203.0.113.20, dst: 198.51.100.10, proto: 17, id: 0x5d01}
            - udp: {sport: 500, dport: 500, sname: IKE, dname: IKE}
            - name: "IKEv2 ヘッダ"
              fields:
                - hex: ["イニシエータ SPI", d4671ec32c9f96dd, d4 67 1e c3 2c 9f 96 dd, "開始側が決めた 8 バイトの番号。この IKE SA を識別する"]
                - hex: ["レスポンダ SPI", c48c83d4ba16892c, c4 8c 83 d4 ba 16 89 2c, "応答側が決める番号"]
                - u8: [次ペイロード, 46, "46 (SK (暗号化))", "IKE はペイロードを数珠つなぎにする。各ペイロードが「次は何か」を持つ"]
                - u8: [バージョン, 0x20, "2.0"]
                - u8: [交換タイプ, 37, "37 (INFORMATIONAL)"]
                - u8: [フラグ, 0x20, "R (応答)"]
                - u32: ["メッセージ ID", 2, "2", "要求と応答の組を対応づける番号。再送の検出にも使う"]
                - len: [長さ, 4, "IKE メッセージ全体の長さ", {from: rest}]
            - name: "ペイロード: SK (暗号化されたペイロード)"
              fields:
                - u8: [次ペイロード, 0, "0 (なし)"]
                - u8: [クリティカル / 予約, 0, "0"]
                - len: [ペイロード長, 2, "このペイロードの長さ"]
                - blob: [IV, iv-info-true, 8, "(8 バイト)"]
                - blob: [暗号文, ct-info-true, 1, "(1 バイト) パディング長のみ"]
                - blob: [ICV, icv-info-true, 16, "(16 バイト)"]

outro:
  title: "2往復で鍵が決まり、あとは ESP で流すだけ"
  text: "IKEv2 は IKE_SA_INIT (方式と DH 鍵交換) と IKE_AUTH (本人確認と ESP の SA 作成) の2往復で、拠点間の暗号化トンネルを作りました。そのあとのデータは、カーネルが ESP で暗号化・復号するだけです。"
  points:
    - "IKE (鍵交換) はユーザー空間のデーモン、ESP (データの暗号化) はカーネルが担当する、という分業になっている"
    - "SA は片方向。SPI は「受け取る側」が決めた番号"
    - "途中に NAT があると ESP (プロトコル 50) は通りにくいので、UDP 4500 番に包む (NAT-T)"
    - "「つながらない」ときは、IKE の候補 (暗号方式) の不一致か、トラフィックセレクタ (TSi/TSr) の不一致が多い"
