name: Server Room Virtualization
description: Virtual machines running in a server room connected through a core switch

segments:
  - id: vlan-10
    label: staff
    vlan: 10
    prefix: "192.168.1.0/24"
    addresses:
      web-1:
        - "192.168.1.20"
  - id: vlan-30
    label: database
    vlan: 30
    prefix: "192.168.3.0/24"
    addresses:
      db-1: []

redundancy:
  - id: prod
    label: vSphere HA Cluster
    nodes:
      - esx-1
      - esx-2
      - esx-3

nodes:
  - id: core
    label: core
    type: switch
  - id: esx-1
    label: esx-1
    vendor: VMware
    type: host
  - id: esx-2
    label: esx-2
    vendor: VMware
    type: host
  - id: esx-3
    label: esx-3
    vendor: VMware
    type: host
  - id: web-1
    label: web-1
    type: vm
    host: esx-1
  - id: db-1
    label: db-1
    type: vm
    host: prod
  - id: mon-1
    label: mon-1
    type: vm
    assumed: true
    address: "10.99.0.50"

links:
  - endpoints:
      - node: core
      - node: esx-1
    speed: 25G
    segments:
      - vlan-10
      - vlan-30
  - endpoints:
      - node: core
      - node: esx-2
    speed: 25G
    segments:
      - vlan-10
      - vlan-30
  - endpoints:
      - node: core
      - node: esx-3
    speed: 25G
    segments:
      - vlan-10
      - vlan-30
