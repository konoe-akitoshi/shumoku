name: Company Network (On-premises + AWS Tokyo)
description: |
  On-premises server room with Dell hypervisors running a Palo Alto firewall and Ubuntu VM,
  connected via Site-to-Site VPN to AWS Tokyo region (VPC main with two subnets).

groups:
  - id: onprem
    label: On-premises
  - id: aws
    label: AWS Asia Pacific
  - id: ap-northeast-1a
    label: ap-northeast-1a
    parent: aws
  - id: ap-northeast-1c
    label: ap-northeast-1c
    parent: aws

segments:
  - id: vlan10
    label: VLAN 10
    vlan: 10
    prefix: 192.168.10.0/24
    group: onprem
    addresses:
      rt-1: []
      hv-1: []
      hv-2: []
      fw-v:
        - 192.168.10.2
      app-1:
        - 192.168.10.20
  - id: sub-a
    label: sub-a (10.0.1.0/24)
    prefix: 10.0.1.0/24
    group: ap-northeast-1a
    addresses:
      igw-1: []
      tgw-1: []
      web-c:
        - 10.0.1.10
  - id: sub-c
    label: sub-c (10.0.2.0/24)
    prefix: 10.0.2.0/24
    group: ap-northeast-1c
    addresses:
      igw-1: []
      tgw-1: []
      db-c:
        - 10.0.2.20

redundancy:
  - id: prod
    label: prod (vSphere HA)
    nodes:
      - hv-1
      - hv-2

nodes:
  - id: rt-1
    label: rt-1
    type: router
    product: yamaha/rtx3510
    group: onprem
  - id: hv-1
    label: hv-1
    type: hypervisor
    product: dell/poweredge/r750
    software: vmware/esxi
    group: onprem
  - id: hv-2
    label: hv-2
    type: hypervisor
    product: dell/poweredge/r750
    software: vmware/esxi
    group: onprem
  - id: fw-v
    label: fw-v
    type: firewall
    product: paloaltonetworks/vm-series
    host: hv-1
  - id: app-1
    label: app-1
    type: vm
    software: ubuntu
    host: prod
  - id: igw-1
    label: igw-1
    type: gateway
    product: amazon/internet-gateway
  - id: tgw-1
    label: tgw-1
    type: gateway
    product: amazon/transit-gateway
  - id: web-c
    label: web-c
    type: vm
    product: amazon/ec2/t3.medium
    software: amazon-linux
    group: ap-northeast-1a
  - id: db-c
    label: db-c
    type: database
    product: amazon/rds/mysql
    group: ap-northeast-1c

links:
  - endpoints:
      - node: hv-1
      - node: rt-1
    speed: 10G
    segments:
      - vlan10
  - endpoints:
      - node: hv-2
      - node: rt-1
    speed: 10G
    segments:
      - vlan10
  - endpoints:
      - node: rt-1
      - node: tgw-1
    virtual: true
    description: IPsec tunnel 1
  - endpoints:
      - node: rt-1
      - node: tgw-1
    virtual: true
    description: IPsec tunnel 2
