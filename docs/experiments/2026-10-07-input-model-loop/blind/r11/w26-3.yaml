name: network

groups:
  - id: headquarters
    label: 本社
  - id: server-room
    label: サーバ室
    parent: headquarters
  - id: aws-tokyo
    label: AWS 東京
  - id: ap-northeast-1a
    label: ap-northeast-1a
    parent: aws-tokyo

routingDomains:
  - id: guest
    label: guest
  - id: main
    label: main
    prefix: 10.0.0.0/16

segments:
  - id: vlan10
    label: VLAN 10（業務）
    vlan: 10
    prefix: 192.168.10.0/24
    group: server-room
    addresses:
      web-1: 192.168.10.20
  - id: vlan20
    label: VLAN 20（来客）
    vlan: 20
    routingDomain: guest
    group: server-room
  - id: sub-a
    label: sub-a
    prefix: 10.0.1.0/24
    routingDomain: main
    group: ap-northeast-1a

nodes:
  - id: rt-1
    type: router
    product: yamaha/rtx3510
    group: server-room
  - id: sw-1
    type: switch
    product: ?/swx2322p-16mt
    group: server-room
  - id: hv-1
    type: server
    product: dell/poweredge-r750
    software: VMware ESXi
    group: server-room
  - id: web-1
    type: vm
    host: hv-1
    group: server-room
  - id: pdu-1
    type: pdu
    group: server-room
  - id: igw-1
    type: internet-gateway
    group: aws-tokyo
  - id: vgw-1
    type: vpn-gateway
    group: aws-tokyo

connections:
  - id: site-to-site-vpn
    label: IPsec Site-to-Site VPN

links:
  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: port 1
    speed: 1G
    cable: cat6
    length: 3m
    segments:
      - vlan10
      - vlan20
  - endpoints:
      - node: hv-1
      - node: sw-1
    speed: 10G
    segments:
      - vlan10
  - endpoints:
      - node: rt-1
      - node: pdu-1
        port: コンセント 1
    cable: power
  - endpoints:
      - node: sw-1
      - node: pdu-1
        port: コンセント 2
    cable: power
  - endpoints:
      - node: igw-1
      - routingDomain: main
  - endpoints:
      - node: vgw-1
      - routingDomain: main
  - endpoints:
      - node: rt-1
      - node: vgw-1
    virtual: true
    assumed: true
    connection: site-to-site-vpn
    description: IPsec トンネル 1
  - endpoints:
      - node: rt-1
      - node: vgw-1
    virtual: true
    assumed: true
    connection: site-to-site-vpn
    description: IPsec トンネル 2

view:
  - match:
      cable: power
    stroke: gray
  - match:
      segment: vlan20
    stroke: orange
  - match:
      virtual: true
    dashed: true
