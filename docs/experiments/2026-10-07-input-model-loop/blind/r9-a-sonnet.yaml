name: Server room virtualization
groups:
  - id: server-room
    label: Server room
segments:
  - id: vlan10
    label: staff
    vlan: 10
    prefix: 192.168.1.0/24
    addresses:
      web-1: [192.168.1.20]
  - id: vlan30
    label: database
    vlan: 30
    prefix: 192.168.3.0/24
    addresses:
      db-1: []
redundancy:
  - id: prod
    label: prod (vSphere HA cluster)
    nodes: [esx-1, esx-2, esx-3]
nodes:
  - id: core
    label: core
    type: switch
    group: server-room
  - id: esx-1
    type: hypervisor
    vendor: VMware
    model: ESXi
    group: server-room
  - id: esx-2
    type: hypervisor
    vendor: VMware
    model: ESXi
    group: server-room
  - id: esx-3
    type: hypervisor
    vendor: VMware
    model: ESXi
    group: server-room
  - id: web-1
    type: vm
  - id: db-1
    type: vm
  - id: mon-1
    type: vm
    address: 10.99.0.50
links:
  - endpoints: [{ node: core }, { node: esx-1 }]
    speed: 25G
    segments: [vlan10, vlan30]
  - endpoints: [{ node: core }, { node: esx-2 }]
    speed: 25G
    segments: [vlan10, vlan30]
  - endpoints: [{ node: core }, { node: esx-3 }]
    speed: 25G
    segments: [vlan10, vlan30]
  - endpoints: [{ node: web-1 }, { node: esx-1 }]
    virtual: true
    segments: [vlan10]
