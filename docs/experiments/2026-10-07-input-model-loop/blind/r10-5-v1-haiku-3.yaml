name: Hybrid Infrastructure
description: Company on-premises server room with AWS Tokyo deployment

groups:
  - id: on-premises
    label: On-Premises
  - id: aws-tokyo
    label: AWS Tokyo Region
  - id: ap-northeast-1a
    label: ap-northeast-1a
    parent: aws-tokyo
  - id: ap-northeast-1c
    label: ap-northeast-1c
    parent: aws-tokyo

segments:
  - id: vlan-10
    label: VLAN 10
    vlan: 10
    prefix: 192.168.10.0/24
    group: on-premises
    addresses:
      fw-v: ["192.168.10.2"]
      app-1: ["192.168.10.20"]
  - id: sub-a
    label: Subnet A (ap-northeast-1a)
    prefix: 10.0.1.0/24
    group: ap-northeast-1a
    addresses:
      web-c: ["10.0.1.10"]
  - id: sub-c
    label: Subnet C (ap-northeast-1c)
    prefix: 10.0.2.0/24
    group: ap-northeast-1c
    addresses:
      db-c: ["10.0.2.20"]

redundancy:
  - id: prod
    label: vSphere HA Cluster prod
    nodes: ["hv-1", "hv-2"]

nodes:
  - id: rt-1
    label: rt-1
    type: router
    product: yamaha/rtx3510
    group: on-premises
  - id: hv-1
    label: hv-1
    type: server
    product: dell/poweredge/r750
    software: vmware-esxi
    group: on-premises
  - id: hv-2
    label: hv-2
    type: server
    product: dell/poweredge/r750
    software: vmware-esxi
    group: on-premises
  - id: fw-v
    label: fw-v
    type: firewall
    product: paloaltonetworks/vm-series
    software: panos
    host: hv-1
  - id: app-1
    label: app-1
    type: vm
    software: ubuntu
    host: prod
  - id: main-vpc
    label: main-vpc
    type: vpc
    product: aws/vpc
    prefix: 10.0.0.0/16
    group: aws-tokyo
  - id: web-c
    label: web-c
    type: ec2
    product: aws/ec2
    software: amazon-linux
    group: ap-northeast-1a
  - id: db-c
    label: db-c
    type: rds
    product: aws/rds/mysql
    group: ap-northeast-1c
  - id: igw-1
    label: igw-1
    type: internet-gateway
    product: aws/internet-gateway
    group: aws-tokyo
  - id: tgw-1
    label: tgw-1
    type: transit-gateway
    product: aws/transit-gateway
    group: aws-tokyo

links:
  - endpoints: [{node: "rt-1"}, {node: "hv-1"}]
    speed: 10G
    segments: ["vlan-10"]
  - endpoints: [{node: "rt-1"}, {node: "hv-2"}]
    speed: 10G
    segments: ["vlan-10"]
  - endpoints: [{node: "rt-1"}, {node: "tgw-1"}]
    virtual: true
    description: "IPsec tunnel 1"
  - endpoints: [{node: "rt-1"}, {node: "tgw-1"}]
    virtual: true
    description: "IPsec tunnel 2"
