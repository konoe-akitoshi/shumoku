groups:
  - id: dc-a
    label: DC-A

segments:
  - id: ix-t-peering
    label: IX-T peering LAN
    prefix: 198.51.100.0/24
    addresses:
      br2: 198.51.100.10
      as64520-router: 198.51.100.20
      as64530-router: 198.51.100.30

nodes:
  - id: br1
    label: br1
    type: router
    asn: 64500
    group: dc-a
  - id: br2
    label: br2
    type: router
    asn: 64500
    group: dc-a
  - id: as64510-router
    type: router
    asn: 64510
  - id: as64520-router
    asn: 64520
  - id: as64530-router
    asn: 64530
    description: We have no session with AS64530.
  - id: as64540-router
    asn: 64540

links:
  - endpoints:
      - node: br1
        port: xe-0/0/0
      - node: as64510-router
    speed: 10G
    description: Carries the eBGP session with our transit provider AS64510.
  - endpoints:
      - node: br1
      - node: as64510-router
    virtual: true
    description: eBGP session over the 10G cable; we are AS64510's transit customer.
  - endpoints:
      - node: br2
      - node: as64520-router
    segments:
      - ix-t-peering
    virtual: true
    description: Settlement-free eBGP peering over IX-T.
  - endpoints:
      - node: br2
      - node: as64540-router
    virtual: true
    description: eBGP session with our transit provider AS64540; underlying path unknown.
