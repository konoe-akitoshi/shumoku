name: company
groups:
  - id: server-room
    label: Server room
networks:
  - id: staff-network
    prefix: 192.168.1.0/24
  - id: database-network
    prefix: 192.168.3.0/24
segments:
  - id: vlan-10
    label: staff
    vlan: 10
    prefix: 192.168.1.0/24
    addresses:
      web-1: 192.168.1.20
  - id: vlan-30
    label: database
    vlan: 30
    prefix: 192.168.3.0/24
    addresses:
      mon-1: 10.99.0.50
redundancy:
  - id: prod
    label: prod
    nodes: [esx-1, esx-2, esx-3]
nodes:
  - id: core
    group: server-room
  - id: esx-1
    label: esx-1
    software: VMware ESXi
    group: server-room
  - id: esx-2
    label: esx-2
    software: VMware ESXi
    group: server-room
  - id: esx-3
    label: esx-3
    software: VMware ESXi
    group: server-room
  - id: web-1
    group: server-room
    host: esx-1
    segments: [vlan-10]
  - id: db-1
    group: server-room
    host: prod
    segments: [vlan-30]
  - id: mon-1
    address: 10.99.0.50
links:
  - endpoints:
      - node: core
      - node: esx-1
    speed: 25G
    segments: [vlan-10, vlan-30]
  - endpoints:
      - node: core
      - node: esx-2
    speed: 25G
    segments: [vlan-10, vlan-30]
  - endpoints:
      - node: core
      - node: esx-3
    speed: 25G
    segments: [vlan-10, vlan-30]
