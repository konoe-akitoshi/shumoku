groups:
  - { id: head-office }
  - { id: server-room, parent: head-office }
  - { id: branch }
  - { id: branch-2f, parent: branch }
segments:
  - id: staff
    vlan: 10
    prefix: 192.168.1.0/24
    addresses: { fw-ha: 192.168.1.1, fw-1: 192.168.1.2, fw-2: 192.168.1.3, web-1: 192.168.1.20 }
  - { id: voice, vlan: 20 }
redundancy:
  - { id: fw-ha, nodes: [fw-1, fw-2] }
nodes:
  - { id: fw-1, type: firewall, vendor: paloalto, model: pa-3220, group: server-room }
  - { id: fw-2, type: firewall, vendor: paloalto, model: pa-3220, group: server-room }
  - { id: core, type: l3-switch, members: [sw-a, sw-b], address: 10.99.0.2, group: server-room }
  - { id: esx-1, type: server, group: server-room }
  - { id: web-1, type: server }
  - { id: br-rt, type: router, group: branch }
  - { id: ap, type: access-point, assumed: true, group: branch-2f }
links:
  - endpoints: [{ node: fw-1, port: ethernet1/1 }, { node: core }]
    speed: 10G
    segments: [staff, voice]
  - endpoints: [{ node: fw-2 }, { node: core }]
  - endpoints: [{ node: esx-1 }, { node: core }]
    speed: 25G
    segments: [staff]
  - endpoints: [{ node: esx-1, port: vSwitch0 }, { node: web-1 }]
    segments: [staff]
    virtual: true
  - endpoints: [{ node: br-rt, port: tun0 }, { node: fw-1, port: tun0 }]
    virtual: true
