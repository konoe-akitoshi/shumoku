name: Company On-Premises and AWS Network
description: On-premises server room with VMware cluster and AWS Tokyo region integration via Site-to-Site VPN

groups:
  - id: on-prem-room
    label: Server Room
  - id: aws-ap-ne-1a
    label: AWS ap-northeast-1a
  - id: aws-ap-ne-1c
    label: AWS ap-northeast-1c

segments:
  - id: vlan-10
    label: VLAN 10
    vlan: 10
    prefix: 192.168.10.0/24
    addresses:
      rt-1: []
      hv-1: []
      hv-2: []
      fw-v: [192.168.10.2]
      app-1: [192.168.10.20]
  - id: sub-a
    label: sub-a
    prefix: 10.0.1.0/24
    group: aws-ap-ne-1a
    addresses:
      tgw-1: []
      web-c: [10.0.1.10]
  - id: sub-c
    label: sub-c
    prefix: 10.0.2.0/24
    group: aws-ap-ne-1c
    addresses:
      tgw-1: []
      db-c: [10.0.2.20]

redundancy:
  - id: prod
    label: vSphere HA Cluster prod
    nodes: [hv-1, hv-2]

nodes:
  - id: rt-1
    label: rt-1
    type: router
    product: yamaha/rtx3510
    group: on-prem-room
  - id: hv-1
    label: hv-1
    type: hypervisor
    product: dell/poweredge-r750
    software: VMware ESXi
    group: on-prem-room
  - id: hv-2
    label: hv-2
    type: hypervisor
    product: dell/poweredge-r750
    software: VMware ESXi
    group: on-prem-room
  - id: fw-v
    label: fw-v
    type: firewall
    product: paloaltonetworks/vm-series
    software: Palo Alto Networks VM-Series
    host: hv-1
  - id: app-1
    label: app-1
    type: vm
    software: Ubuntu
    host: prod
  - id: web-c
    label: web-c
    type: server
    product: aws/ec2/t3.medium
    software: Amazon Linux
    group: aws-ap-ne-1a
  - id: db-c
    label: db-c
    type: database
    product: aws/rds/mysql
    group: aws-ap-ne-1c
  - id: igw-1
    label: igw-1
    type: gateway
    product: aws/internet-gateway
  - id: tgw-1
    label: tgw-1
    type: transit-gateway
    product: aws/transit-gateway

links:
  - endpoints: [{node: rt-1}, {node: hv-1}]
    speed: 10G
    segments: [vlan-10]
  - endpoints: [{node: rt-1}, {node: hv-2}]
    speed: 10G
    segments: [vlan-10]
  - endpoints: [{node: rt-1}, {node: tgw-1}]
    virtual: true
    description: IPsec tunnel 1
  - endpoints: [{node: rt-1}, {node: tgw-1}]
    virtual: true
    description: IPsec tunnel 2
