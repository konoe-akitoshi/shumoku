name: Small branch
groups:
  - id: headquarters
    label: Headquarters
routingDomains:
  - id: branch
    label: Branch
  - id: hq
    label: Headquarters
connections:
  - id: ipsec-tunnel
    label: IPsec tunnel
segments:
  - id: office
    label: Office
    vlan: 10
  - id: voice
    label: Voice
    vlan: 20
nodes:
  - id: onu
    label: ONU
    type: onu
  - id: rt-1
    label: Router
    type: router
    styles: [router-icon]
  - id: sw-1
    label: Switch
    type: switch
  - id: srv-1
    label: Server
    type: server
  - id: hq-rt
    label: Headquarters router
    type: router
    group: headquarters
  - id: pdu-1
    label: PDU
    type: pdu
links:
  - endpoints:
      - node: onu
      - node: rt-1
        port: lan2
    cable: fiber
    length: 2m
    styles: [onu-cable]
  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: xe-0/2/3
    speed: 10G
    cable: copper
    segments: [office, voice]
    styles: [power?]
  - endpoints:
      - node: sw-1
        port: ge-0/0/1
      - node: srv-1
    speed: 1G
    segments: [office]
  - endpoints:
      - node: rt-1
      - node: hq-rt
    connection: ipsec-tunnel
    virtual: true
    styles: [tunnel]
  - endpoints:
      - node: pdu-1
        port: outlet 1
      - node: rt-1
    cable: power
    styles: [power]
  - endpoints:
      - node: pdu-1
        port: outlet 2
      - node: sw-1
    cable: power
    styles: [power]
  - endpoints:
      - node: pdu-1
        port: outlet 3
      - node: srv-1
    cable: power
    styles: [power]
view:
  styles:
    power:
      stroke: gray
    vlan-10:
      stroke: blue
    onu-cable:
      stroke: magenta
    tunnel:
      dashed: true
    router-icon:
      icon: https://example.com/rt.svg
