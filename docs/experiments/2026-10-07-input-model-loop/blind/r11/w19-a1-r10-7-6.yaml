name: company-network
description: On-premises server room and AWS in the Tokyo region

routingDomains:
  - id: guest
    label: guest
  - id: main
    label: main routing table
  - id: main
    label: main
    prefix: 10.0.0.0/16

groups:
  - id: server-room
    label: Server room
  - id: ap-northeast-1a
    label: ap-northeast-1a
  - id: ap-northeast-1c
    label: ap-northeast-1c

segments:
  - id: vlan-20
    label: VLAN 20
    vlan: 20
    prefix: 192.168.20.0/24
    routingDomain: guest
    group: server-room
    addresses:
      ap-1: 192.168.20.5
  - id: vlan-10
    label: VLAN 10
    vlan: 10
    prefix: 192.168.10.0/24
    routingDomain: main
    group: server-room
    addresses:
      fw-v: 192.168.10.2
      app-1: 192.168.10.20
      hv-1: []
      hv-2: []
  - id: sub-a
    label: sub-a
    prefix: 10.0.1.0/24
    routingDomain: main
    group: ap-northeast-1a
    addresses:
      web-c: 10.0.1.10
  - id: sub-c
    label: sub-c
    prefix: 10.0.2.0/24
    routingDomain: main
    group: ap-northeast-1c
    addresses:
      db-c: 10.0.2.20

nodes:
  - id: rt-1
    label: rt-1
    type: router
    product: yamaha/rtx3510
    group: server-room
  - id: ap-1
    label: ap-1
    type: access-point
    group: server-room
  - id: hv-1
    label: hv-1
    type: server
    product: dell/poweredge-r750
    software: vmware/esxi
    group: server-room
    members: []
  - id: hv-2
    label: hv-2
    type: server
    product: dell/poweredge-r750
    software: vmware/esxi
    group: server-room
    members: []
  - id: fw-v
    label: fw-v
    type: firewall
    product: palo-alto-networks/vm-series
    host: hv-1
    group: server-room
  - id: app-1
    label: app-1
    type: server
    software: ubuntu
    host: prod
    group: server-room
  - id: web-c
    label: web-c
    type: instance
    product: aws/ec2/t3.medium
    software: amazon-linux
    group: ap-northeast-1a
  - id: db-c
    label: db-c
    type: database
    product: aws/rds/mysql
    group: ap-northeast-1c
  - id: igw-1
    label: igw-1
    type: internet-gateway
    product: aws/internet-gateway
  - id: tgw-1
    label: tgw-1
    type: transit-gateway
    product: aws/transit-gateway
  - id: prod
    label: prod
    type: redundancy

redundancy:
  - id: prod
    label: prod
    nodes:
      - hv-1
      - hv-2

connections:
  - id: rt-1-tgw-1-vpn
    label: Site-to-Site VPN

links:
  - endpoints:
      - node: rt-1
        port: lan2
      - segment: vlan-20
  - endpoints:
      - node: rt-1
      - node: hv-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: rt-1
      - node: hv-2
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: fw-v
      - segment: vlan-10
    virtual: true
  - endpoints:
      - node: app-1
      - segment: vlan-10
    virtual: true
  - endpoints:
      - node: igw-1
      - routingDomain: main
  - endpoints:
      - node: tgw-1
      - segment: sub-a
  - endpoints:
      - node: tgw-1
      - segment: sub-c
  - endpoints:
      - node: rt-1
      - node: tgw-1
    connection: rt-1-tgw-1-vpn
    virtual: true
  - endpoints:
      - node: rt-1
      - node: tgw-1
    connection: rt-1-tgw-1-vpn
    virtual: true
