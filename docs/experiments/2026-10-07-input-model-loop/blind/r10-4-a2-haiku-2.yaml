name: On-Premises + AWS Tokyo
description: Server room with vSphere cluster and AWS VPC with Site-to-Site VPN

groups:
  - id: on-premises
    label: Server Room
  - id: ap-northeast-1a
    label: AWS Tokyo 1a
  - id: ap-northeast-1c
    label: AWS Tokyo 1c

segments:
  - id: vlan-10
    label: VLAN 10
    vlan: 10
    prefix: 192.168.10.0/24
    group: on-premises
    addresses:
      rt-1:
        - 192.168.10.1
      hv-1:
        - 192.168.10.3
      hv-2:
        - 192.168.10.4
      fw-v:
        - 192.168.10.2
      app-1:
        - 192.168.10.20
  - id: sub-a
    label: Subnet A
    prefix: 10.0.1.0/24
    group: ap-northeast-1a
    addresses:
      main:
        - 10.0.1.1
      web-c:
        - 10.0.1.10
      tgw-1: []
  - id: sub-c
    label: Subnet C
    prefix: 10.0.2.0/24
    group: ap-northeast-1c
    addresses:
      main:
        - 10.0.2.1
      db-c:
        - 10.0.2.20
      tgw-1: []

redundancy:
  - id: prod
    label: vSphere HA Cluster (prod)
    nodes:
      - hv-1
      - hv-2

nodes:
  - id: rt-1
    label: rt-1
    type: router
    product: yamaha/rtx3510
    group: on-premises
  - id: hv-1
    label: hv-1
    type: hypervisor
    product: dell/poweredge/r750
    software: vmware-esxi
    group: on-premises
  - id: hv-2
    label: hv-2
    type: hypervisor
    product: dell/poweredge/r750
    software: vmware-esxi
    group: on-premises
  - id: fw-v
    label: fw-v
    type: firewall
    product: paloaltonetworks/vm-series
    software: pan-os
    host: hv-1
  - id: app-1
    label: app-1
    type: vm
    software: ubuntu
    host: prod
  - id: main
    label: main
    type: vpc
    product: aws/vpc
    prefix: 10.0.0.0/16
  - id: web-c
    label: web-c
    type: instance
    product: aws/ec2/t3.medium
    software: amazon-linux
  - id: db-c
    label: db-c
    type: database
    product: aws/rds/mysql
    software: mysql
  - id: igw-1
    label: igw-1
    type: internet-gateway
    product: aws/internet-gateway
  - id: tgw-1
    label: tgw-1
    type: transit-gateway
    product: aws/transit-gateway

links:
  - endpoints:
      - node: rt-1
      - node: hv-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: rt-1
      - node: hv-2
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: rt-1
      - node: tgw-1
    virtual: true
    description: Site-to-Site VPN (2 IPsec tunnels)
  - endpoints:
      - node: main
      - node: igw-1
    virtual: true
    description: Internet Gateway attachment to VPC
