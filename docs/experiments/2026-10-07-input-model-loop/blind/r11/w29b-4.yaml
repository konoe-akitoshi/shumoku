name: Network
autonomousSystems:
  - asn: 64500
  - asn: 64510
  - asn: 64520
  - asn: 64530
  - asn: 64540
groups:
  - id: DC-A
  - id: IX-T
routingDomains:
  - id: IX-T-peering
    label: IX-T peering LAN
    prefix: 198.51.100.0/24
segments:
  - id: IX-T-peering-LAN
    label: IX-T peering LAN
    prefix: 198.51.100.0/24
    addresses:
      br2: 198.51.100.10
      as64520-router: 198.51.100.20
      as64530-router: 198.51.100.30
nodes:
  - id: br1
    as: 64500
    group: DC-A
  - id: br2
    as: 64500
    group: DC-A
  - id: as64510-router
    as: 64510
    assumed: true
  - id: as64520-router
    as: 64520
  - id: as64530-router
    as: 64530
links:
  - endpoints:
      - node: br1
        port: xe-0/0/0
      - node: as64510-router
    speed: 10G
    connection: as64510-ebgp
  - endpoints:
      - node: br2
      - segment: IX-T-peering-LAN
    segments:
      - IX-T-peering-LAN
  - endpoints:
      - node: br2
      - node: as64520-router
    segments:
      - IX-T-peering-LAN
    connection: as64520-ebgp
  - endpoints:
      - node: br2
      - node: as64540
    assumed: true
    connection: as64540-ebgp
connections:
  - id: as64510-ebgp
    label: AS64510 eBGP session
  - id: as64520-ebgp
    label: AS64520 eBGP session
  - id: as64540-ebgp
    label: AS64540 eBGP session
