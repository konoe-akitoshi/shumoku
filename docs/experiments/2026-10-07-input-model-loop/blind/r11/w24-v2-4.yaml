name: Small branch
groups:
  - id: headquarters
    label: Headquarters

segments:
  - id: vlan-10
    label: office
    vlan: 10
  - id: vlan-20
    label: voice
    vlan: 20

nodes:
  - id: onu
    label: ONU
  - id: rt-1
    label: Router
    styles: [router-icon]
  - id: sw-1
    label: Switch
  - id: srv-1
    label: Server
  - id: hq-rt
    label: Headquarters router
    group: headquarters
  - id: pdu-1
    label: PDU

links:
  - endpoints:
      - node: onu
      - node: rt-1
        port: lan2
    cable: fiber
    length: 2m
    styles: [onu-cable]

  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: xe-0/2/3
    speed: 10G
    segments: [vlan-10, vlan-20]
    styles: [vlan-10-link]

  - endpoints:
      - node: sw-1
        port: ge-0/0/1
      - node: srv-1
    speed: 1G
    segments: [vlan-10]
    styles: [vlan-10-link]

  - endpoints:
      - node: rt-1
      - node: hq-rt
    connection: ipsec-tunnel
    virtual: true
    styles: [tunnel]

  - endpoints:
      - node: pdu-1
      - node: rt-1
        port: power
    cable: power
    styles: [power-link]

  - endpoints:
      - node: pdu-1
      - node: sw-1
        port: power
    cable: power
    styles: [power-link]

  - endpoints:
      - node: pdu-1
      - node: srv-1
        port: power
    cable: power
    styles: [power-link]

connections:
  - id: ipsec-tunnel
    label: IPsec tunnel

view:
  styles:
    router-icon:
      icon: https://example.com/rt.svg
    power-link:
      stroke: gray
    vlan-10-link:
      stroke: blue
    onu-cable:
      stroke: magenta
    tunnel:
      dashed: true
