name: Company network
groups:
  - id: head-office
    label: Head office
  - id: server-room
    label: Server room
    parent: head-office
  - id: branch
    label: Branch
  - id: second-floor
    label: 2nd floor
    parent: branch
routingDomains:
  - id: head-office-lan
  - id: branch-lan
connections:
  - id: ipsec
    label: IPsec tunnel
segments:
  - id: vlan-10
    label: Staff
    vlan: 10
    prefix: 192.168.1.0/24
    routingDomain: head-office-lan
    group: server-room
    addresses:
      fw-1: 192.168.1.2
      fw-2: 192.168.1.3
      ha-firewalls: 192.168.1.1
      web-1: 192.168.1.20
  - id: vlan-20
    label: Voice
    vlan: 20
    routingDomain: head-office-lan
    group: server-room
  - id: branch-lan-unknown
    routingDomain: branch-lan
redundancy:
  - id: ha-firewalls
    label: Firewall HA pair
    nodes:
      - fw-1
      - fw-2
nodes:
  - id: fw-1
    label: fw-1
    product: palo-alto/pa-3220
    routingDomain: head-office-lan
    group: server-room
  - id: fw-2
    label: fw-2
    product: palo-alto/pa-3220
    routingDomain: head-office-lan
    group: server-room
  - id: core
    label: core
    type: switch
    address: 10.99.0.2
    group: server-room
    members:
      - sw-a
      - sw-b
  - id: esx-1
    label: esx-1
    type: virtualization-host
    routingDomain: head-office-lan
    group: server-room
  - id: web-1
    label: web-1
    type: virtual-machine
    host: esx-1
    group: server-room
  - id: br-rt
    label: br-rt
    type: router
    routingDomain: branch-lan
    group: branch
  - id: ap-1
    label: Access point
    type: access-point
    group: second-floor
    assumed: true
links:
  - endpoints:
      - node: fw-1
        port: ethernet1/1
      - node: core
    speed: 10G
    segments:
      - vlan-10
      - vlan-20
  - endpoints:
      - node: fw-2
      - node: core
    assumed: true
  - endpoints:
      - node: esx-1
      - node: core
    speed: 25G
    segments:
      - vlan-10
  - endpoints:
      - node: web-1
        port: vSwitch0
      - node: vlan-10
    segments:
      - vlan-10
  - endpoints:
      - node: br-rt
      - node: fw-1
        port: tun0
    connection: ipsec
    virtual: true
