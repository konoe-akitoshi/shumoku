name: 本社
groups:
  - id: server-room
    label: サーバ室
nodes:
  - id: rt-1
    label: rt-1
    type: router
    product: Yamaha/RTX3510
    group: server-room
  - id: sw-1
    label: sw-1
    type: switch
    product: SWX2322P-16MT
    group: server-room
  - id: hv-1
    label: hv-1
    type: server
    product: Dell/PowerEdge R750
    software: VMware ESXi
    group: server-room
  - id: web-1
    label: web-1
    type: vm
    address: 192.168.10.20
    group: server-room
  - id: vpc-main
    label: main
    type: vpc
    address: 10.0.0.0/16
  - id: sub-a
    label: sub-a
    type: subnet
    address: 10.0.1.0/24
    availabilityZone: ap-northeast-1a
  - id: igw-1
    label: igw-1
    type: internet-gateway
  - id: vgw-1
    label: vgw-1
    type: virtual-private-gateway
links:
  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: '1'
    speed: 1G
    medium: Cat6
    length: 3m
    vlans:
      - id: 10
        label: 業務
        address: 192.168.10.0/24
      - id: 20
        label: 来客
        vrf: guest
        vrfNode: rt-1
  - endpoints:
      - node: sw-1
        port: unknown
      - node: hv-1
    speed: 10G
  - endpoints:
      - node: hv-1
      - node: web-1
    portGroup:
      vlan: 10
  - endpoints:
      - node: web-1
      - node: sw-1
    address: 192.168.10.20
  - endpoints:
      - node: igw-1
      - node: vpc-main
  - endpoints:
      - node: sub-a
      - node: vpc-main
  - endpoints:
      - node: rt-1
      - node: vgw-1
    protocol: IPsec
    type: site-to-site-vpn
    tunnels: 2
  - endpoints:
      - node: vgw-1
      - node: vpc-main
