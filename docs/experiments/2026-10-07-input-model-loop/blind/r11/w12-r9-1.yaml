name: server room
redundancy:
  - id: prod
    label: prod
    nodes: [esx-1, esx-2, esx-3]
segments:
  - id: vlan-10
    label: staff
    vlan: 10
    prefix: 192.168.1.0/24
    addresses:
      web-1: 192.168.1.20
  - id: vlan-30
    label: database
    vlan: 30
    prefix: 192.168.3.0/24
nodes:
  - id: core
    type: switch
  - id: esx-1
    type: server
    software: VMware ESXi
  - id: esx-2
    type: server
    software: VMware ESXi
  - id: esx-3
    type: server
    software: VMware ESXi
  - id: web-1
    type: vm
    host: esx-1
  - id: db-1
    type: vm
    host: prod
  - id: mon-1
    type: vm
    address: 10.99.0.50
links:
  - endpoints:
      - node: core
      - node: esx-1
    speed: 25G
    segments: [vlan-10, vlan-30]
  - endpoints:
      - node: core
      - node: esx-2
    speed: 25G
    segments: [vlan-10, vlan-30]
  - endpoints:
      - node: core
      - node: esx-3
    speed: 25G
    segments: [vlan-10, vlan-30]
