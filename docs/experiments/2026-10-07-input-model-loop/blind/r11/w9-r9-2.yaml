name: Company network
groups:
  - id: server-room
    label: Server room

networks:
  - id: staff-network
    prefix: 192.168.1.0/24
  - id: database-network
    prefix: 192.168.3.0/24

segments:
  - id: vlan-10
    label: Staff
    vlan: 10
    prefix: 192.168.1.0/24
    network: staff-network
    addresses:
      web-1: 192.168.1.20

  - id: vlan-30
    label: Database
    vlan: 30
    prefix: 192.168.3.0/24
    network: database-network

nodes:
  - id: core
    type: switch
    group: server-room

  - id: esx-1
    type: virtualization-host
    product: vmware
    software: VMware ESXi
    group: server-room
    segments:
      - vlan-10
      - vlan-30
    members: []

  - id: esx-2
    type: virtualization-host
    product: vmware
    software: VMware ESXi
    group: server-room
    segments:
      - vlan-10
      - vlan-30

  - id: esx-3
    type: virtualization-host
    product: vmware
    software: VMware ESXi
    group: server-room
    segments:
      - vlan-10
      - vlan-30

  - id: web-1
    type: virtual-machine
    host: esx-1

  - id: db-1
    type: virtual-machine
    host: prod

  - id: mon-1
    type: virtual-machine
    address: 10.99.0.50

redundancy:
  - id: prod
    label: prod
    nodes:
      - esx-1
      - esx-2
      - esx-3

links:
  - endpoints:
      - node: core
      - node: esx-1
    speed: 25G
    segments:
      - vlan-10
      - vlan-30

  - endpoints:
      - node: core
      - node: esx-2
    speed: 25G
    segments:
      - vlan-10
      - vlan-30

  - endpoints:
      - node: core
      - node: esx-3
    speed: 25G
    segments:
      - vlan-10
      - vlan-30
