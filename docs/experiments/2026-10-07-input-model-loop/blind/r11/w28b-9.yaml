autonomousSystems:
  - asn: 64500
  - asn: 64510
    label: Transit provider
  - asn: 64520
  - asn: 64530
  - asn: 64540
    label: Transit provider

groups:
  - id: dc-a
    label: DC-A

segments:
  - id: ix-t-lan
    label: IX-T peering LAN
    prefix: 198.51.100.0/24
    addresses:
      br2: 198.51.100.10
      as64520-router: 198.51.100.20
      as64530-router: 198.51.100.30

nodes:
  - id: br1
    label: br1
    type: router
    as: 64500
    group: dc-a
  - id: br2
    label: br2
    type: router
    as: 64500
    group: dc-a
  - id: as64510-router
    type: router
    as: 64510
  - id: as64520-router
    as: 64520
  - id: as64530-router
    as: 64530

links:
  - endpoints:
      - node: br1
        port: xe-0/0/0
      - node: as64510-router
    speed: 10G
  - endpoints:
      - node: br1
      - node: as64510-router
    virtual: true
    description: eBGP session over the 10G cable; AS64500 buys transit from AS64510.
  - endpoints:
      - node: br2
      - node: as64520-router
    virtual: true
    description: Settlement-free eBGP peering over IX-T.
  - endpoints:
      - node: br2
      - as: 64540
    virtual: true
    description: eBGP transit session; AS64500 buys transit from AS64540.
