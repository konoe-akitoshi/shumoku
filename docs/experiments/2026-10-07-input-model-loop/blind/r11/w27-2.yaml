name: AS64500
groups:
  - id: dc-a
    label: DC-A
  - id: ix-t
    label: IX-T

segments:
  - id: ix-t-peering-lan
    label: IX-T peering LAN
    prefix: 198.51.100.0/24
    addresses:
      br2: 198.51.100.10
      as64520: 198.51.100.20
      as64530: 198.51.100.30

nodes:
  - id: br1
    type: router
    group: dc-a
  - id: br2
    type: router
    group: dc-a
  - id: as64510-router
    type: router
    product: "?/router"
    assumed: true
    description: Router of AS64510; name unknown
  - id: as64520
    type: router
    description: AS64520 router on IX-T peering LAN
  - id: as64530
    type: router
    description: AS64530 router on IX-T peering LAN
  - id: as64540
    type: router
    description: AS64540 transit provider

connections:
  - id: ebgp-br1-as64510
    label: eBGP with AS64510
  - id: ebgp-br2-as64520
    label: Settlement-free eBGP peering with AS64520
  - id: ebgp-br2-as64540
    label: eBGP transit from AS64540

links:
  - endpoints:
      - node: br1
        port: xe-0/0/0
      - node: as64510-router
    speed: 10G
    connection: ebgp-br1-as64510
  - endpoints:
      - node: br2
      - segment: ix-t-peering-lan
    segments:
      - ix-t-peering-lan
  - endpoints:
      - node: as64520
      - segment: ix-t-peering-lan
    segments:
      - ix-t-peering-lan
    connection: ebgp-br2-as64520
  - endpoints:
      - node: as64530
      - segment: ix-t-peering-lan
    segments:
      - ix-t-peering-lan
  - endpoints:
      - node: br2
      - node: as64540
    assumed: true
    connection: ebgp-br2-as64540
