name: 本社・AWSネットワーク
groups:
  - id: hq
    label: 本社
  - id: server-room
    label: サーバ室
    parent: hq
  - id: aws-tokyo
    label: AWS 東京
  - id: ap-northeast-1a
    label: ap-northeast-1a
    parent: aws-tokyo
routingDomains:
  - id: guest
    label: guest
  - id: main
    label: main
    prefix: 10.0.0.0/16
segments:
  - id: vlan10
    label: 業務
    vlan: 10
    prefix: 192.168.10.0/24
  - id: vlan20
    label: 来客
    vlan: 20
    routingDomain: guest
  - id: subnet-sub-a
    label: sub-a
    prefix: 10.0.1.0/24
    routingDomain: main
    group: ap-northeast-1a
    addresses:
      web-1: 192.168.10.20
connections:
  - id: site-to-site-vpn
    label: Site-to-Site VPN
nodes:
  - id: rt-1
    label: rt-1
    type: router
    product: Yamaha/RTX3510
    group: server-room
  - id: sw-1
    label: sw-1
    type: switch
    product: ?/SWX2322P-16MT
    group: server-room
  - id: hv-1
    label: hv-1
    type: virtualization-host
    product: Dell/PowerEdge R750
    software: VMware ESXi
    group: server-room
  - id: web-1
    label: web-1
    type: VM
    host: hv-1
  - id: igw-1
    label: igw-1
    type: internet-gateway
  - id: vgw-1
    label: vgw-1
    type: virtual-private-gateway
links:
  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: port 1
    speed: 1G
    cable: Cat6
    length: 3m
    segments:
      - vlan10
      - vlan20
  - endpoints:
      - node: hv-1
      - node: sw-1
    speed: 10G
  - endpoints:
      - node: web-1
      - segment: vlan10
    virtual: true
  - endpoints:
      - node: igw-1
      - routingDomain: main
    virtual: true
  - endpoints:
      - node: rt-1
      - node: vgw-1
    virtual: true
    connection: site-to-site-vpn
    description: IPsec Site-to-Site VPN tunnel 1 of 2
  - endpoints:
      - node: rt-1
      - node: vgw-1
    virtual: true
    connection: site-to-site-vpn
    description: IPsec Site-to-Site VPN tunnel 2 of 2
