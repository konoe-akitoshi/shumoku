replicaCount: 1

image:
  repository: ghcr.io/konoe-akitoshi/shumoku
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: shumoku.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

httproute:
  enabled: true
  annotations: {}
  parentRefs:
    - name: my-gateway
      namespace: default
  hostnames:
    - shumoku.local
  rules:
    - paths:
        - path: /
          pathType: PathPrefix

demoMode: false

auth:
  # Existing Kubernetes Secret containing the one-time bootstrap administrator
  # password. Required for a fresh non-loopback deployment.
  existingSecret: ""
  passwordKey: admin-password
  secureCookies: false
  trustProxy: false

resources: {}

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: ""
  existingClaim: ""

config: {}
  # server:
  #   port: 8080
  #   host: 0.0.0.0
  #   dataDir: /data
  #   pollInterval: 5000
  #   backgroundPollInterval: 60000
  #   concurrencyLimit: 3

env: []

nodeSelector: {}

tolerations: []

affinity: {}
