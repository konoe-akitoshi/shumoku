                        - hex: [予約, "000000", "0"]
                        - blob: [署名, "auth-false", 64, "(64 バイト) Ed25519 署名", "IKE_SA_INIT で自分が送ったメッセージ全体 + 相手のノンス + 自分の ID に署名する。これで「途中で書き換えられていない」「本当に gw-a/gw-b だ」が同時に確認できる"]
                    - name: "ペイロード: SA (ESP 用、A が受け取る側の SPI)"
