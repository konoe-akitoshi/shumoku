name: Release npm Beta

on:
  workflow_dispatch:

concurrency:
  group: npm-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Setup npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify pending changesets
        id: pending
        run: bun scripts/changeset-status.ts

      - name: Create snapshot versions
        if: steps.pending.outputs.has-releases == 'true'
        run: bun x changeset version --snapshot beta

      - name: Build packages
        if: steps.pending.outputs.has-releases == 'true'
        run: bun run build:packages

      - name: Publish beta packages
        if: steps.pending.outputs.has-releases == 'true'
        run: bun x changeset publish --tag beta --no-git-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
