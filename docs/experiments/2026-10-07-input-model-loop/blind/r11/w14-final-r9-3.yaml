name: Company network
routingDomains:
  - id: staff
    prefix: 192.168.1.0/24
  - id: database
    prefix: 192.168.3.0/24
segments:
  - id: vlan-10
    label: staff
    vlan: 10
    prefix: 192.168.1.0/24
    routingDomain: staff
    addresses:
      web-1: 192.168.1.20
  - id: vlan-30
    label: database
    vlan: 30
    prefix: 192.168.3.0/24
    routingDomain: database
nodes:
  - id: core
    type: switch
  - id: esx-1
    type: server
    software: VMware ESXi
    segments:
      - vlan-10
      - vlan-30
  - id: esx-2
    type: server
    software: VMware ESXi
    segments:
      - vlan-10
      - vlan-30
  - id: esx-3
    type: server
    software: VMware ESXi
    segments:
      - vlan-10
      - vlan-30
  - id: web-1
    type: vm
    host: esx-1
  - id: db-1
    type: vm
    host: prod
  - id: mon-1
    type: vm
    address: 10.99.0.50
redundancy:
  - id: prod
    label: prod
    nodes:
      - esx-1
      - esx-2
      - esx-3
links:
  - endpoints:
      - node: core
      - node: esx-1
    speed: 25G
    segments:
      - vlan-10
      - vlan-30
  - endpoints:
      - node: core
      - node: esx-2
    speed: 25G
    segments:
      - vlan-10
      - vlan-30
  - endpoints:
      - node: core
      - node: esx-3
    speed: 25G
    segments:
      - vlan-10
      - vlan-30
