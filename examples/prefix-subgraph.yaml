# Prefix/Subnet Subgraph Example
# Demonstrates grouping devices by IP subnet (groupBy: 'prefix' option)
name: Network by Subnet
description: Devices grouped by IP prefix/subnet
groups:
  - id: prefix-10-0-0-0-16
    label: 'Subnet: 10.0.x.x'
  - id: prefix-10-1-0-0-16
    label: 'Subnet: 10.1.x.x'
  - id: prefix-10-2-0-0-16
    label: 'Subnet: 10.2.x.x'
  - id: prefix-192-168-0-0-16
    label: 'Subnet: 192.168.x.x'
segments:
  - id: vlan-100
    vlan: 100
  - id: vlan-200
    vlan: 200
  - id: vlan-300
    vlan: 300
nodes:
  - id: core-rt-01
    label: core-rt-01
    type: router
    group: prefix-10-0-0-0-16
    address: 10.0.0.1
  - id: mgmt-sw-01
    label: mgmt-sw-01
    type: l3-switch
    group: prefix-10-0-0-0-16
    address: 10.0.1.1
  - id: mgmt-srv-01
    label: mgmt-srv-01
    type: server
    group: prefix-10-0-0-0-16
    address: 10.0.2.1
    description: (Monitoring)
  - id: srv-sw-01
    label: srv-sw-01
    type: l3-switch
    group: prefix-10-1-0-0-16
    address: 10.1.0.1
  - id: web-srv-01
    label: web-srv-01
    type: server
    group: prefix-10-1-0-0-16
    address: 10.1.1.1
  - id: db-srv-01
    label: db-srv-01
    type: database
    group: prefix-10-1-0-0-16
    address: 10.1.2.1
  - id: app-srv-01
    label: app-srv-01
    type: server
    group: prefix-10-1-0-0-16
    address: 10.1.3.1
  - id: user-sw-01
    label: user-sw-01
    type: l2-switch
    group: prefix-10-2-0-0-16
    address: 10.2.0.1
  - id: user-sw-02
    label: user-sw-02
    type: l2-switch
    group: prefix-10-2-0-0-16
    address: 10.2.0.2
  - id: ap-01
    label: ap-01
    type: access-point
    group: prefix-10-2-0-0-16
    address: 10.2.1.1
  - id: fw-01
    label: fw-01
    type: firewall
    group: prefix-192-168-0-0-16
    address: 192.168.0.1
  - id: dmz-srv-01
    label: dmz-srv-01
    type: server
    group: prefix-192-168-0-0-16
    address: 192.168.1.1
    description: (Public Web)
links:
  - endpoints: [{node: core-rt-01, port: ge0/0}, {node: mgmt-sw-01, port: ge0/0}]
    segments: [vlan-100]
    speed: 10G
  - endpoints: [{node: core-rt-01, port: ge0/1}, {node: srv-sw-01, port: ge0/0}]
    segments: [vlan-200]
    speed: 10G
  - endpoints: [{node: core-rt-01, port: ge0/2}, {node: user-sw-01, port: ge0/0}]
    segments: [vlan-300]
    speed: 10G
  - endpoints: [{node: core-rt-01, port: ge0/3}, {node: fw-01, port: eth0}]
    speed: 10G
  - endpoints: [{node: mgmt-sw-01, port: ge0/1}, {node: mgmt-srv-01, port: eth0}]
    speed: 1G
  - endpoints: [{node: srv-sw-01, port: ge0/1}, {node: web-srv-01, port: eth0}]
    speed: 10G
  - endpoints: [{node: srv-sw-01, port: ge0/2}, {node: db-srv-01, port: eth0}]
    speed: 10G
  - endpoints: [{node: srv-sw-01, port: ge0/3}, {node: app-srv-01, port: eth0}]
    speed: 10G
  - endpoints: [{node: user-sw-01, port: ge0/1}, {node: user-sw-02, port: ge0/0}]
    speed: 10G
  - endpoints: [{node: user-sw-02, port: ge0/1}, {node: ap-01, port: eth0}]
    speed: 1G
  - endpoints: [{node: fw-01, port: eth1}, {node: dmz-srv-01, port: eth0}]
    speed: 1G
