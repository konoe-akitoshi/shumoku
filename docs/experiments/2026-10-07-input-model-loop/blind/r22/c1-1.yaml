name: 本社およびAWS東京
groups:
  - id: headquarters
    label: 本社
  - id: server-room
    label: サーバ室
    parent: headquarters
  - id: aws-tokyo
    label: AWS 東京
routingDomains:
  - id: guest
    label: guest
    prefix: 192.168.20.0/24
  - id: aws-main
    label: main
    prefix: 10.0.0.0/16
connections:
  - id: site-to-site-vpn
    label: IPsec Site-to-Site VPN
segments:
  - id: vlan-10
    label: 業務
    vlan: 10
    prefix: 192.168.10.0/24
    group: server-room
  - id: vlan-20
    label: 来客
    vlan: 20
    routingDomain: guest
    group: server-room
  - id: vpc-main
    label: VPC main
    prefix: 10.0.0.0/16
    routingDomain: aws-main
    group: aws-tokyo
  - id: subnet-sub-a
    label: sub-a (ap-northeast-1a)
    prefix: 10.0.1.0/24
    routingDomain: aws-main
    group: aws-tokyo
nodes:
  - id: rt-1
    label: rt-1
    type: router
    product: Yamaha/RTX3510
    group: server-room
  - id: sw-1
    label: sw-1
    type: switch
    product: ?/SWX2322P-16MT
    group: server-room
  - id: hv-1
    label: hv-1
    type: virtualization host
    product: Dell/PowerEdge R750
    software: VMware ESXi
    group: server-room
  - id: web-1
    label: web-1
    type: VM
    host: hv-1
    group: server-room
  - id: igw-1
    label: igw-1
    type: internet gateway
    group: aws-tokyo
  - id: vgw-1
    label: vgw-1
    type: virtual private gateway
    group: aws-tokyo
redundancy: []
links:
  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: port 1
    segments:
      - vlan-10
      - vlan-20
    speed: 1G
    cable: Cat6
    length: 3m
  - endpoints:
      - node: sw-1
      - node: hv-1
    speed: 10G
  - endpoints:
      - node: rt-1
      - node: vgw-1
    connection: site-to-site-vpn
    virtual: true
  - endpoints:
      - node: igw-1
      - segment: vpc-main
    virtual: true
  - endpoints:
      - node: vgw-1
      - segment: vpc-main
    virtual: true
  - endpoints:
      - node: web-1
      - segment: vlan-10
    virtual: true
  - endpoints:
      - node: igw-1
      - segment: subnet-sub-a
    virtual: true
