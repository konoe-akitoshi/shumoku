name: Server room
routingDomains: []
segments:
  - id: vlan-10
    label: staff
    vlan: 10
    prefix: 192.168.1.0/24
    addresses:
      web-1: 192.168.1.20
  - id: vlan-30
    label: database
    vlan: 30
    prefix: 192.168.3.0/24
groups:
  - id: server-room
    label: Server room
redundancy:
  - id: prod
    label: prod
    nodes:
      - esx-1
      - esx-2
      - esx-3
nodes:
  - id: core
    type: switch
    group: server-room
  - id: esx-1
    type: server
    software: VMware ESXi
    group: server-room
  - id: esx-2
    type: server
    software: VMware ESXi
    group: server-room
  - id: esx-3
    type: server
    software: VMware ESXi
    group: server-room
  - id: web-1
    type: vm
    host: esx-1
    group: server-room
  - id: db-1
    type: vm
    host: prod
    group: server-room
    segments:
      - vlan-30
  - id: mon-1
    type: vm
    address: 10.99.0.50
links:
  - endpoints:
      - node: core
      - node: esx-1
    speed: 25G
    segments:
      - vlan-10
      - vlan-30
  - endpoints:
      - node: core
      - node: esx-2
    speed: 25G
    segments:
      - vlan-10
      - vlan-30
  - endpoints:
      - node: core
      - node: esx-3
    speed: 25G
    segments:
      - vlan-10
      - vlan-30
