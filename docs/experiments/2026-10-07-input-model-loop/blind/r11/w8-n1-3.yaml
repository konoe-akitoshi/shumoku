name: On-premises and AWS Tokyo network
groups:
  - id: server-room
    label: On-premises server room
  - id: ap-northeast-1a
    label: ap-northeast-1a
  - id: ap-northeast-1c
    label: ap-northeast-1c
networks:
  - id: guest
    label: Guest VRF
  - id: main
    label: VPC main
    prefix: 10.0.0.0/16
connections:
  - id: vpn-1
    label: Site-to-Site VPN
segments:
  - id: vlan-20
    label: VLAN 20
    vlan: 20
    prefix: 192.168.20.0/24
    network: guest
    group: server-room
    addresses:
      ap-1: 192.168.20.5
  - id: vlan-10
    label: VLAN 10
    vlan: 10
    prefix: 192.168.10.0/24
    group: server-room
    addresses:
      fw-v: 192.168.10.2
      app-1: 192.168.10.20
  - id: sub-a
    label: sub-a
    prefix: 10.0.1.0/24
    network: main
    group: ap-northeast-1a
    addresses:
      web-c: 10.0.1.10
  - id: sub-c
    label: sub-c
    prefix: 10.0.2.0/24
    network: main
    group: ap-northeast-1c
    addresses:
      db-c: 10.0.2.20
redundancy:
  - id: prod
    label: vSphere HA cluster prod
    nodes:
      - hv-1
      - hv-2
nodes:
  - id: rt-1
    label: rt-1
    product: yamaha/rtx3510
    group: server-room
    segments:
      - vlan-20
      - vlan-10
    network: main
  - id: ap-1
    label: ap-1
    group: server-room
  - id: hv-1
    label: hv-1
    product: dell/poweredge/r750
    software: VMware ESXi
    group: server-room
  - id: hv-2
    label: hv-2
    product: dell/poweredge/r750
    software: VMware ESXi
    group: server-room
  - id: fw-v
    label: fw-v
    product: palo-alto-networks/vm-series
    host: hv-1
    group: server-room
  - id: app-1
    label: app-1
    software: Ubuntu
    host: prod
    group: server-room
  - id: web-c
    label: web-c
    type: EC2 instance
    product: aws/ec2/t3.medium
    software: Amazon Linux
    network: main
  - id: db-c
    label: db-c
    type: RDS database
    product: aws/rds/mysql
    network: main
  - id: igw-1
    label: igw-1
    type: Internet gateway
    network: main
  - id: tgw-1
    label: tgw-1
    type: Transit Gateway
    network: main
    segments:
      - sub-a
      - sub-c
  - id: vpn-1-a
    label: IPsec tunnel 1
    type: VPN tunnel
  - id: vpn-1-b
    label: IPsec tunnel 2
    type: VPN tunnel
links:
  - endpoints:
      - node: rt-1
        port: lan2
      - node: ap-1
    segments:
      - vlan-20
  - endpoints:
      - node: hv-1
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: hv-2
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: fw-v
      - node: rt-1
    segments:
      - vlan-10
  - endpoints:
      - node: app-1
      - node: rt-1
    segments:
      - vlan-10
  - endpoints:
      - node: igw-1
      - node: main
  - endpoints:
      - node: tgw-1
      - node: sub-a
  - endpoints:
      - node: tgw-1
      - node: sub-c
  - endpoints:
      - node: rt-1
      - node: vpn-1-a
    connection: vpn-1
    virtual: true
  - endpoints:
      - node: vpn-1-a
      - node: tgw-1
    connection: vpn-1
    virtual: true
  - endpoints:
      - node: rt-1
      - node: vpn-1-b
    connection: vpn-1
    virtual: true
  - endpoints:
      - node: vpn-1-b
      - node: tgw-1
    connection: vpn-1
    virtual: true
