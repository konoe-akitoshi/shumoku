name: Virtual machine network

routingDomains:
  - id: server-room-lan

segments:
  - id: staff
    label: VLAN 10
    vlan: 10
    prefix: 192.168.1.0/24
    routingDomain: server-room-lan
    addresses:
      web-1: 192.168.1.20

  - id: database
    label: VLAN 30
    vlan: 30
    prefix: 192.168.3.0/24
    routingDomain: server-room-lan

redundancy:
  - id: prod
    label: vSphere HA cluster
    nodes:
      - esx-1
      - esx-2
      - esx-3

nodes:
  - id: core
    type: switch
    routingDomain: server-room-lan

  - id: esx-1
    type: virtualization host
    product: vmware/esxi
    routingDomain: server-room-lan

  - id: esx-2
    type: virtualization host
    product: vmware/esxi
    routingDomain: server-room-lan

  - id: esx-3
    type: virtualization host
    product: vmware/esxi
    routingDomain: server-room-lan

  - id: web-1
    type: virtual machine
    host: esx-1

  - id: db-1
    type: virtual machine
    host: prod
    segments:
      - database

  - id: mon-1
    type: virtual machine
    address: 10.99.0.50
    assumed: true

links:
  - endpoints:
      - node: core
      - node: esx-1
    speed: 25G
    segments:
      - staff
      - database

  - endpoints:
      - node: core
      - node: esx-2
    speed: 25G
    segments:
      - staff
      - database

  - endpoints:
      - node: core
      - node: esx-3
    speed: 25G
    segments:
      - staff
      - database
