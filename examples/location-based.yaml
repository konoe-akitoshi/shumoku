# Office network placed in its physical locations: building > floor > room > rack.
name: Office Network with Physical Locations
description: Location-based network topology example with rooms and racks
groups:
  - id: building-hq
    label: Headquarters Building
    groups:
      - id: floor-3
        label: 3rd Floor
        groups:
          - id: server-room-a
            label: Server Room A
            groups:
              - id: rack-a1
                label: Rack A1
              - id: rack-a2
                label: Rack A2
          - id: server-room-b
            label: Server Room B
          - id: office-room-c
            label: Office Room C
redundancy:
  - id: core-pair
    nodes: [core-sw-1, core-sw-2]
nodes:
  - id: core-sw-1
    label: Core-SW-1
    type: l3-switch
    group: rack-a1
  - id: core-sw-2
    label: Core-SW-2
    type: l3-switch
    group: rack-a1
  - id: dist-sw-1
    label: Dist-SW-1
    type: l3-switch
    group: rack-a2
  - id: dist-sw-2
    label: Dist-SW-2
    type: l3-switch
    group: rack-a2
  - id: server-sw-b1
    label: Server-SW-B1
    type: l2-switch
    group: server-room-b
  - id: server-sw-b2
    label: Server-SW-B2
    type: l2-switch
    group: server-room-b
  - id: office-sw-c1
    label: Office-SW-C1
    type: l2-switch
    group: office-room-c
  - id: office-sw-c2
    label: Office-SW-C2
    type: l2-switch
    group: office-room-c
  - id: wifi-controller
    label: WiFi Controller
    type: server
    group: office-room-c
links:
  - endpoints: [{ node: core-sw-1 }, { node: core-sw-2 }]
    speed: 100G
  - endpoints: [{ node: core-sw-1 }, { node: dist-sw-1 }]
    speed: 40G
  - endpoints: [{ node: core-sw-1 }, { node: dist-sw-2 }]
    speed: 40G
  - endpoints: [{ node: core-sw-2 }, { node: dist-sw-1 }]
    speed: 40G
  - endpoints: [{ node: core-sw-2 }, { node: dist-sw-2 }]
    speed: 40G
  - endpoints: [{ node: dist-sw-1 }, { node: server-sw-b1 }]
    speed: 10G
  - endpoints: [{ node: dist-sw-2 }, { node: server-sw-b2 }]
    speed: 10G
  - endpoints: [{ node: dist-sw-1 }, { node: office-sw-c1 }]
    speed: 10G
  - endpoints: [{ node: dist-sw-2 }, { node: office-sw-c2 }]
    speed: 10G
  - endpoints: [{ node: server-sw-b1 }, { node: server-sw-b2 }]
    speed: 10G
  - endpoints: [{ node: office-sw-c1 }, { node: office-sw-c2 }]
    speed: 10G
  - endpoints: [{ node: office-sw-c1 }, { node: wifi-controller }]
    speed: 1G
