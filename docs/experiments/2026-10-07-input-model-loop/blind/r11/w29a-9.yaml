description: Our network is AS64500.

groups:
  - id: dc-a
    label: DC-A

segments:
  - id: ix-t-lan
    label: IX-T peering LAN
    prefix: 198.51.100.0/24
    addresses:
      br2: 198.51.100.10
      as64520-peer: 198.51.100.20
      as64530-participant: 198.51.100.30

nodes:
  - id: br1
    label: br1
    type: router
    asn: 64500
    group: dc-a
  - id: br2
    label: br2
    type: router
    asn: 64500
    group: dc-a
  - id: as64510-router
    type: router
    asn: 64510
  - id: as64520-peer
    asn: 64520
  - id: as64530-participant
    asn: 64530
  - id: as64540-peer
    asn: 64540

links:
  - endpoints:
      - node: br1
        port: xe-0/0/0
      - node: as64510-router
    speed: 10G
    description: Cable to our transit provider AS64510; we are its customer.
  - endpoints:
      - node: br1
      - node: as64510-router
    virtual: true
    description: eBGP transit session running over the br1 xe-0/0/0 cable.
  - endpoints:
      - node: br2
      - node: as64520-peer
    segments:
      - ix-t-lan
    virtual: true
    description: Settlement-free eBGP peering session over IX-T.
  - endpoints:
      - node: br2
      - node: as64540-peer
    virtual: true
    description: eBGP session for transit purchased from AS64540; cable or path unknown.
