  - endpoints:
      - node: ncs5501se.kote
      - segment: jpix

  - endpoints:
      - node: ncs5501se.kote
      - segment: dix-ie

  - endpoints:
      - node: wxd
      - segment: jpnap

  - endpoints:
      - node: wxt-1
      - segment: jpnap

  - endpoints:
      - node: cisco8712
      - segment: bbix-tokyo

  - endpoints:
      - node: jpix-route-server
      - segment: jpix
    description: JPIX route server peering

  - endpoints:
      - node: dix-ie-route-server
      - segment: dix-ie
    description: DIX-IE route server peering

  - endpoints:
      - node: jpnap-route-server
      - segment: jpnap
    description: JPNAP route server peering

  - endpoints:
      - node: bbix-tokyo-route-server
      - segment: bbix-tokyo
    description: BBIX Tokyo route server peering
