name: 本社・大阪支店ネットワーク

nodes:
  - id: rt-1
    type: router
  - id: sw-1
    type: switch
  - id: sw-2
    type: switch
  - id: prn-1
    type: printer
  - id: rt-2
    type: router
  - id: ergw
    type: gateway

connections:
  - id: lag-sw-1-sw-2
    label: LAG
  - id: wide-ethernet
    label: 広域イーサネット
  - id: expressroute
    label: ExpressRoute
  - id: ipsec-backup
    label: バックアップ IPsec トンネル

links:
  - endpoints:
      - node: rt-1
        port: te1
      - node: sw-1
        port: te0/1
    speed: 10G

  - endpoints:
      - node: sw-1
        port: te0/47
      - node: sw-2
        port: te0/47
    speed: 10G
    connection: lag-sw-1-sw-2

  - endpoints:
      - node: sw-1
        port: te0/48
      - node: sw-2
        port: te0/48
    speed: 10G
    connection: lag-sw-1-sw-2

  - endpoints:
      - node: sw-2
        port: ge0/10
      - node: prn-1
    speed: 100M

  - endpoints:
      - node: rt-1
        port: ge0
      - node: rt-2
        port: ge0
    speed: 1G
    connection: wide-ethernet
    description: 両端の引き渡し Ethernet は 1G、契約帯域は 300M

  - endpoints:
      - node: rt-1
      - node: ergw
    speed: 2G
    connection: expressroute
    description: 途中の機器は不明

  - endpoints:
      - node: rt-2
      - node: rt-1
    virtual: true
    connection: ipsec-backup
