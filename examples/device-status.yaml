# Device Status Example
# Demonstrates device status-based coloring (colorByStatus option in NetBox converter)
name: Device Status Visualization
description: Shows devices with different operational statuses
groups:
  - id: production
    label: Production Environment
  - id: staging
    label: Staging Environment
  - id: decommissioned
    label: Decommissioned
redundancy:
  - id: core-sw-01-core-sw-02
    nodes: [core-sw-01, core-sw-02]
nodes:
  - id: core-sw-01
    label: core-sw-01
    type: l3-switch
    product: juniper/ex4400
    group: production
    address: 10.0.1.1
    description: (Active)
  - id: core-sw-02
    label: core-sw-02
    type: l3-switch
    product: juniper/ex4400
    group: production
    address: 10.0.1.2
    description: (Active)
  - id: new-fw-01
    label: new-fw-01
    type: firewall
    group: staging
    description: (Planned)
  - id: staged-sw-01
    label: staged-sw-01
    type: l2-switch
    group: staging
    address: 10.0.2.1
    description: (Staged)
  - id: failed-sw-01
    label: failed-sw-01
    type: l2-switch
    group: production
    description: (Failed)
  - id: offline-srv-01
    label: offline-srv-01
    type: server
    group: production
    description: (Offline)
  - id: inventory-sw-01
    label: inventory-sw-01
    type: l2-switch
    group: staging
    description: (Inventory)
  - id: old-sw-01
    label: old-sw-01
    type: l2-switch
    group: decommissioned
    description: (Decommissioning)
links:
  - endpoints: [{node: core-sw-01, port: xe-0/0/0}, {node: core-sw-02, port: xe-0/0/0}]
    speed: 40G
  - endpoints: [{node: core-sw-01, port: ge-0/0/1}, {node: staged-sw-01, port: ge-0/0/0}]
    virtual: true
    speed: 10G
  - endpoints: [{node: core-sw-02, port: ge-0/0/1}, {node: failed-sw-01, port: ge-0/0/0}]
    speed: 10G
  - endpoints: [{node: failed-sw-01, port: ge-0/0/2}, {node: offline-srv-01, port: eth0}]
    speed: 1G
