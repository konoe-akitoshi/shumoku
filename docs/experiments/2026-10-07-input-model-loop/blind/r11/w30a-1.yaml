name: AS64500
groups:
  - id: dc-a
    label: DC-A
segments:
  - id: ix-t-lan
    label: IX-T peering LAN
    prefix: 198.51.100.0/24
    addresses:
      br2: 198.51.100.10
      as64520-peer: 198.51.100.20
      as64530-peer: 198.51.100.30
nodes:
  - id: br1
    label: br1
    type: router
    asn: 64500
    group: dc-a
  - id: br2
    label: br2
    type: router
    asn: 64500
    group: dc-a
  - id: transit-64510
    type: router
    asn: 64510
  - id: as64520-peer
    type: router
    asn: 64520
  - id: as64530-peer
    type: router
    asn: 64530
  - id: transit-64540-peer
    type: router
    asn: 64540
links:
  - endpoints:
      - node: br1
        port: xe-0/0/0
      - node: transit-64510
    speed: 10G
    connection: transit-64510-ebgp
  - endpoints:
      - node: br2
      - segment: ix-t-lan
  - endpoints:
      - node: as64520-peer
      - segment: ix-t-lan
    connection: ix-t-as64520-ebgp
  - endpoints:
      - node: as64530-peer
      - segment: ix-t-lan
  - endpoints:
      - node: br2
      - node: as64520-peer
    segments:
      - ix-t-lan
    connection: ix-t-as64520-ebgp
  - endpoints:
      - node: br2
      - node: transit-64540-peer
    connection: transit-64540-ebgp
