name: Company network
description: On-premises server room and AWS Tokyo region

routingDomains:
  - id: guest
    label: guest

groups:
  - id: server-room
    label: On-premises server room
  - id: ap-northeast-1a
    label: ap-northeast-1a
  - id: ap-northeast-1c
    label: ap-northeast-1c

connections:
  - id: rt-1-to-tgw-1-vpn
    label: Site-to-Site VPN

segments:
  - id: vlan-20
    label: VLAN 20
    vlan: 20
    prefix: 192.168.20.0/24
    routingDomain: guest
    addresses:
      ap-1: 192.168.20.5
  - id: vlan-10
    label: VLAN 10
    vlan: 10
    prefix: 192.168.10.0/24
    addresses:
      fw-v: 192.168.10.2
      app-1: 192.168.10.20
  - id: vpc-main
    label: VPC main
    prefix: 10.0.0.0/16
  - id: sub-a
    label: Subnet sub-a
    prefix: 10.0.1.0/24
    group: ap-northeast-1a
    routingDomain: vpc-main
    addresses:
      web-c: 10.0.1.10
  - id: sub-c
    label: Subnet sub-c
    prefix: 10.0.2.0/24
    group: ap-northeast-1c
    routingDomain: vpc-main
    addresses:
      db-c: 10.0.2.20

redundancy:
  - id: prod
    label: prod
    nodes:
      - hv-1
      - hv-2

nodes:
  - id: rt-1
    label: rt-1
    product: yamaha/rtx3510
    group: server-room
  - id: ap-1
    label: ap-1
    group: server-room
  - id: hv-1
    label: hv-1
    product: dell/poweredge-r750
    software: VMware ESXi
    group: server-room
  - id: hv-2
    label: hv-2
    product: dell/poweredge-r750
    software: VMware ESXi
    group: server-room
  - id: fw-v
    label: fw-v
    product: palo-alto-networks/vm-series
    software: PAN-OS
    host: hv-1
    group: server-room
  - id: app-1
    label: app-1
    software: Ubuntu
    host: prod
    group: server-room
  - id: web-c
    label: web-c
    product: aws/ec2/t3.medium
    software: Amazon Linux
    group: ap-northeast-1a
  - id: db-c
    label: db-c
    product: aws/rds/mysql
    group: ap-northeast-1c
  - id: igw-1
    label: igw-1
    product: aws/internet-gateway
    routingDomain: vpc-main
  - id: tgw-1
    label: tgw-1
    product: aws/transit-gateway
    routingDomain: vpc-main

links:
  - endpoints:
      - node: ap-1
      - node: rt-1
        port: lan2
    segments:
      - vlan-20
  - endpoints:
      - node: hv-1
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: hv-2
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: fw-v
      - segment: vlan-10
    virtual: true
  - endpoints:
      - node: app-1
      - segment: vlan-10
    virtual: true
  - endpoints:
      - node: igw-1
      - segment: vpc-main
  - endpoints:
      - node: tgw-1
      - segment: sub-a
  - endpoints:
      - node: tgw-1
      - segment: sub-c
  - endpoints:
      - node: rt-1
      - node: tgw-1
    connection: rt-1-to-tgw-1-vpn
    virtual: true
    assumed: true
  - endpoints:
      - node: rt-1
      - node: tgw-1
    connection: rt-1-to-tgw-1-vpn
    virtual: true
    assumed: true
