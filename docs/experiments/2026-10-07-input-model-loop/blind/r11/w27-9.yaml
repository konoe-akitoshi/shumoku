name: AS64500
groups:
  - id: dc-a
    label: DC-A

segments:
  - id: ix-t
    label: IX-T peering LAN
    prefix: 198.51.100.0/24
    addresses:
      br2: 198.51.100.10
      as64520-endpoint: 198.51.100.20
      as64530-endpoint: 198.51.100.30

nodes:
  - id: br1
    type: router
    group: dc-a
    description: Border router of AS64500.
  - id: br2
    type: router
    group: dc-a
    description: >-
      Border router of AS64500. Has a settlement-free eBGP peering session
      with AS64520 at 198.51.100.20 on IX-T, and no session with AS64530.
      Also has an eBGP session for purchased transit from AS64540;
      the cable or path used by that session is unknown.
  - id: as64510-router
    type: router
    description: >-
      Unnamed router of AS64510, which provides transit to AS64500.
  - id: as64520-endpoint
    description: AS64520 endpoint on IX-T.
  - id: as64530-endpoint
    description: AS64530 endpoint on IX-T.

links:
  - endpoints:
      - node: br1
        port: xe-0/0/0
      - node: as64510-router
    speed: 10G
    description: >-
      Cable carrying an eBGP session. AS64500 is a transit customer
      of AS64510.
