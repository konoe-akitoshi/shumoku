#
# BGP シナリオ (protoviz/site/js/protocols/bgp.js MIT の移植)。
# パケットは全て inline 宣言。TCP の seq/ack はセッション状態で追跡した
# 決定論的値をそのまま書く (protoviz と同じ値)。
# BGP の長さフィールド (OPEN のオプション長・UPDATE の属性長) は len で実計算。

id: bgp
name: BGP
title: インターネットの経路交換
group: ネットワーク層
layerLabel: "L3 の経路制御 · TCP 179"

lifelines: [srv, r1, r2, r3, user]
nodeSub:
  srv: 203.0.113.10
  r1: AS64500
  r2: AS64510
  r3: AS64520
  user: 198.51.100.25

legend:
  - [green, "TCP"]
  - [amber, "OPEN / KEEPALIVE"]
  - [violet, "UPDATE (経路の広告)"]
  - [red, "経路の取り下げ"]
  - [blue, "利用者の通信"]
  - [gray, "ルータ内の処理"]

overview:
  full: "Border Gateway Protocol version 4"
  description: "インターネットは、AS (自律システム: ISP や大企業などのネットワークのまとまり) の集まりです。BGP は隣り合う AS のルータ同士が「このネットワークには、この AS を順にたどれば行けます」と教え合うプロトコルで、これがインターネット全体の道順になります。"
  facts:
    - [トランスポート, "TCP 179"]
    - [メッセージ, "OPEN, UPDATE, KEEPALIVE, NOTIFICATION"]
    - [種類, "eBGP (AS 間), iBGP (AS 内)"]
    - [経路の数, "IPv4 で約 100 万経路 (2026 年)"]
    - [規格, "RFC 4271, RFC 6793 (4 バイト AS)"]

steps:
  - title: "TCP で接続する"
    desc: "BGP は TCP の上で動きます。R1 と R2 は設定に書かれた相手 (neighbor) にポート 179 で接続します。"
    detail: |
      BGP には相手を自動で見つける仕組みがありません。運用者が「192.0.2.2 は AS64510 の相手」と1つずつ設定します。AS 同士の接続 (eBGP) は、たいてい直結したリンクの両端で張ります。

      TCP を使うので、再送や順序の保証は TCP に任せられます。そのぶん BGP 自身は「変わった分だけ」を送る、シンプルな作りになっています。
    facts:
      - [R1 側, "192.0.2.1 (AS64500)"]
      - [R2 側, "192.0.2.2 (AS64510)"]
      - [状態, "Idle → Connect → OpenSent"]
    events:
      - kind: pkt
        from: r1
        to: r2
        color: green
        label: SYN
        packet:
          summary: "TCP SYN (→ ポート 179)"
          layers:
            - ipv4: {src: 192.0.2.1, dst: 192.0.2.2, proto: 6, ttl: 1, tos: 0xc0, id: 1}
            - tcp: {sport: 50123, dport: 179, dname: bgp, seq: 3804119021, flags: SYN}
      - kind: pkt
        from: r2
        to: r1
        color: green
        label: SYN/ACK
        packet:
          summary: "TCP SYN,ACK (ポート 179 から)"
          layers:
            - ipv4: {src: 192.0.2.2, dst: 192.0.2.1, proto: 6, ttl: 1, tos: 0xc0, id: 1}
            - tcp: {sport: 179, sname: bgp, dport: 50123, seq: 1129044511, ack: 3804119022, flags: "SYN,ACK"}
      - kind: pkt
        from: r1
        to: r2
        color: green
        label: ACK
        packet:
          summary: "TCP ACK (→ ポート 179)"
          layers:
            - ipv4: {src: 192.0.2.1, dst: 192.0.2.2, proto: 6, ttl: 1, tos: 0xc0, id: 1}
            - tcp: {sport: 50123, dport: 179, dname: bgp, seq: 3804119022, ack: 1129044512, flags: ACK}

  - title: "OPEN — 自己紹介"
    desc: "お互いに AS 番号・ルータ ID・ホールドタイム・対応機能を伝えます。"
    detail: |
      受け取った側は、相手の AS 番号が設定どおりか (neighbor 192.0.2.1 remote-as 64500) を確認します。違っていれば NOTIFICATION を送って切断します。

      ケーパビリティは「IPv4 ユニキャストの経路を交換したい」「4 バイト AS 番号に対応」などの機能の一覧で、両者が対応しているものだけが使われます。
    events:
      - kind: pkt
        from: r1
        to: r2
        color: amber
        label: OPEN
        packet:
          summary: "OPEN: AS64500 です。ホールドタイムは 90 秒で"
          note: "eBGP では IP の TTL が 1。隣のルータにしか届かないようにしている (直結が前提)。"
          layers:
            - ipv4: {src: 192.0.2.1, dst: 192.0.2.2, proto: 6, ttl: 1, tos: 0xc0, id: 0x3fee}
            - tcp: {sport: 50123, dport: 179, dname: bgp, seq: 3804119022, ack: 1129044512, flags: "PSH,ACK"}
            - name: "BGP OPEN"
              fields:
                - hex: [マーカー, ffffffffffffffffffffffffffffffff, "ff × 16", "昔の名残。今は常に全部 ff"]
                - len: [長さ, 2, "この BGP メッセージ全体の長さ (19〜4096)"]
                - u8: [タイプ, 1, "1 (OPEN)"]
                - u8: [バージョン, 4, "4"]
                - u16: ["自分の AS 番号", 64500, "64500", "2 バイト欄。65535 を超える AS 番号のときは 23456 (AS_TRANS) を入れて、本当の値は 4 バイト AS ケーパビリティで伝える"]
                - u16: [ホールドタイム, 90, "90 秒", "この時間なにも届かなければ相手が死んだとみなす。両者の小さい方が使われる"]
                - ip4: [BGP 識別子, 192.0.2.1, 192.0.2.1, "ルータ ID。AS 内でルータを一意に区別する 32 ビットの値"]
                - len: [オプション長, 1, "", {adj: -29}]
                - u8: ["オプション: ケーパビリティ", 2, "2 (Capabilities)", "「自分はこの機能に対応している」の一覧"]
                - len: ["  長さ", 1, "", {adj: -31}]
                  depth: 1
                - u8: ["ケーパビリティ: マルチプロトコル", 1, "1 (MP-BGP)", "どのアドレスファミリの経路を交換するか"]
                  depth: 1
                - u8: ["  長さ", 4, "4", "", {depth: 2}]
                - u16: ["  AFI", 1, "1 (IPv4)", "", {depth: 2}]
                - u8: ["  予約", 0, "0", "", {depth: 2}]
                - u8: ["  SAFI", 1, "1 (ユニキャスト)", "", {depth: 2}]
                - u8: ["ケーパビリティ: ルートリフレッシュ", 2, "2 (Route Refresh)", "セッションを張り直さずに「経路を全部送り直して」と頼める"]
                  depth: 1
                - u8: ["  長さ", 0, "0", "", {depth: 2}]
                - u8: ["ケーパビリティ: 4 バイト AS", 65, "65 (4-octet AS)", "4 バイトの AS 番号に対応している"]
                  depth: 1
                - u8: ["  長さ", 4, "4", "", {depth: 2}]
                - u32: ["  AS 番号", 64500, "64500", "", {depth: 2}]
      - kind: pkt
        from: r2
        to: r1
        color: amber
        label: OPEN
        with: true
        packet:
          summary: "OPEN: AS64510 です。ホールドタイムは 90 秒で"
          layers:
            - ipv4: {src: 192.0.2.2, dst: 192.0.2.1, proto: 6, ttl: 1, tos: 0xc0, id: 0xda20}
            - tcp: {sport: 179, sname: bgp, dport: 50123, seq: 1129044512, ack: 3804119067, flags: "PSH,ACK"}
            - name: "BGP OPEN"
              fields:
                - hex: [マーカー, ffffffffffffffffffffffffffffffff, "ff × 16", "昔の名残。今は常に全部 ff"]
                - len: [長さ, 2, "この BGP メッセージ全体の長さ (19〜4096)"]
                - u8: [タイプ, 1, "1 (OPEN)"]
                - u8: [バージョン, 4, "4"]
                - u16: ["自分の AS 番号", 64510, "64510", "2 バイト欄。65535 を超える AS 番号のときは 23456 (AS_TRANS) を入れて、本当の値は 4 バイト AS ケーパビリティで伝える"]
                - u16: [ホールドタイム, 90, "90 秒", "この時間なにも届かなければ相手が死んだとみなす。両者の小さい方が使われる"]
                - ip4: [BGP 識別子, 192.0.2.2, 192.0.2.2, "ルータ ID。AS 内でルータを一意に区別する 32 ビットの値"]
                - len: [オプション長, 1, "", {adj: -29}]
                - u8: ["オプション: ケーパビリティ", 2, "2 (Capabilities)", "「自分はこの機能に対応している」の一覧"]
                - len: ["  長さ", 1, "", {adj: -31}]
                  depth: 1
                - u8: ["ケーパビリティ: マルチプロトコル", 1, "1 (MP-BGP)", "どのアドレスファミリの経路を交換するか"]
                  depth: 1
                - u8: ["  長さ", 4, "4", "", {depth: 2}]
                - u16: ["  AFI", 1, "1 (IPv4)", "", {depth: 2}]
                - u8: ["  予約", 0, "0", "", {depth: 2}]
                - u8: ["  SAFI", 1, "1 (ユニキャスト)", "", {depth: 2}]
                - u8: ["ケーパビリティ: ルートリフレッシュ", 2, "2 (Route Refresh)", "セッションを張り直さずに「経路を全部送り直して」と頼める"]
                  depth: 1
                - u8: ["  長さ", 0, "0", "", {depth: 2}]
                - u8: ["ケーパビリティ: 4 バイト AS", 65, "65 (4-octet AS)", "4 バイトの AS 番号に対応している"]
                  depth: 1
                - u8: ["  長さ", 4, "4", "", {depth: 2}]
                - u32: ["  AS 番号", 64510, "64510", "", {depth: 2}]
      - kind: local
        node: r2
        label: "AS 番号を確認"
        text: "受け取った OPEN の AS 番号 64500 が、設定 (neighbor 192.0.2.1 remote-as 64500) と一致。ホールドタイムは双方 90 秒なので 90 秒に決定。"

  - title: "KEEPALIVE — セッション確立"
    desc: "OPEN を受け入れた印に KEEPALIVE を返します。両方がそろうと Established (確立) になります。"
    detail: "これで経路を交換する準備ができました。以後 KEEPALIVE はホールドタイムの 1/3 (30 秒) ごとに送られ、90 秒届かなければセッションを切ります。"
    facts:
      - [状態, "OpenConfirm → Established"]
      - [KEEPALIVE 間隔, "30 秒"]
      - [ホールドタイム, "90 秒"]
    state:
      r1: Established
      r2: Established
    events:
      - kind: pkt
        from: r1
        to: r2
        color: amber
        label: KEEPALIVE
        packet:
          summary: "KEEPALIVE: 生きています"
          note: "ヘッダだけの 19 バイト。OPEN への返事であり、その後は定期的な生存通知になる。"
          layers:
            - ipv4: {src: 192.0.2.1, dst: 192.0.2.2, proto: 6, ttl: 1, tos: 0xc0, id: 0x401b}
            - tcp: {sport: 50123, dport: 179, dname: bgp, seq: 3804119067, ack: 1129044557, flags: "PSH,ACK"}
            - name: "BGP KEEPALIVE"
              fields:
                - hex: [マーカー, ffffffffffffffffffffffffffffffff, "ff × 16", "昔の名残。今は常に全部 ff"]
                - len: [長さ, 2, "この BGP メッセージ全体の長さ (19〜4096)"]
                - u8: [タイプ, 4, "4 (KEEPALIVE)"]
      - kind: pkt
        from: r2
        to: r1
        color: amber
        label: KEEPALIVE
        with: true
        packet:
          summary: "KEEPALIVE: 生きています"
          note: "ヘッダだけの 19 バイト。OPEN への返事であり、その後は定期的な生存通知になる。"
          layers:
            - ipv4: {src: 192.0.2.2, dst: 192.0.2.1, proto: 6, ttl: 1, tos: 0xc0, id: 0xda4d}
            - tcp: {sport: 179, sname: bgp, dport: 50123, seq: 1129044557, ack: 3804119086, flags: "PSH,ACK"}
            - name: "BGP KEEPALIVE"
              fields:
                - hex: [マーカー, ffffffffffffffffffffffffffffffff, "ff × 16", "昔の名残。今は常に全部 ff"]
                - len: [長さ, 2, "この BGP メッセージ全体の長さ (19〜4096)"]
                - u8: [タイプ, 4, "4 (KEEPALIVE)"]

  - title: "UPDATE — 経路を広告する"
    desc: "R1 は「203.0.113.0/24 は私 (AS64500) の先にあります」と R2 に教えます。"
    detail: |
      UPDATE にはプレフィックス (NLRI) と、その経路の性質 (パス属性) が入っています。AS_PATH は通ってきた AS の列で、今は [64500] だけです。NEXT_HOP は「このネットワーク宛てのパケットは 192.0.2.1 に渡して」という意味です。

      R2 は受け取った経路を、そのまま使うわけではありません。フィルタ (この AS がこのプレフィックスを広告してよいか。IRR や RPKI で確認) を通し、他に同じプレフィックスへの経路があれば比べて、一番良いものを選びます。
    facts:
      - [プレフィックス, "203.0.113.0/24"]
      - [AS_PATH, "64500"]
      - [NEXT_HOP, "192.0.2.1"]
    state:
      r2: "203.0.113.0/24 → R1"
    events:
      - kind: pkt
        from: r1
        to: r2
        color: violet
        label: UPDATE
        packet:
          summary: "UPDATE: 203.0.113.0/24 へは AS_PATH [64500] で行けます"
          note: "UPDATE は「パス属性 (共通の性質)」と「NLRI (その属性を持つプレフィックスの一覧)」の組。同じ属性なら何百ものプレフィックスを1通にまとめられる。"
          layers:
            - ipv4: {src: 192.0.2.1, dst: 192.0.2.2, proto: 6, ttl: 1, tos: 0xc0, id: 0x402e}
            - tcp: {sport: 50123, dport: 179, dname: bgp, seq: 3804119086, ack: 1129044576, flags: "PSH,ACK"}
            - name: "BGP UPDATE"
              fields:
                - hex: [マーカー, ffffffffffffffffffffffffffffffff, "ff × 16", "昔の名残。今は常に全部 ff"]
                - len: [長さ, 2, "この BGP メッセージ全体の長さ (19〜4096)"]
                - u8: [タイプ, 2, "2 (UPDATE)"]
                - u16: ["取り下げ経路の長さ", 0, "0"]
                - u16: ["パス属性の長さ", 20, "20 バイト"]
                - u8: ["属性: ORIGIN", 0x40, "フラグ 0x40 (Well-known, 転送する)", "この経路がどこから来たか"]
                  depth: 1
                - u8: ["  タイプ", 1, "1 (ORIGIN)", "", {depth: 2}]
                - u8: ["  長さ", 1, "1", "", {depth: 2}]
                - u8: ["  値", 0, "0 (IGP)", "AS 内のネットワークを network 文で広告した、の意味", {depth: 2}]
                - u8: ["属性: AS_PATH", 0x40, "フラグ 0x40", "経路が通ってきた AS の列。ループ防止と経路選択に使う"]
                  depth: 1
                - u8: ["  タイプ", 2, "2 (AS_PATH)", "", {depth: 2}]
                - u8: ["  長さ", 6, "6", "", {depth: 2}]
                - u8: ["  セグメント種別", 2, "2 (AS_SEQUENCE)", "順序つきの AS の並び", {depth: 2}]
                - u8: ["  AS の数", 1, "1", "", {depth: 2}]
                - hex: ["  AS 番号", "0000fbf4", "64500", "左が一番最近通った AS。広告するたびに自分の AS を先頭に足す", {depth: 2}]
                - u8: ["属性: NEXT_HOP", 0x40, "フラグ 0x40", "", {depth: 1}]
                - u8: ["  タイプ", 3, "3 (NEXT_HOP)", "", {depth: 2}]
                - u8: ["  長さ", 4, "4", "", {depth: 2}]
                - ip4: ["  次の宛先", 192.0.2.1, 192.0.2.1, "この経路宛てのパケットはこのアドレスに渡して、の意味。eBGP では広告した自分のアドレス", {depth: 2}]
                - u8: ["NLRI: プレフィックス長", 24, "/24", "到達できるネットワーク"]
                - hex: ["  プレフィックス", "cb0071", "203.0.113", "/24 なので上位 3 バイトだけ書く", {depth: 1}]
      - kind: local
        node: r2
        label: "フィルタ → 経路選択"
        text: |
          1. 受信ポリシー: AS64500 は 203.0.113.0/24 を広告してよい (IRR に登録あり、RPKI の ROA でも Valid)

          2. 経路選択: LOCAL_PREF が高い → AS_PATH が短い → ORIGIN → MED → eBGP 優先 → … の順に比べる。今は経路が1本だけなのでこれが最良。

          3. 経路表 (RIB) に入れ、転送表 (FIB) にも反映する。

  - title: "隣の AS へ伝わっていく"
    desc: "R2 は自分の AS 番号を AS_PATH の先頭に足して、R3 にも広告します。"
    detail: |
      AS_PATH は [64510 64500] になりました。R3 は「AS64510 → AS64500 とたどれば 203.0.113.0/24 に行ける」と分かります。こうして経路は AS から AS へと伝わり、数分以内に世界中のルータが知ることになります。

      もし受け取った AS_PATH に自分の AS 番号が入っていたら、その経路は捨てます。これが BGP のループ防止です。

      (R2 と R3 の間のセッションは、すでに R1-R2 と同じ手順で確立済みとしています。)
    facts:
      - [AS_PATH, "64510 64500"]
      - [NEXT_HOP, "192.0.2.5 (R2 に書き換え)"]
    state:
      r3: "203.0.113.0/24 → R2"
    events:
      - kind: pkt
        from: r2
        to: r3
        color: violet
        label: UPDATE
        packet:
          summary: "UPDATE: 203.0.113.0/24 へは AS_PATH [64510 64500] で行けます"
          note: "UPDATE は「パス属性 (共通の性質)」と「NLRI (その属性を持つプレフィックスの一覧)」の組。同じ属性なら何百ものプレフィックスを1通にまとめられる。"
          layers:
            - ipv4: {src: 192.0.2.5, dst: 192.0.2.6, proto: 6, ttl: 1, tos: 0xc0, id: 0xfc21}
            - tcp: {sport: 41780, dport: 179, dname: bgp, seq: 2210004001, ack: 977120221, flags: "PSH,ACK"}
            - name: "BGP UPDATE"
              fields:
                - hex: [マーカー, ffffffffffffffffffffffffffffffff, "ff × 16", "昔の名残。今は常に全部 ff"]
                - len: [長さ, 2, "この BGP メッセージ全体の長さ (19〜4096)"]
                - u8: [タイプ, 2, "2 (UPDATE)"]
                - u16: ["取り下げ経路の長さ", 0, "0"]
                - u16: ["パス属性の長さ", 24, "24 バイト"]
                - u8: ["属性: ORIGIN", 0x40, "フラグ 0x40 (Well-known, 転送する)", "この経路がどこから来たか"]
                  depth: 1
                - u8: ["  タイプ", 1, "1 (ORIGIN)", "", {depth: 2}]
                - u8: ["  長さ", 1, "1", "", {depth: 2}]
                - u8: ["  値", 0, "0 (IGP)", "AS 内のネットワークを network 文で広告した、の意味", {depth: 2}]
                - u8: ["属性: AS_PATH", 0x40, "フラグ 0x40", "経路が通ってきた AS の列。ループ防止と経路選択に使う"]
                  depth: 1
                - u8: ["  タイプ", 2, "2 (AS_PATH)", "", {depth: 2}]
                - u8: ["  長さ", 10, "10", "", {depth: 2}]
                - u8: ["  セグメント種別", 2, "2 (AS_SEQUENCE)", "順序つきの AS の並び", {depth: 2}]
                - u8: ["  AS の数", 2, "2", "", {depth: 2}]
                - hex: ["  AS 番号", "0000fbfe0000fbf4", "64510 64500", "左が一番最近通った AS。広告するたびに自分の AS を先頭に足す", {depth: 2}]
                - u8: ["属性: NEXT_HOP", 0x40, "フラグ 0x40", "", {depth: 1}]
                - u8: ["  タイプ", 3, "3 (NEXT_HOP)", "", {depth: 2}]
                - u8: ["  長さ", 4, "4", "", {depth: 2}]
                - ip4: ["  次の宛先", 192.0.2.5, 192.0.2.5, "この経路宛てのパケットはこのアドレスに渡して、の意味。eBGP では広告した自分のアドレス", {depth: 2}]
                - u8: ["NLRI: プレフィックス長", 24, "/24", "到達できるネットワーク"]
                - hex: ["  プレフィックス", "cb0071", "203.0.113", "/24 なので上位 3 バイトだけ書く", {depth: 1}]
      - kind: local
        node: r3
        label: "経路表に登録"
        text: "203.0.113.0/24 → next hop 192.0.2.5 (AS_PATH 64510 64500) を経路表と転送表に登録。"

  - title: "経路に沿ってパケットが届く"
    desc: "AS64520 の利用者が 203.0.113.10 にアクセスすると、各ルータは BGP で学んだ経路に従ってパケットを渡していきます。"
    detail: |
      BGP はパケットを運ぶプロトコルではありません。BGP で作った「どこ宛てなら次は誰に渡すか」の表に従って、ルータが転送します。

      経路の広告とパケットの流れは逆向きになります。R1 → R2 → R3 と広告された経路を、パケットは R3 → R2 → R1 とたどります。
    events:
      - kind: pkt
        from: user
        to: srv
        color: blue
        label: "SYN :443"
        packet:
          summary: "TCP SYN 198.51.100.25 → 203.0.113.10:443"
          note: "BGP 自体はパケットを運ばない。BGP で作った経路表 (FIB) に従って、各ルータがパケットを転送する。"
          layers:
            - ipv4: {src: 198.51.100.25, dst: 203.0.113.10, proto: 6, ttl: 61, id: 0x9a3e}
            - tcp: {sport: 52211, dport: 443, dname: https, seq: 2701000123, flags: SYN}

  - title: "経路を取り下げる"
    desc: "AS64500 がメンテナンスでこのネットワークを止めると、R1 は「203.0.113.0/24 はもう使えません」と UPDATE で伝えます。"
    detail: |
      取り下げも UPDATE で送ります (Withdrawn Routes 欄)。R2 は経路表から消し、他に代わりの経路がなければ R3 にも取り下げを伝えます。

      BGP セッション自体が切れた場合 (ホールドタイム切れや NOTIFICATION) も、その相手から学んだ経路はすべて取り下げられます。大規模障害のときに経路が一斉に消えて「インターネットから見えなくなる」のは、この動きです。
    state:
      r2: "経路なし"
      r3: "経路なし"
    events:
      - kind: pkt
        from: r1
        to: r2
        color: red
        label: "UPDATE (取り下げ)"
        packet:
          summary: "UPDATE: 203.0.113.0/24 を取り下げます"
          layers:
            - ipv4: {src: 192.0.2.1, dst: 192.0.2.2, proto: 6, ttl: 1, tos: 0xc0, id: 0x405d}
            - tcp: {sport: 50123, dport: 179, dname: bgp, seq: 3804119133, ack: 1129044576, flags: "PSH,ACK"}
            - name: "BGP UPDATE"
              fields:
                - hex: [マーカー, ffffffffffffffffffffffffffffffff, "ff × 16", "昔の名残。今は常に全部 ff"]
                - len: [長さ, 2, "この BGP メッセージ全体の長さ (19〜4096)"]
                - u8: [タイプ, 2, "2 (UPDATE)"]
                - u16: ["取り下げ経路の長さ", 4, "4 バイト"]
                - u8: ["取り下げ: プレフィックス長", 24, "/24", "この経路はもう使えない"]
                  depth: 1
                - hex: ["  プレフィックス", "cb0071", "203.0.113", "/24 なので上位 3 バイトだけ書く", {depth: 1}]
                - u16: ["パス属性の長さ", 0, "0", "取り下げだけなので属性なし"]
      - kind: pkt
        from: r2
        to: r3
        color: red
        label: "UPDATE (取り下げ)"
        packet:
          summary: "UPDATE: 203.0.113.0/24 を取り下げます"
          layers:
            - ipv4: {src: 192.0.2.5, dst: 192.0.2.6, proto: 6, ttl: 1, tos: 0xc0, id: 0xfc54}
            - tcp: {sport: 41780, dport: 179, dname: bgp, seq: 2210004052, ack: 977120221, flags: "PSH,ACK"}
            - name: "BGP UPDATE"
              fields:
                - hex: [マーカー, ffffffffffffffffffffffffffffffff, "ff × 16", "昔の名残。今は常に全部 ff"]
                - len: [長さ, 2, "この BGP メッセージ全体の長さ (19〜4096)"]
                - u8: [タイプ, 2, "2 (UPDATE)"]
                - u16: ["取り下げ経路の長さ", 4, "4 バイト"]
                - u8: ["取り下げ: プレフィックス長", 24, "/24", "この経路はもう使えない"]
                  depth: 1
                - hex: ["  プレフィックス", "cb0071", "203.0.113", "/24 なので上位 3 バイトだけ書く", {depth: 1}]
                - u16: ["パス属性の長さ", 0, "0", "取り下げだけなので属性なし"]

outro:
  title: "隣同士の「ここなら行けるよ」の積み重ねが、インターネットの地図になる"
  text: "BGP のルータは、隣の AS から聞いた経路に自分の AS 番号を足して、さらに隣へ伝えます。全体を知っている誰かがいるわけではなく、隣同士のやりとりだけで世界中の道順ができあがっています。"
  points:
    - "経路選択は「最短」ではなく「ポリシー」。お金の流れ (顧客 > ピア > 上流) で LOCAL_PREF を決めるのが普通"
    - "誤った広告 (経路ハイジャック・経路リーク) がそのまま広がってしまう弱点がある。RPKI (ROA) で「このプレフィックスはこの AS が広告してよい」を検証して防ぐ"
    - "より長いプレフィックス (/24 より /25) が優先されるので、細かい経路を広告されると乗っ取られる"
    - "eBGP は TTL 1 で直結の相手とだけ話す。GTSM では逆に TTL 255 で送って、受信側で 255 を確認する"
