name: 本社・大阪支店ネットワーク
nodes:
  - id: rt-1
    type: router
  - id: sw-1
    type: switch
  - id: sw-2
    type: switch
  - id: prn-1
    type: printer
  - id: rt-2
    type: router
  - id: ergw
    type: gateway
links:
  - endpoints:
      - node: rt-1
        port: te1
      - node: sw-1
        port: te0/1
    speed: 10G
  - endpoints:
      - node: sw-1
        port: te0/47
      - node: sw-2
        port: te0/47
    speed: 10G
    connection: lag-1
  - endpoints:
      - node: sw-1
        port: te0/48
      - node: sw-2
        port: te0/48
    speed: 10G
    connection: lag-1
  - endpoints:
      - node: sw-2
        port: ge0/10
      - node: prn-1
    speed: 100M
    description: ポートは1G対応
  - endpoints:
      - node: rt-1
        port: ge0
      - node: rt-2
        port: ge0
    speed: 1G
    bandwidth: 300M
    connection: carrier-ethernet
    description: 通信事業者の広域イーサネット
  - endpoints:
      - node: rt-1
      - node: ergw
    bandwidth: 2G
    connection: expressroute
    description: ExpressRoute回線。途中の機器は不明
  - endpoints:
      - node: rt-2
      - node: rt-1
    virtual: true
    connection: ipsec-backup
    description: バックアップIPsecトンネル
connections:
  - id: lag-1
    label: LAG
  - id: carrier-ethernet
  - id: expressroute
  - id: ipsec-backup
