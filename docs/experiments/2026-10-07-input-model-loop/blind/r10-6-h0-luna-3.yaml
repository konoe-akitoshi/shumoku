name: Company network
groups:
  - id: server-room
    label: Server room
  - id: ap-northeast-1a
    label: ap-northeast-1a
  - id: ap-northeast-1c
    label: ap-northeast-1c

segments:
  - id: vlan-10
    label: VLAN 10
    vlan: 10
    prefix: 192.168.10.0/24
    group: server-room
    addresses:
      fw-v:
        - 192.168.10.2
      app-1:
        - 192.168.10.20
  - id: sub-a
    label: sub-a
    prefix: 10.0.1.0/24
    group: ap-northeast-1a
    addresses:
      web-c:
        - 10.0.1.10
  - id: sub-c
    label: sub-c
    prefix: 10.0.2.0/24
    group: ap-northeast-1c
    addresses:
      db-c:
        - 10.0.2.20

redundancy:
  - id: prod
    label: prod
    nodes:
      - hv-1
      - hv-2

nodes:
  - id: rt-1
    type: router
    product: yamaha/rtx3510
    group: server-room
  - id: hv-1
    type: server
    product: dell/poweredge-r750
    software: vmware-esxi
    group: server-room
  - id: hv-2
    type: server
    product: dell/poweredge-r750
    software: vmware-esxi
    group: server-room
  - id: fw-v
    type: firewall
    product: palo-alto-networks/vm-series
    software: pan-os
    group: server-room
    host: hv-1
  - id: app-1
    type: vm
    software: ubuntu
    group: server-room
    host: prod
  - id: main
    type: vpc
    prefix: 10.0.0.0/16
    group: ap-northeast-1
  - id: igw-1
    type: internet-gateway
    host: main
    group: ap-northeast-1
  - id: tgw-1
    type: transit-gateway
    group: ap-northeast-1
  - id: web-c
    type: ec2
    product: amazon/ec2/t3.medium
    software: amazon-linux
    group: ap-northeast-1a
    host: main
  - id: db-c
    type: rds
    product: amazon/rds/mysql
    group: ap-northeast-1c
    host: main

links:
  - endpoints:
      - node: hv-1
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: hv-2
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: main
      - node: igw-1
  - endpoints:
      - node: main
      - node: tgw-1
  - endpoints:
      - node: tgw-1
      - node: sub-a
  - endpoints:
      - node: tgw-1
      - node: sub-c
  - endpoints:
      - node: rt-1
      - node: tgw-1
    description: Site-to-Site VPN tunnel 1
    virtual: true
  - endpoints:
      - node: rt-1
      - node: tgw-1
    description: Site-to-Site VPN tunnel 2
    virtual: true
