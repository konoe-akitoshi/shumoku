autonomousSystems:
  - asn: 64500
  - asn: 64510
    label: Transit provider
  - asn: 64520
  - asn: 64530
  - asn: 64540

groups:
  - id: dc-a
    label: DC-A

segments:
  - id: ix-t-lan
    label: IX-T peering LAN
    prefix: 198.51.100.0/24
    addresses:
      br2: 198.51.100.10
      as64520-peer: 198.51.100.20
      as64530-participant: 198.51.100.30

nodes:
  - id: br1
    label: br1
    type: router
    as: 64500
    group: dc-a
  - id: br2
    label: br2
    type: router
    as: 64500
    group: dc-a
    description: No BGP session with AS64530.
  - id: as64510-router
    type: router
    as: 64510
  - id: as64520-peer
    as: 64520
  - id: as64530-participant
    as: 64530

links:
  - endpoints:
      - node: br1
        port: xe-0/0/0
      - node: as64510-router
    speed: 10G
    description: Cable carrying the eBGP session to AS64510.
  - endpoints:
      - node: br1
      - node: as64510-router
    virtual: true
    description: eBGP over the br1 xe-0/0/0 cable; AS64500 buys transit from AS64510.
  - endpoints:
      - node: br2
      - node: as64520-peer
    virtual: true
    segments:
      - ix-t-lan
    description: Settlement-free eBGP peering over IX-T with 198.51.100.20.
  - endpoints:
      - node: br2
      - as: 64540
    virtual: true
    description: eBGP transit purchased from AS64540; cable or path unknown.
