segments:
  - { id: users, vlan: 10 }
  - { id: voice, vlan: 20 }
nodes:
  - { id: rt }
  - { id: sw-1 }
  - { id: sw-2 }
  - { id: sw-3 }
  - { id: printer }
links:
  - endpoints: [{ node: rt, port: ge0 }, { node: sw-1, port: "1" }]
    segments: [users, voice]
  - endpoints: [{ node: sw-1, port: "2" }, { node: sw-2 }]
  - endpoints: [{ node: sw-2, port: "5" }, { node: printer }]
    segments: [users]
