name: ShowNet 2025 external network
description: >-
  Internet-facing part of Interop Tokyo ShowNet, AS290.
  Facts from the public ShowNet 2025 topology map and PeeringDB (2026-10).

segments:
  - id: jpix-v4
    label: JPIX IPv4 peering LAN
    prefix: 210.171.224.0/23
    addresses:
      mx204: 210.171.224.9
  - id: jpix-v6
    label: JPIX IPv6 peering LAN
    prefix: 2001:de8:8::/64
    addresses:
      mx204: 2001:de8:8::20:82:1
  - id: dix-ie-v4
    label: DIX-IE IPv4 peering LAN
    prefix: 202.249.2.0/24
    addresses:
      mx204: 202.249.2.199
  - id: dix-ie-v6
    label: DIX-IE IPv6 peering LAN
    prefix: 2001:200:0:fe00::/64
    addresses:
      mx204: 2001:200:0:fe00::122:1
  - id: jpnap-v4
    label: JPNAP IPv4 peering LAN
    prefix: 210.173.176.0/23
    addresses:
      ncs57c3: 210.173.176.9
  - id: jpnap-v6
    label: JPNAP IPv6 peering LAN
    prefix: 2001:7fa:7:1::/64
    addresses:
      ncs57c3: 2001:7fa:7:1::290:1
  - id: bbix-tokyo-v4
    label: BBIX Tokyo IPv4 peering LAN
    prefix: 101.203.88.0/22
    addresses:
      cisco8712: 101.203.88.109
  - id: bbix-tokyo-v6
    label: BBIX Tokyo IPv6 peering LAN
    prefix: 2001:de8:c::/64
    addresses:
      cisco8712: 2001:de8:c::290:1
  - id: bbix-singapore
    label: BBIX Singapore peering LAN
  - id: bbix-hong-kong
    label: BBIX Hong Kong peering LAN
  - id: jcix
    label: JCIX peering LAN
  - id: enternet-ix
    label: ENTERNET IX peering LAN
  - id: ipa
    label: IPA peering LAN

nodes:
  - id: mx204
    label: mx204
    type: border router
    asn: 290
    description: Peers with 34 other ASes over JPIX.
  - id: ncs57c3
    label: ncs57c3
    type: border router
    asn: 290
    description: >-
      Peers with 34 other ASes over JPNAP. JPNAP is reached over
      NTT's IOWN Open APN optical network; the wavelength carrying
      JPNAP is unknown.
  - id: cisco8712
    label: cisco8712
    type: border router
    asn: 290
    description: Peers with 34 other ASes over BBIX Tokyo.
  - id: kddi-cpe
    label: kddi-cpe
  - id: ncs5501se-kote
    label: ncs5501se.kote
    type: switch
  - id: kddi-internet-gateway
    label: KDDI Internet Gateway
    description: Internet transit from KDDI.
  - id: jpix
    label: JPIX
    type: IX
  - id: dix-ie
    label: DIX-IE
    type: IX
  - id: apn-cpe
    label: apn-cpe
    description: OCN Internet transit comes in through this CPE.
  - id: wxd
    label: wxd
    type: optical device
    description: Terminates wavelengths of NTT's IOWN Open APN.
  - id: wxt-1
    label: wxt-1
    type: optical device
    description: Terminates wavelengths of NTT's IOWN Open APN.
  - id: softbank-cpe
    label: softbank-cpe
    description: >-
      Carries BBIX Tokyo, BBIX Singapore, BBIX Hong Kong,
      and SmartInternet transit from SoftBank.
  - id: ucxg-cpe
    label: ucxg-cpe
    description: >-
      Its two links to cisco8712 carry JCIX, ENTERNET IX and IPA.
      The distribution across the links is unspecified.
  - id: jpnap-route-server
    type: IX route server
    description: JPNAP route server; its name is not given.
  - id: bbix-tokyo-route-server
    type: IX route server
    description: BBIX Tokyo route server; its name is not given.
  - id: dix-ie-route-server
    type: IX route server
    description: DIX-IE route server; its name is not given.

links:
  - endpoints:
      - node: kddi-cpe
      - node: mx204
        port: 0-0-0
    description: >-
      Carries JPIX and DIX-IE connectivity and KDDI Internet transit.
  - endpoints:
      - node: kddi-cpe
      - node: ncs5501se-kote
        port: 0-0-1-3
    description: KDDI line; ncs5501se.kote is at its far end.
  - endpoints:
      - node: ncs5501se-kote
        port: 0-0-1-0
      - node: kddi-internet-gateway
  - endpoints:
      - node: ncs5501se-kote
        port: 0-0-1-1
      - node: jpix
    segments:
      - jpix-v4
      - jpix-v6
  - endpoints:
      - node: ncs5501se-kote
        port: 0-0-1-2
      - node: dix-ie
    segments:
      - dix-ie-v4
      - dix-ie-v6
  - endpoints:
      - node: apn-cpe
      - node: ncs57c3
        port: 0-0-0-24
    description: OCN Internet transit.
  - endpoints:
      - node: wxd
      - node: ncs57c3
  - endpoints:
      - node: wxt-1
      - node: ncs57c3
  - endpoints:
      - node: softbank-cpe
      - node: cisco8712
        port: 0-2-0-0
    description: >-
      Carries BBIX Tokyo, BBIX Singapore, BBIX Hong Kong,
      and SmartInternet transit from SoftBank.
  - endpoints:
      - node: ucxg-cpe
      - node: cisco8712
        port: 0-1-0-0
  - endpoints:
      - node: ucxg-cpe
      - node: cisco8712
        port: 0-1-0-1
  - endpoints:
      - node: ncs57c3
      - node: jpnap-route-server
    virtual: true
    description: Peering with JPNAP's route server.
  - endpoints:
      - node: cisco8712
      - node: bbix-tokyo-route-server
    virtual: true
    description: Peering with BBIX Tokyo's route server.
  - endpoints:
      - node: mx204
      - node: dix-ie-route-server
    virtual: true
    description: Peering with DIX-IE's route server.
