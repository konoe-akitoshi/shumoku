name: 本社と大阪支店のネットワーク

nodes:
  - id: rt-1
    label: 本社ルータ
  - id: sw-1
    label: コアスイッチ
  - id: sw-2
  - id: prn-1
    label: プリンタ
  - id: rt-2
    label: 大阪支店ルータ
  - id: ergw
    label: Azure ExpressRoute ゲートウェイ

connections:
  - id: lag-1
    label: LAG

links:
  - endpoints:
      - node: rt-1
        port: te1
      - node: sw-1
        port: te0/1
    speedMbps: 10000

  - endpoints:
      - node: sw-1
        port: te0/47
      - node: sw-2
        port: te0/47
    speedMbps: 10000
    connection: lag-1

  - endpoints:
      - node: sw-1
        port: te0/48
      - node: sw-2
        port: te0/48
    speedMbps: 10000
    connection: lag-1

  - endpoints:
      - node: sw-2
        port: ge0/10
      - node: prn-1
    speedMbps: 100
    description: ポートは1G対応

  - endpoints:
      - node: rt-1
        port: ge0
      - node: rt-2
        port: ge0
    speedMbps: 1000
    description: 通信事業者の広域イーサネット。引き渡しは両端1G Ethernet、契約帯域は300M

  - endpoints:
      - node: rt-1
      - node: ergw
    speedMbps: 2000
    description: ExpressRoute回線。途中の機器は不明

  - endpoints:
      - node: rt-2
      - node: rt-1
    virtual: true
    description: バックアップのIPsecトンネル
