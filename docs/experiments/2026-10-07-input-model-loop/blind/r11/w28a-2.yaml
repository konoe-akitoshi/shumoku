name: AS64500
groups:
  - id: dc-a
    label: DC-A
segments:
  - id: ix-t-peering-lan
    label: IX-T peering LAN
    prefix: 198.51.100.0/24
    addresses:
      br2: 198.51.100.10
      as64520-router: 198.51.100.20
      as64530-router: 198.51.100.30
nodes:
  - id: br1
    type: router
    asn: 64500
    group: dc-a
  - id: br2
    type: router
    asn: 64500
    group: dc-a
  - id: transit-64510-router
    type: router
    asn: 64510
    assumed: true
  - id: as64520-router
    type: router
    asn: 64520
    assumed: true
  - id: as64530-router
    type: router
    asn: 64530
    assumed: true
  - id: transit-64540-router
    type: router
    asn: 64540
    assumed: true
links:
  - endpoints:
      - node: br1
        port: xe-0/0/0
      - node: transit-64510-router
    speed: 10G
    description: eBGP session runs over this cable; AS64500 is the customer
  - endpoints:
      - node: br2
      - segment: ix-t-peering-lan
  - endpoints:
      - node: as64520-router
      - segment: ix-t-peering-lan
  - endpoints:
      - node: as64530-router
      - segment: ix-t-peering-lan
  - endpoints:
      - node: br2
      - node: as64520-router
    virtual: true
    description: Settlement-free eBGP peering over IX-T
  - endpoints:
      - node: br2
      - node: transit-64540-router
    virtual: true
    description: Transit eBGP session; cable or path is unknown
