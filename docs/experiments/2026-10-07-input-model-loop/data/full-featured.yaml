name: Full Featured Network
description: Comprehensive example showcasing all Shumoku features

# The original nested "VMware Cluster" box was a cluster, not a place;
# its hosts and VMs are placed in the data center it sat in.
groups:
  - { id: site-datacenter, label: Tokyo Data Center }
  - { id: site-dr, label: Osaka DR Site }
  - { id: site-office, label: Head Office }

segments:
  - { id: vlan100, vlan: 100 }
  - { id: vlan200, vlan: 200 }
  - { id: vlan300, vlan: 300 }
  - { id: vlan10, vlan: 10 }
  - { id: vlan20, vlan: 20 }
  # The original only shows these under each name; which network they sit on is not stated.
  - id: mgmt
    label: Management
    addresses:
      core-rt-01: 10.0.0.1
      core-rt-02: 10.0.0.2
      core-sw-01: 10.0.1.1
      core-sw-02: 10.0.1.2
      access-sw-01: 10.0.2.1
      access-sw-02: 10.0.2.2
      esxi-01: 10.0.10.1
      esxi-02: 10.0.10.2
      vm-web-01: 10.0.20.10
      vm-db-01: 10.0.20.20
      fw-01: 10.0.100.1
      dr-rt-01: 10.1.0.1
      dr-sw-01: 10.1.1.1
      dr-storage-01: 10.1.10.1
      office-rt-01: 10.2.0.1
      office-sw-01: 10.2.1.1
  - id: core-rt-ha
    prefix: 10.255.0.0/30
    addresses: { core-rt-01: 10.255.0.1/30, core-rt-02: 10.255.0.2/30 }

nodes:
  - id: core-rt-01
    type: router
    vendor: yamaha
    model: rtx3510
    group: site-datacenter
  - id: core-rt-02
    type: router
    vendor: yamaha
    model: rtx3510
    group: site-datacenter
  - id: core-sw-01
    type: l3-switch
    vendor: juniper
    model: qfx5120
    group: site-datacenter
  - id: core-sw-02
    type: l3-switch
    vendor: juniper
    model: qfx5120
    group: site-datacenter
  - id: access-sw-01
    type: l2-switch
    vendor: juniper
    model: ex2300
    group: site-datacenter
  - id: access-sw-02
    type: l2-switch
    vendor: juniper
    model: ex2300
    group: site-datacenter
  - { id: esxi-01, type: server, group: site-datacenter }
  - { id: esxi-02, type: server, group: site-datacenter }
  - { id: vm-web-01, type: server, group: site-datacenter }
  - { id: vm-db-01, type: server, group: site-datacenter }
  - id: fw-01
    type: firewall
    vendor: juniper
    model: srx4100
    group: site-datacenter
  - { id: new-sw-01, type: l2-switch, group: site-datacenter }
  - { id: failed-ap-01, type: access-point, group: site-datacenter }
  - id: dr-rt-01
    type: router
    vendor: yamaha
    model: rtx1300
    group: site-dr
  - { id: dr-sw-01, type: l3-switch, group: site-dr }
  - id: dr-storage-01
    type: server
    description: Backup Storage
    group: site-dr
  - { id: office-rt-01, type: router, group: site-office }
  - id: office-sw-01
    type: l2-switch
    vendor: yamaha
    model: swx2310
    group: site-office
  - { id: office-ap-01, type: access-point, vendor: aruba, model: ap-505, group: site-office }
  - { id: office-ap-02, type: access-point, vendor: aruba, model: ap-505, group: site-office }

links:
  - endpoints:
      - { node: core-rt-01, port: xe-0/0/0 }
      - { node: core-rt-02, port: xe-0/0/0 }
    segments: [core-rt-ha]
    speed: 100G
  - endpoints: [{ node: core-rt-01, port: xe-0/0/1 }, { node: core-sw-01, port: xe-0/0/0 }]
    speed: 40G
    segments: [vlan100, vlan200, vlan300]
  - endpoints: [{ node: core-rt-01, port: xe-0/0/2 }, { node: core-sw-02, port: xe-0/0/0 }]
    speed: 40G
    segments: [vlan100, vlan200, vlan300]
  - endpoints: [{ node: core-rt-02, port: xe-0/0/1 }, { node: core-sw-01, port: xe-0/0/1 }]
    speed: 40G
    segments: [vlan100, vlan200, vlan300]
  - endpoints: [{ node: core-rt-02, port: xe-0/0/2 }, { node: core-sw-02, port: xe-0/0/1 }]
    speed: 40G
    segments: [vlan100, vlan200, vlan300]
  - endpoints: [{ node: core-sw-01, port: xe-0/0/10 }, { node: core-sw-02, port: xe-0/0/10 }]
    speed: 100G
    segments: [vlan100, vlan200, vlan300]
  - endpoints: [{ node: core-sw-01, port: xe-0/0/5 }, { node: fw-01, port: xe-0/0/0 }]
    speed: 10G
    segments: [vlan100]
  - endpoints: [{ node: core-sw-01, port: ge-0/0/1 }, { node: access-sw-01, port: ge-0/0/48 }]
    speed: 10G
    segments: [vlan200, vlan300]
  - endpoints: [{ node: core-sw-02, port: ge-0/0/1 }, { node: access-sw-02, port: ge-0/0/48 }]
    speed: 10G
    segments: [vlan200, vlan300]
  - endpoints: [{ node: access-sw-01, port: ge-0/0/1 }, { node: esxi-01, port: vmnic0 }]
    speed: 25G
    segments: [vlan200]
  - endpoints: [{ node: access-sw-01, port: ge-0/0/2 }, { node: esxi-02, port: vmnic0 }]
    speed: 25G
    segments: [vlan200]
  - endpoints: [{ node: access-sw-02, port: ge-0/0/1 }, { node: esxi-01, port: vmnic1 }]
    speed: 25G
    segments: [vlan200]
  - endpoints: [{ node: access-sw-02, port: ge-0/0/2 }, { node: esxi-02, port: vmnic1 }]
    speed: 25G
    segments: [vlan200]
  - endpoints: [{ node: esxi-01, port: vSwitch0 }, { node: vm-web-01, port: eth0 }]
    speed: 10G
    segments: [vlan200]
  - endpoints: [{ node: esxi-02, port: vSwitch0 }, { node: vm-db-01, port: eth0 }]
    speed: 10G
    segments: [vlan300]
  - endpoints: [{ node: core-rt-01, port: xe-0/0/10 }, { node: dr-rt-01, port: ge-0/0/0 }]
    speed: 10G
  - endpoints: [{ node: dr-rt-01, port: ge-0/0/1 }, { node: dr-sw-01, port: ge-0/0/48 }]
    speed: 1G
    segments: [vlan100, vlan200]
  - endpoints: [{ node: dr-sw-01, port: ge-0/0/1 }, { node: dr-storage-01, port: eth0 }]
    speed: 1G
    segments: [vlan200]
  - endpoints: [{ node: core-rt-02, port: tun0 }, { node: office-rt-01, port: tun0 }]
  - endpoints: [{ node: office-rt-01, port: ge-0/0/1 }, { node: office-sw-01, port: ge-0/0/48 }]
    speed: 1G
    segments: [vlan10, vlan20]
  - endpoints: [{ node: office-sw-01, port: ge-0/0/1 }, { node: office-ap-01, port: eth0 }]
    speed: 1G
    segments: [vlan20]
  - endpoints: [{ node: office-sw-01, port: ge-0/0/2 }, { node: office-ap-02, port: eth0 }]
    speed: 1G
    segments: [vlan20]
