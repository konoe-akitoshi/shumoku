name: 本社とAWS東京のネットワーク
groups:
  - id: hq-server-room
    label: 本社 サーバ室
  - id: aws-tokyo
    label: AWS 東京
  - id: vpc-main
    label: VPC main
    parent: aws-tokyo
  - id: subnet-sub-a
    label: サブネット sub-a
    parent: vpc-main
routingDomains:
  - id: guest
    label: guest
    prefix: 192.168.20.0/24
  - id: vpc-main-domain
    label: VPC main
    prefix: 10.0.0.0/16
segments:
  - id: vlan-10
    label: 業務
    vlan: 10
    prefix: 192.168.10.0/24
  - id: vlan-20
    label: 来客
    vlan: 20
    routingDomain: guest
  - id: aws-vpc-main
    label: VPC main
    prefix: 10.0.0.0/16
    group: vpc-main
  - id: aws-subnet-sub-a
    label: サブネット sub-a
    prefix: 10.0.1.0/24
    group: subnet-sub-a
nodes:
  - id: rt-1
    label: rt-1
    type: router
    product: Yamaha/RTX3510
    group: hq-server-room
  - id: sw-1
    label: sw-1
    type: switch
    product: ?/SWX2322P-16MT
    group: hq-server-room
  - id: hv-1
    label: hv-1
    type: virtualization-host
    product: Dell/PowerEdge R750
    software: VMware ESXi
    group: hq-server-room
  - id: web-1
    label: web-1
    type: virtual-machine
    host: hv-1
    addressInUnknownSegment: 192.168.10.20
  - id: igw-1
    label: igw-1
    type: internet-gateway
    group: vpc-main
  - id: vgw-1
    label: vgw-1
    type: virtual-private-gateway
    group: vpc-main
connections:
  - id: vpn-rt-vgw
    label: IPsec Site-to-Site VPN (2 tunnels)
links:
  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: port 1
    speed: 1G
    cable: Cat6
    length: 3m
    segments:
      - vlan-10
      - vlan-20
  - endpoints:
      - node: hv-1
      - node: sw-1
    speed: 10G
  - endpoints:
      - node: rt-1
      - routingDomain: guest
    virtual: true
  - endpoints:
      - node: igw-1
      - segment: aws-vpc-main
    virtual: true
  - endpoints:
      - node: vgw-1
      - segment: aws-vpc-main
    virtual: true
  - endpoints:
      - node: rt-1
      - node: vgw-1
    virtual: true
    connection: vpn-rt-vgw
    description: IPsec Site-to-Site VPN、2トンネル
