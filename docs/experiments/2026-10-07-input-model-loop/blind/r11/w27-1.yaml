name: AS64500
groups:
  - id: DC-A
  - id: IX-T
routingDomains:
  - id: AS64500
  - id: AS64510
  - id: AS64520
  - id: AS64530
  - id: AS64540
segments:
  - id: IX-T-peering-LAN
    label: IX-T peering LAN
    prefix: 198.51.100.0/24
nodes:
  - id: br1
    type: router
    group: DC-A
    host: AS64500
  - id: br2
    type: router
    group: DC-A
    host: AS64500
  - id: AS64510-router
    type: router
    assumed: true
    host: AS64510
  - id: AS64520
    type: router
    assumed: true
    address: 198.51.100.20
    host: AS64520
  - id: AS64530
    type: router
    assumed: true
    address: 198.51.100.30
    host: AS64530
links:
  - endpoints:
      - node: br1
        port: xe-0/0/0
      - node: AS64510-router
    speed: 10G
    connection: transit-AS64510
    description: eBGP session; AS64500 is the customer of AS64510.
  - endpoints:
      - node: br2
      - segment: IX-T-peering-LAN
    segments:
      - IX-T-peering-LAN
  - endpoints:
      - node: AS64520
      - segment: IX-T-peering-LAN
    segments:
      - IX-T-peering-LAN
  - endpoints:
      - node: AS64530
      - segment: IX-T-peering-LAN
    segments:
      - IX-T-peering-LAN
  - endpoints:
      - node: br2
      - node: AS64520
    connection: peering-AS64520
    description: Settlement-free eBGP session over IX-T.
  - endpoints:
      - node: br2
      - node: AS64540
    connection: transit-AS64540
    description: eBGP session; AS64500 buys transit from AS64540.
connections:
  - id: transit-AS64510
    label: Transit to AS64510
  - id: peering-AS64520
    label: Settlement-free peering with AS64520
  - id: transit-AS64540
    label: Transit from AS64540
