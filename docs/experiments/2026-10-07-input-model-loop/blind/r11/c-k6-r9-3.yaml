name: Company network
groups:
  - id: server-room
    label: Server room
routingDomains:
  - id: prod
    label: prod
segments:
  - id: staff
    label: staff
    vlan: 10
    prefix: 192.168.1.0/24
  - id: database
    label: database
    vlan: 30
    prefix: 192.168.3.0/24
  - id: prod
    label: prod
redundancy:
  - id: prod
    label: prod
    nodes:
      - esx-1
      - esx-2
      - esx-3
nodes:
  - id: core
    type: switch
    group: server-room
  - id: esx-1
    type: virtualization-host
    product: vmware/esxi
    group: server-room
  - id: esx-2
    type: virtualization-host
    product: vmware/esxi
    group: server-room
  - id: esx-3
    type: virtualization-host
    product: vmware/esxi
    group: server-room
  - id: web-1
    type: virtual-machine
    host: esx-1
  - id: db-1
    type: virtual-machine
    host: prod
  - id: mon-1
    type: virtual-machine
    address: 10.99.0.50
links:
  - endpoints:
      - node: core
      - node: esx-1
    speed: 25G
    segments:
      - staff
      - database
  - endpoints:
      - node: core
      - node: esx-2
    speed: 25G
    segments:
      - staff
      - database
  - endpoints:
      - node: core
      - node: esx-3
    speed: 25G
    segments:
      - staff
      - database
  - endpoints:
      - node: web-1
      - segment: staff
    virtual: true
  - endpoints:
      - node: db-1
      - segment: database
    virtual: true
