name: AS64500 network
routingDomains:
  - id: ix-t
    label: IX-T
    prefix: 198.51.100.0/24
nodes:
  - id: br1
    label: br1
    type: router
    asn: 64500
    group: dc-a
  - id: br2
    label: br2
    type: router
    asn: 64500
    group: dc-a
  - id: transit-64510
    asn: 64510
  - id: as64520
    asn: 64520
  - id: as64530
    asn: 64530
  - id: transit-64540
    asn: 64540
groups:
  - id: dc-a
    label: DC-A
segments:
  - id: ix-t-lan
    label: IX-T peering LAN
    prefix: 198.51.100.0/24
    routingDomain: ix-t
    addresses:
      br2: 198.51.100.10
      as64520: 198.51.100.20
      as64530: 198.51.100.30
connections:
  - id: ebgp-br1-as64510
    label: eBGP to AS64510
  - id: ebgp-br2-as64520
    label: eBGP to AS64520
  - id: ebgp-br2-as64540
    label: eBGP to AS64540
links:
  - endpoints:
      - node: br1
        port: xe-0/0/0
      - node: transit-64510
    speed: 10G
    connection: ebgp-br1-as64510
  - endpoints:
      - node: br2
      - segment: ix-t-lan
    connection: ebgp-br2-as64520
    virtual: true
  - endpoints:
      - node: as64520
      - segment: ix-t-lan
  - endpoints:
      - node: as64530
      - segment: ix-t-lan
  - endpoints:
      - node: br2
      - node: transit-64540
    connection: ebgp-br2-as64540
    virtual: true
