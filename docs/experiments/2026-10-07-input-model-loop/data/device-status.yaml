name: Device Status Visualization
description: Shows devices with different operational statuses

# The original boxes were environments (production / staging / decommissioned),
# not places, and each node's status lived in its label and style. Neither fits yet.
segments:
  # The original only shows these under each name; which network they sit on is not stated.
  - id: mgmt
    label: Management
    addresses: { core-sw-01: 10.0.1.1, core-sw-02: 10.0.1.2, staged-sw-01: 10.0.2.1 }

nodes:
  - { id: core-sw-01, type: l3-switch, vendor: juniper, model: ex4400 }
  - { id: core-sw-02, type: l3-switch, vendor: juniper, model: ex4400 }
  - { id: new-fw-01, type: firewall }
  - { id: staged-sw-01, type: l2-switch }
  - { id: failed-sw-01, type: l2-switch }
  - { id: offline-srv-01, type: server }
  - { id: inventory-sw-01, type: l2-switch }
  - { id: old-sw-01, type: l2-switch }

links:
  - endpoints: [{ node: core-sw-01, port: xe-0/0/0 }, { node: core-sw-02, port: xe-0/0/0 }]
    speed: 40G
  - endpoints: [{ node: core-sw-01, port: ge-0/0/1 }, { node: staged-sw-01, port: ge-0/0/0 }]
    speed: 10G
  - endpoints: [{ node: core-sw-02, port: ge-0/0/1 }, { node: failed-sw-01, port: ge-0/0/0 }]
    speed: 10G
  - endpoints: [{ node: failed-sw-01, port: ge-0/0/2 }, { node: offline-srv-01, port: eth0 }]
    speed: 1G
