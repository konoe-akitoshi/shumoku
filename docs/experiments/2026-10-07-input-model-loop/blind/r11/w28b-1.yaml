name: AS64500

groups:
  - id: DC-A
  - id: IX-T

autonomousSystems:
  - asn: 64500
  - asn: 64510
  - asn: 64520
  - asn: 64530
  - asn: 64540

segments:
  - id: IX-T-peering-LAN
    label: IX-T peering LAN
    prefix: 198.51.100.0/24
    group: IX-T
    addresses:
      br2: 198.51.100.10
      as64520-router: 198.51.100.20
      as64530-router: 198.51.100.30

nodes:
  - id: br1
    as: 64500
    group: DC-A
  - id: br2
    as: 64500
    group: DC-A
  - id: as64510-router
    as: 64510
    assumed: true
  - id: as64520-router
    as: 64520
    assumed: true
  - id: as64530-router
    as: 64530
    assumed: true
  - id: as64540-router
    as: 64540
    assumed: true

connections:
  - id: br1-transit-as64510
    label: Transit to AS64510
  - id: br2-peer-as64520
    label: Settlement-free peering with AS64520
  - id: br2-transit-as64540
    label: Transit to AS64540

links:
  - endpoints:
      - node: br1
        port: xe-0/0/0
      - node: as64510-router
    speed: 10G
    connection: br1-transit-as64510
    virtual: true
    description: eBGP session over a 10G cable; cable path detail is not specified.
  - endpoints:
      - node: br2
      - segment: IX-T-peering-LAN
  - endpoints:
      - node: br2
      - node: as64520-router
    segments:
      - IX-T-peering-LAN
    connection: br2-peer-as64520
    virtual: true
    description: Settlement-free eBGP session over IX-T.
  - endpoints:
      - node: br2
      - node: as64540-router
    connection: br2-transit-as64540
    virtual: true
    description: eBGP session; cable or path is unknown.
