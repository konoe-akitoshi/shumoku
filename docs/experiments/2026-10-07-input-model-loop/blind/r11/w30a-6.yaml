name: AS64500 network
groups:
  - id: DC-A
    label: DC-A
nodes:
  - id: br1
    label: br1
    type: router
    asn: 64500
    group: DC-A
  - id: br2
    label: br2
    type: router
    asn: 64500
    group: DC-A
  - id: transit-64510
    type: router
    asn: 64510
  - id: as64520
    type: router
    asn: 64520
  - id: as64530
    type: router
    asn: 64530
  - id: as64540
    type: router
    asn: 64540
segments:
  - id: IX-T-LAN
    label: IX-T peering LAN
    prefix: 198.51.100.0/24
    addresses:
      br2: 198.51.100.10
      as64520: 198.51.100.20
      as64530: 198.51.100.30
connections:
  - id: bgp-transit-64510
    label: eBGP transit to AS64510
  - id: bgp-peer-64520
    label: settlement-free eBGP peering with AS64520
  - id: bgp-transit-64540
    label: eBGP transit to AS64540
links:
  - endpoints:
      - node: br1
        port: xe-0/0/0
      - node: transit-64510
    speed: 10G
    connection: bgp-transit-64510
  - endpoints:
      - node: br2
      - segment: IX-T-LAN
    connection: bgp-peer-64520
  - endpoints:
      - node: as64520
      - segment: IX-T-LAN
    connection: bgp-peer-64520
  - endpoints:
      - node: as64530
      - segment: IX-T-LAN
  - endpoints:
      - node: br2
      - node: as64520
    virtual: true
    connection: bgp-peer-64520
  - endpoints:
      - node: br2
      - node: as64540
    virtual: true
    connection: bgp-transit-64540
