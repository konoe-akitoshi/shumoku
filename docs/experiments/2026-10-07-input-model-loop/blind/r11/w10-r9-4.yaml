name: Server room

networks:
  - id: server-room
  - id: staff-network
    prefix: 192.168.1.0/24
  - id: database-network
    prefix: 192.168.3.0/24

groups:
  - id: server-room

segments:
  - id: vlan-10
    label: VLAN 10 (staff)
    vlan: 10
    prefix: 192.168.1.0/24
    network: staff-network
    group: server-room
    addresses:
      web-1: 192.168.1.20
  - id: vlan-30
    label: VLAN 30 (database)
    vlan: 30
    prefix: 192.168.3.0/24
    network: database-network
    group: server-room

redundancy:
  - id: prod
    label: prod
    nodes:
      - esx-1
      - esx-2
      - esx-3

nodes:
  - id: core
    label: Core switch
    group: server-room
  - id: esx-1
    product: vmware/esxi
    software: VMware ESXi
    group: server-room
  - id: esx-2
    product: vmware/esxi
    software: VMware ESXi
    group: server-room
  - id: esx-3
    product: vmware/esxi
    software: VMware ESXi
    group: server-room
  - id: web-1
    type: vm
    host: esx-1
  - id: db-1
    type: vm
    host: prod
  - id: mon-1
    type: vm
    address: 10.99.0.50

links:
  - endpoints:
      - node: core
      - node: esx-1
    speed: 25G
    segments:
      - vlan-10
      - vlan-30
  - endpoints:
      - node: core
      - node: esx-2
    speed: 25G
    segments:
      - vlan-10
      - vlan-30
  - endpoints:
      - node: core
      - node: esx-3
    speed: 25G
    segments:
      - vlan-10
      - vlan-30
