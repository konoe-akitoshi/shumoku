name: 本社とAWS東京

groups:
  - id: hq
    label: 本社
  - id: server-room
    label: サーバ室
    parent: hq
  - id: ap-northeast-1a

routingDomains:
  - id: guest
    label: guest
  - id: aws-main
    label: AWS 東京 VPC main
    prefix: 10.0.0.0/16

segments:
  - id: vlan-10
    label: VLAN 10（業務）
    vlan: 10
    prefix: 192.168.10.0/24
  - id: vlan-20
    label: VLAN 20（来客）
    vlan: 20
    routingDomain: guest
  - id: sub-a
    label: sub-a
    prefix: 10.0.1.0/24
    routingDomain: aws-main
    group: ap-northeast-1a

nodes:
  - id: rt-1
    type: router
    product: yamaha/rtx3510
    group: server-room
  - id: sw-1
    type: switch
    product: ?/swx2322p-16mt
    group: server-room
  - id: hv-1
    type: server
    product: dell/poweredge-r750
    software: VMware ESXi
    group: server-room
  - id: web-1
    type: vm
    host: hv-1
    group: server-room
  - id: igw-1
    type: internet-gateway
    group: ap-northeast-1a
  - id: vgw-1
    type: virtual-private-gateway
    group: ap-northeast-1a

links:
  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: port 1
    speed: 1G
    cable: cat6
    length: 3m
    segments:
      - vlan-10
      - vlan-20
  - endpoints:
      - node: hv-1
      - node: sw-1
    speed: 10G
  - endpoints:
      - node: web-1
      - segment: vlan-10
    virtual: true
    description: VLAN 10 のポートグループ
  - endpoints:
      - node: igw-1
      - routingDomain: aws-main
  - endpoints:
      - node: vgw-1
      - routingDomain: aws-main
  - endpoints:
      - node: rt-1
      - node: vgw-1
    virtual: true
    connection: vpn-site-to-site
    description: IPsec Site-to-Site VPN トンネル 1
  - endpoints:
      - node: rt-1
      - node: vgw-1
    virtual: true
    connection: vpn-site-to-site
    description: IPsec Site-to-Site VPN トンネル 2

connections:
  - id: vpn-site-to-site
    label: IPsec Site-to-Site VPN

redundancy: []
