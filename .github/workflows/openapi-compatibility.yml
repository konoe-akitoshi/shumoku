name: OpenAPI Compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - apps/server/api/openapi.json
      - .github/workflows/openapi-compatibility.yml
      - apps/server/openapi-compatibility-warnings.txt

permissions:
  contents: read

jobs:
  breaking-changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

      - name: Reject breaking OpenAPI changes
        uses: oasdiff/oasdiff-action/breaking@9c0494cfee8b8fcc9fb383ed2d5d3fbdae169b93 # v0.1.15
        with:
          base: origin/${{ github.base_ref }}:apps/server/api/openapi.json
          revision: HEAD:apps/server/api/openapi.json
          fail-on: WARN
          warn-ignore: apps/server/openapi-compatibility-warnings.txt
