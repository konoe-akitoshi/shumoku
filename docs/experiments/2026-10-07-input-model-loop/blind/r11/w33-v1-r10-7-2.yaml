name: Server room and AWS Tokyo

vrfs:
  - id: guest

groups:
  - id: server-room
    label: Server room
  - id: ap-northeast-1a
  - id: ap-northeast-1c

segments:
  - id: vlan-10
    vlan: 10
    prefix: 192.168.10.0/24
    addresses:
      fw-v: 192.168.10.2
      app-1: 192.168.10.20
  - id: vlan-20
    vlan: 20
    prefix: 192.168.20.0/24
    vrf: guest
    addresses:
      ap-1: 192.168.20.5
  - id: vpc-main
    label: VPC main
    prefix: 10.0.0.0/16
  - id: sub-a
    prefix: 10.0.1.0/24
    group: ap-northeast-1a
    vrf: main
    addresses:
      web-c: 10.0.1.10
  - id: sub-c
    prefix: 10.0.2.0/24
    group: ap-northeast-1c
    vrf: main
    addresses:
      db-c: 10.0.2.20

redundancy:
  - id: prod
    label: vSphere HA cluster prod
    nodes:
      - hv-1
      - hv-2

connections:
  - id: vpn-1
    label: Site-to-Site VPN

nodes:
  - id: rt-1
    product: yamaha/rtx3510
    group: server-room
  - id: ap-1
    group: server-room
  - id: hv-1
    product: dell/poweredge-r750
    software: VMware ESXi
    group: server-room
  - id: hv-2
    product: dell/poweredge-r750
    software: VMware ESXi
    group: server-room
  - id: fw-v
    product: palo-alto-networks/vm-series
    host: hv-1
    group: server-room
  - id: app-1
    software: Ubuntu
    host: prod
    group: server-room
  - id: igw-1
    type: internet-gateway
  - id: tgw-1
    type: transit-gateway
  - id: web-c
    type: ec2
    product: aws/ec2/t3.medium
    software: Amazon Linux
    group: ap-northeast-1a
  - id: db-c
    type: rds
    product: aws/rds/mysql
    group: ap-northeast-1c

links:
  - endpoints:
      - node: ap-1
      - node: rt-1
        port: lan2
    segments:
      - vlan-20
  - endpoints:
      - node: hv-1
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: hv-2
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: fw-v
      - segment: vlan-10
    virtual: true
  - endpoints:
      - node: app-1
      - segment: vlan-10
    virtual: true
  - endpoints:
      - node: web-c
      - segment: sub-a
    virtual: true
  - endpoints:
      - node: db-c
      - segment: sub-c
    virtual: true
  - endpoints:
      - node: igw-1
      - segment: vpc-main
    virtual: true
  - endpoints:
      - node: tgw-1
      - segment: sub-a
    virtual: true
  - endpoints:
      - node: tgw-1
      - segment: sub-c
    virtual: true
  - endpoints:
      - node: tgw-1
      - segment: vpc-main
    virtual: true
  - endpoints:
      - node: rt-1
      - node: tgw-1
    connection: vpn-1
    virtual: true
  - endpoints:
      - node: rt-1
      - node: tgw-1
    connection: vpn-1
    virtual: true
