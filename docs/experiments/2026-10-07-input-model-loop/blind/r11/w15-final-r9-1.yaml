name: company
routingDomains:
  - id: server-room
segments:
  - id: staff
    label: staff
    vlan: 10
    prefix: 192.168.1.0/24
    routingDomain: server-room
    addresses:
      web-1: 192.168.1.20
  - id: database
    label: database
    vlan: 30
    prefix: 192.168.3.0/24
    routingDomain: server-room
nodes:
  - id: core
    type: switch
  - id: esx-1
    type: server
    product: vmware/esxi
    software: VMware ESXi
  - id: esx-2
    type: server
    product: vmware/esxi
    software: VMware ESXi
  - id: esx-3
    type: server
    product: vmware/esxi
    software: VMware ESXi
  - id: prod
    type: cluster
  - id: web-1
    type: virtual-machine
    host: esx-1
    segments:
      - staff
  - id: db-1
    type: virtual-machine
    host: prod
    segments:
      - database
  - id: mon-1
    type: virtual-machine
    assumed: true
    address: 10.99.0.50
redundancy:
  - id: prod
    label: prod
    nodes:
      - esx-1
      - esx-2
      - esx-3
links:
  - endpoints:
      - node: core
      - node: esx-1
    speed: 25G
    segments:
      - staff
      - database
  - endpoints:
      - node: core
      - node: esx-2
    speed: 25G
    segments:
      - staff
      - database
  - endpoints:
      - node: core
      - node: esx-3
    speed: 25G
    segments:
      - staff
      - database
