name: Company network
groups:
  - id: server-room
    label: Server room
  - id: ap-northeast-1a
    label: ap-northeast-1a
  - id: ap-northeast-1c
    label: ap-northeast-1c
routingDomains:
  - id: guest
    label: guest
  - id: main
    label: main
    prefix: 10.0.0.0/16
connections:
  - id: site-to-site-vpn
    label: Site-to-Site VPN
segments:
  - id: vlan-20
    label: VLAN 20
    vlan: 20
    prefix: 192.168.20.0/24
    routingDomain: guest
    group: server-room
    addresses:
      ap-1: 192.168.20.5
  - id: vlan-10
    label: VLAN 10
    vlan: 10
    prefix: 192.168.10.0/24
    group: server-room
    addresses:
      fw-v: 192.168.10.2
      app-1: 192.168.10.20
  - id: sub-a
    label: sub-a
    prefix: 10.0.1.0/24
    routingDomain: main
    group: ap-northeast-1a
    addresses:
      web-c: 10.0.1.10
  - id: sub-c
    label: sub-c
    prefix: 10.0.2.0/24
    routingDomain: main
    group: ap-northeast-1c
    addresses:
      db-c: 10.0.2.20
  - id: tgw-sub-a
    label: tgw-1 attachment in sub-a
    routingDomain: main
  - id: tgw-sub-c
    label: tgw-1 attachment in sub-c
    routingDomain: main
redundancy:
  - id: prod
    label: prod
    nodes:
      - hv-1
      - hv-2
nodes:
  - id: rt-1
    label: rt-1
    type: router
    product: yamaha/rtx3510
    group: server-room
  - id: ap-1
    label: ap-1
    group: server-room
  - id: hv-1
    label: hv-1
    type: server
    product: dell/poweredge-r750
    software: vmware-esxi
    group: server-room
  - id: hv-2
    label: hv-2
    type: server
    product: dell/poweredge-r750
    software: vmware-esxi
    group: server-room
  - id: fw-v
    label: fw-v
    type: firewall
    product: palo-alto-networks/vm-series
    host: hv-1
    group: server-room
  - id: app-1
    label: app-1
    type: server
    software: ubuntu
    host: prod
    group: server-room
  - id: web-c
    label: web-c
    type: ec2
    product: amazon/ec2/t3.medium
    software: amazon-linux
    routingDomain: main
    segments:
      - sub-a
    group: ap-northeast-1a
  - id: db-c
    label: db-c
    type: database
    product: amazon/rds/mysql
    routingDomain: main
    segments:
      - sub-c
    group: ap-northeast-1c
  - id: igw-1
    label: igw-1
    type: internet-gateway
    routingDomain: main
  - id: tgw-1
    label: tgw-1
    type: transit-gateway
    routingDomain: main
    segments:
      - tgw-sub-a
      - tgw-sub-c
links:
  - endpoints:
      - node: ap-1
      - node: rt-1
        port: lan2
    segments:
      - vlan-20
  - endpoints:
      - node: hv-1
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: hv-2
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: fw-v
      - node: vlan-10
    virtual: true
    segments:
      - vlan-10
  - endpoints:
      - node: app-1
      - node: vlan-10
    virtual: true
    segments:
      - vlan-10
  - endpoints:
      - node: web-c
      - node: sub-a
    virtual: true
    segments:
      - sub-a
  - endpoints:
      - node: db-c
      - node: sub-c
    virtual: true
    segments:
      - sub-c
  - endpoints:
      - node: igw-1
      - node: main
    virtual: true
  - endpoints:
      - node: tgw-1
      - node: tgw-sub-a
    virtual: true
    segments:
      - tgw-sub-a
  - endpoints:
      - node: tgw-1
      - node: tgw-sub-c
    virtual: true
    segments:
      - tgw-sub-c
  - endpoints:
      - node: rt-1
      - node: tgw-1
    connection: site-to-site-vpn
    virtual: true
  - endpoints:
      - node: rt-1
      - node: tgw-1
    connection: site-to-site-vpn
    virtual: true
