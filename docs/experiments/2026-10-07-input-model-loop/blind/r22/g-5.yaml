name: 本社ネットワーク
groups:
  - id: headquarters
    label: 本社
    groups:
      - id: server-room
        label: サーバ室
  - id: aws-tokyo
    label: AWS 東京
    groups:
      - id: vpc-main
        label: VPC main
      - id: subnet-sub-a
        label: サブネット sub-a
routingDomains:
  - id: guest
    label: guest
    prefix: 10.0.0.0/16
connections:
  - id: site-to-site-vpn
    label: IPsec Site-to-Site VPN
segments:
  - id: vlan-10
    label: 業務
    vlan: 10
    prefix: 192.168.10.0/24
  - id: vlan-20
    label: 来客
    vlan: 20
    routingDomain: guest
nodes:
  - id: rt-1
    label: rt-1
    type: router
    product: Yamaha/RTX3510
    group: server-room
  - id: sw-1
    label: sw-1
    type: switch
    product: ?/SWX2322P-16MT
    group: server-room
  - id: hv-1
    label: hv-1
    type: virtualization host
    product: Dell/PowerEdge R750
    software: VMware ESXi
    group: server-room
  - id: web-1
    label: web-1
    type: VM
    host: hv-1
    group: server-room
  - id: vpc-main
    label: main
    type: VPC
    group: vpc-main
  - id: subnet-sub-a
    label: sub-a
    type: subnet
    description: ap-northeast-1a
    group: subnet-sub-a
  - id: igw-1
    label: igw-1
    type: internet gateway
    group: vpc-main
  - id: vgw-1
    label: vgw-1
    type: virtual private gateway
    group: vpc-main
links:
  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: port 1
    speed: 1G
    cable: Cat6
    length: 3m
    segments:
      - vlan-10
      - vlan-20
  - endpoints:
      - node: hv-1
      - node: sw-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: web-1
      - segment: vlan-10
  - endpoints:
      - node: rt-1
      - node: vgw-1
    virtual: true
    connection: site-to-site-vpn
  - endpoints:
      - node: vgw-1
        port: tunnel 1
      - node: rt-1
  - endpoints:
      - node: vgw-1
        port: tunnel 2
      - node: rt-1
