# Enterprise Network - OGP Compact + Realistic
name: Enterprise Network
description: 'Compact OGP: Shared handoff segments + logical HA pairs + DC/DMZ/Campus'
groups:
  - id: cloud
    label: AWS Cloud
  - id: internet
    label: Internet / ISP
  - id: edge
    label: Edge
  - id: security
    label: Security
  - id: dmz
    label: DMZ (VLAN100)
  - id: datacenter
    label: Data Center
  - id: campus
    label: Campus
segments:
  - id: vlan-100
    vlan: 100
  - id: vlan-200
    vlan: 200
  - id: vlan-300
    vlan: 300
  - id: vlan-10
    vlan: 10
nodes:
  - id: cloud-services
    label: Services VPC
    product: aws
    group: cloud
    address: 172.16.0.0/16
  - id: vgw
    label: VPN Gateway
    product: aws
    group: cloud
  - id: isp
    label: <b>AS64496</b>
    type: internet
    group: internet
  - id: onu
    label: <b>ONU</b>
    type: l2-switch
    group: edge
  - id: edge-rt-ha
    label: Edge Routers (VRRP)
    type: router
    product: yamaha/rtx3510
    group: edge
    description: 'RT1/RT2 : RTX3510'
  - id: fw-ha
    label: Firewall HA
    type: firewall
    product: juniper/srx4600-ac
    group: security
    description: 'FW1/FW2 : SRX4600'
  - id: dmz-sw
    label: DMZ-SW
    type: l2-switch
    product: yamaha/swx2310_28gt
    group: dmz
    description: SWX2310-28GT
  - id: web-srv
    label: Web
    type: server
    group: dmz
    address: 10.100.10.10
  - id: core-sw
    label: Core-SW
    type: l3-switch
    product: juniper/qfx5120-48y
    group: datacenter
    description: QFX5120
  - id: vsphere
    label: vSphere Cluster
    type: server
    group: datacenter
    description: 2x ESXi + VMs
  - id: vm-app-01
    label: vm-app-01
    type: server
    group: datacenter
    description: 10.1.20.1 (VLAN200)
  - id: vm-db-01
    label: vm-db-01
    type: database
    group: datacenter
    description: 10.1.20.10 (VLAN300)
  - id: dist-sw
    label: Dist-SW
    type: l3-switch
    product: juniper/ex4400-48p
    group: campus
    description: EX4400
  - id: ap-01
    label: AP-01
    type: access-point
    product: aruba/ap500-series
    group: campus
    description: Aruba 500 Series
links:
  - endpoints: [{node: vgw, port: tun0}, {node: edge-rt-ha, port: tun0}]
    virtual: true
  - endpoints: [{node: isp, port: ge-0/0/x}, {node: onu, port: uplink}]
    speed: 1G
  - endpoints: [{node: onu, port: ge-1/0/1-2}, {node: edge-rt-ha, port: wan1 (RT1/RT2)}]
    speed: 1G
  - endpoints: [{node: edge-rt-ha, port: outside}, {node: fw-ha, port: outside}]
    speed: 10G
  - endpoints: [{node: fw-ha, port: inside}, {node: core-sw, port: xe-0/0/0-1}]
    speed: 10G
  - endpoints: [{node: fw-ha, port: dmz}, {node: dmz-sw, port: uplink}]
    segments: [vlan-100]
    speed: 10G
  - endpoints: [{node: dmz-sw, port: eth1}, {node: web-srv, port: eth0}]
    segments: [vlan-100]
    speed: 1G
  - endpoints: [{node: core-sw, port: ge-0/0/1-2}, {node: vsphere, port: vmnic0-1}]
    segments: [vlan-200, vlan-300]
    speed: 10G
  - endpoints: [{node: vsphere, port: vSwitch0}, {node: vm-app-01, port: eth0}]
    segments: [vlan-200]
    virtual: true
  - endpoints: [{node: vsphere, port: vSwitch0}, {node: vm-db-01, port: eth0}]
    segments: [vlan-300]
    virtual: true
  - endpoints: [{node: core-sw, port: ae0}, {node: dist-sw, port: ae0}]
    speed: 40G
  - endpoints: [{node: dist-sw, port: eth1}, {node: ap-01, port: eth0}]
    segments: [vlan-10]
    speed: 1G
