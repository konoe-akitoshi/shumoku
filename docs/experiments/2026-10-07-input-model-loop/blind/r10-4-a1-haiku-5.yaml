name: On-Premises and AWS Topology
description: Server room connected to AWS Tokyo region via Site-to-Site VPN

groups:
  - id: server-room
    label: Server Room
  - id: ap-northeast-1
    label: AWS Tokyo Region (ap-northeast-1)
  - id: ap-northeast-1a
    label: Availability Zone ap-northeast-1a
    parent: ap-northeast-1
  - id: ap-northeast-1c
    label: Availability Zone ap-northeast-1c
    parent: ap-northeast-1

segments:
  - id: vlan-10
    label: VLAN 10
    vlan: 10
    prefix: 192.168.10.0/24
    group: server-room
    addresses:
      rt-1:
        - 192.168.10.1
      hv-1: []
      hv-2: []
      fw-v:
        - 192.168.10.2
      app-1:
        - 192.168.10.20

  - id: sub-a
    label: Subnet sub-a
    prefix: 10.0.1.0/24
    group: ap-northeast-1a
    addresses:
      web-c:
        - 10.0.1.10
      tgw-1: []

  - id: sub-c
    label: Subnet sub-c
    prefix: 10.0.2.0/24
    group: ap-northeast-1c
    addresses:
      db-c:
        - 10.0.2.20
      tgw-1: []

redundancy:
  - id: prod
    label: vSphere HA Cluster prod
    nodes:
      - hv-1
      - hv-2

nodes:
  - id: rt-1
    label: rt-1
    type: router
    product: yamaha/rtx3510
    group: server-room

  - id: hv-1
    label: hv-1
    type: hypervisor
    product: dell/poweredge/r750
    software: vmware-esxi
    group: server-room

  - id: hv-2
    label: hv-2
    type: hypervisor
    product: dell/poweredge/r750
    software: vmware-esxi
    group: server-room

  - id: fw-v
    label: fw-v
    type: firewall
    product: paloaltonetworks/vm-series
    host: hv-1
    group: server-room

  - id: app-1
    label: app-1
    type: server
    software: ubuntu
    host: prod
    group: server-room

  - id: web-c
    label: web-c
    type: server
    product: aws/ec2/t3.medium
    software: amazon-linux
    group: ap-northeast-1a

  - id: db-c
    label: db-c
    type: database
    product: aws/rds/mysql
    group: ap-northeast-1c

  - id: igw-1
    label: igw-1
    type: router
    product: aws/igw
    group: ap-northeast-1

  - id: tgw-1
    label: tgw-1
    type: router
    product: aws/transit-gateway
    group: ap-northeast-1

links:
  - endpoints:
      - node: hv-1
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10

  - endpoints:
      - node: hv-2
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10

  - endpoints:
      - node: rt-1
      - node: tgw-1
    virtual: true
    description: Site-to-Site VPN connection (IPsec tunnel 1)

  - endpoints:
      - node: rt-1
      - node: tgw-1
    virtual: true
    description: Site-to-Site VPN connection (IPsec tunnel 2)
