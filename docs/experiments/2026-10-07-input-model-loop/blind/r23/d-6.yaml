name: 本社と大阪支店のネットワーク
groups:
  - id: hq
    label: 本社
  - id: osaka
    label: 大阪支店

connections:
  - id: lag-sw1-sw2
    label: LAG
  - id: wan-hq-osaka
    label: 広域イーサネット
  - id: expressroute
    label: ExpressRoute
  - id: ipsec-backup
    label: バックアップ IPsec トンネル

nodes:
  - id: rt-1
    type: router
    group: hq
  - id: sw-1
    type: switch
    group: hq
  - id: sw-2
    type: switch
    group: hq
  - id: prn-1
    type: printer
    group: hq
  - id: rt-2
    type: router
    group: osaka
  - id: ergw
    type: gateway
  - id: isp-wan
    label: 通信事業者の広域イーサネット
    type: network
    assumed: true
  - id: expressroute-circuit
    label: ExpressRoute 回線
    type: network
    assumed: true

links:
  - endpoints:
      - node: rt-1
        port: te1
      - node: sw-1
        port: te0/1
    speed: 10G

  - endpoints:
      - node: sw-1
        port: te0/47
      - node: sw-2
        port: te0/47
    speed: 10G
    connection: lag-sw1-sw2

  - endpoints:
      - node: sw-1
        port: te0/48
      - node: sw-2
        port: te0/48
    speed: 10G
    connection: lag-sw1-sw2

  - endpoints:
      - node: sw-2
        port: ge0/10
      - node: prn-1
    speed: 100M
    description: ポートは1G対応

  - endpoints:
      - node: rt-1
        port: ge0
      - node: isp-wan
    speed: 1G
    bandwidth: 300M
    connection: wan-hq-osaka
    description: 引き渡し Ethernet

  - endpoints:
      - node: isp-wan
      - node: rt-2
        port: ge0
    speed: 1G
    bandwidth: 300M
    connection: wan-hq-osaka
    description: 引き渡し Ethernet

  - endpoints:
      - node: rt-1
      - node: expressroute-circuit
    bandwidth: 2G
    connection: expressroute

  - endpoints:
      - node: expressroute-circuit
      - node: ergw
    connection: expressroute

  - endpoints:
      - node: rt-2
      - node: rt-1
    connection: ipsec-backup
    virtual: true
    description: IPsec トンネル
