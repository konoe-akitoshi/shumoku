# NetBox Enhanced Example
# Showcases new features: bandwidth visualization, VLAN coloring, cable types, legend
name: NetBox Enhanced Network
description: Example showcasing bandwidth, VLAN, and cable type visualization
groups:
  - id: site-tokyo-dc
    label: Tokyo DC
  - id: site-osaka-dc
    label: Osaka DC
  - id: site-office
    label: Head Office
segments:
  - id: vlan-100
    vlan: 100
  - id: vlan-200
    vlan: 200
  - id: vlan-300
    vlan: 300
  - id: vlan-10
    vlan: 10
  - id: vlan-20
    vlan: 20
redundancy:
  - id: core-rt-01-core-rt-02
    nodes: [core-rt-01, core-rt-02]
nodes:
  - id: core-rt-01
    label: core-rt-01
    type: router
    product: yamaha/rtx3510
    group: site-tokyo-dc
    address: 10.0.0.1
  - id: core-rt-02
    label: core-rt-02
    type: router
    product: yamaha/rtx3510
    group: site-tokyo-dc
    address: 10.0.0.2
  - id: core-sw-01
    label: core-sw-01
    type: l3-switch
    product: juniper/ex4400-48p
    group: site-tokyo-dc
    address: 10.0.1.1
  - id: access-sw-01
    label: access-sw-01
    type: l2-switch
    group: site-tokyo-dc
    address: 10.0.2.1
  - id: access-sw-02
    label: access-sw-02
    type: l2-switch
    group: site-tokyo-dc
    address: 10.0.2.2
  - id: osaka-rt-01
    label: osaka-rt-01
    type: router
    product: yamaha/rtx1300
    group: site-osaka-dc
    address: 10.1.0.1
  - id: osaka-sw-01
    label: osaka-sw-01
    type: l3-switch
    group: site-osaka-dc
    address: 10.1.1.1
  - id: office-rt-01
    label: office-rt-01
    type: router
    group: site-office
    address: 10.2.0.1
  - id: office-sw-01
    label: office-sw-01
    type: l2-switch
    group: site-office
    address: 10.2.1.1
  - id: office-ap-01
    label: office-ap-01
    type: access-point
    product: aruba
    group: site-office
links:
  - endpoints: [{node: core-rt-01, port: xe-0/0/0}, {node: core-rt-02, port: xe-0/0/0}]
    speed: 100G
  - endpoints: [{node: core-rt-01, port: xe-0/0/1}, {node: core-sw-01, port: xe-0/0/0}]
    segments: [vlan-100, vlan-200, vlan-300]
    speed: 40G
  - endpoints: [{node: core-rt-02, port: xe-0/0/1}, {node: core-sw-01, port: xe-0/0/1}]
    segments: [vlan-100, vlan-200, vlan-300]
    speed: 40G
  - endpoints: [{node: core-sw-01, port: ge-0/0/1}, {node: access-sw-01, port: ge-0/0/0}]
    segments: [vlan-100, vlan-200]
    speed: 10G
  - endpoints: [{node: core-sw-01, port: ge-0/0/2}, {node: access-sw-02, port: ge-0/0/0}]
    segments: [vlan-100, vlan-300]
    speed: 10G
  - endpoints: [{node: core-rt-01, port: xe-0/0/2}, {node: osaka-rt-01, port: ge-0/0/0}]
    virtual: true
    speed: 10G
  - endpoints: [{node: osaka-rt-01, port: ge-0/0/1}, {node: osaka-sw-01, port: ge-0/0/0}]
    segments: [vlan-100]
    speed: 1G
  - endpoints: [{node: core-rt-02, port: tun0}, {node: office-rt-01, port: tun0}]
    virtual: true
  - endpoints: [{node: office-rt-01, port: ge-0/0/1}, {node: office-sw-01, port: ge-0/0/0}]
    segments: [vlan-10, vlan-20]
    speed: 1G
  - endpoints: [{node: office-sw-01, port: ge-0/0/10}, {node: office-ap-01, port: eth0}]
    segments: [vlan-20]
    speed: 1G
