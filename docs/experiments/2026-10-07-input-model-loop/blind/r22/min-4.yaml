name: 本社
groups:
  - id: server-room
    label: サーバ室
nodes:
  - id: rt-1
    label: rt-1
    type: router
    product: yamaha/rtx3510
    group: server-room
  - id: sw-1
    label: sw-1
    type: switch
    model: SWX2322P-16MT
    group: server-room
  - id: hv-1
    label: hv-1
    type: server
    vendor: dell
    model: PowerEdge R750
    os: VMware ESXi
    group: server-room
  - id: web-1
    label: web-1
    type: vm
    group: server-room
  - id: main
    label: main
    type: vpc
    provider: aws
    region: ap-northeast-1
    cidr: 10.0.0.0/16
  - id: sub-a
    label: sub-a
    type: subnet
    cidr: 10.0.1.0/24
    availabilityZone: ap-northeast-1a
    group: main
  - id: igw-1
    label: igw-1
    type: internet-gateway
    group: main
  - id: vgw-1
    label: vgw-1
    type: virtual-private-gateway
    group: main
links:
  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: "1"
    cable:
      length: 3m
      type: Cat6
    speed: 1G
    vlans:
      - id: 10
        name: 業務
        subnet: 192.168.10.0/24
      - id: 20
        name: 来客
        vrf: guest
  - endpoints:
      - node: sw-1
      - node: hv-1
    speed: 10G
  - endpoints:
      - node: hv-1
      - node: web-1
    type: virtual
    portGroup:
      vlan: 10
    address: 192.168.10.20
  - endpoints:
      - node: rt-1
      - node: vgw-1
    type: vpn
    protocol: IPsec
    connection: Site-to-Site
    tunnels: 2
