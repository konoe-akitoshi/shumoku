name: AS64500
autonomousSystems:
  - asn: 64500
  - asn: 64510
  - asn: 64520
  - asn: 64530
  - asn: 64540
groups:
  - id: DC-A
nodes:
  - id: br1
    as: 64500
    group: DC-A
  - id: br2
    as: 64500
    group: DC-A
  - id: transit-router-64510
    as: 64510
    assumed: true
  - id: ix-t-as64520
    as: 64520
    assumed: true
  - id: ix-t-as64530
    as: 64530
    assumed: true
  - id: transit-router-64540
    as: 64540
    assumed: true
segments:
  - id: IX-T-peering-LAN
    prefix: 198.51.100.0/24
    addresses:
      br2: 198.51.100.10
      ix-t-as64520: 198.51.100.20
      ix-t-as64530: 198.51.100.30
links:
  - endpoints:
      - node: br1
        port: xe-0/0/0
      - node: transit-router-64510
    speed: 10G
    connection: br1-as64510-ebgp
  - endpoints:
      - node: br2
      - node: as
        as: 64520
    segments:
      - IX-T-peering-LAN
    connection: br2-as64520-ebgp
