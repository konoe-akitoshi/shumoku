groups:
  - id: branch
    label: Branch
  - id: headquarters
    label: Headquarters

segments:
  - id: office
    label: office
    vlan: 10
  - id: voice
    label: voice
    vlan: 20

nodes:
  - id: onu
    type: onu
    group: branch
  - id: rt-1
    type: router
    group: branch
    style:
      icon: https://example.com/rt.svg
  - id: sw-1
    type: switch
    group: branch
  - id: srv-1
    type: server
    group: branch
  - id: hq-rt
    group: headquarters
  - id: pdu-1
    type: pdu
    group: branch

links:
  - endpoints:
      - node: onu
      - node: rt-1
        port: lan2
    cable: fiber
    length: 2m
    style:
      stroke: magenta

  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: xe-0/2/3
    speed: 10G
    segments: [office, voice]
    style:
      stroke: blue

  - endpoints:
      - node: sw-1
        port: ge-0/0/1
      - node: srv-1
    speed: 1G
    segments: [office]
    style:
      stroke: blue

  - endpoints:
      - node: rt-1
      - node: hq-rt
    description: IPsec tunnel
    virtual: true
    style:
      dashed: true

  - endpoints:
      - node: rt-1
      - node: pdu-1
        port: '1'
    cable: power
    style:
      stroke: gray

  - endpoints:
      - node: sw-1
      - node: pdu-1
        port: '2'
    cable: power
    style:
      stroke: gray

  - endpoints:
      - node: srv-1
      - node: pdu-1
        port: '3'
    cable: power
    style:
      stroke: gray
