name: Company network
groups:
  - id: server-room
    label: Server room
  - id: aws-tokyo
    label: AWS Tokyo (ap-northeast-1)
  - id: ap-northeast-1a
    label: ap-northeast-1a
    parent: aws-tokyo
  - id: ap-northeast-1c
    label: ap-northeast-1c
    parent: aws-tokyo
segments:
  - id: vlan10
    label: VLAN 10
    vlan: 10
    prefix: 192.168.10.0/24
    addresses:
      fw-v: [192.168.10.2]
      app-1: [192.168.10.20]
  - id: sub-a
    label: sub-a
    prefix: 10.0.1.0/24
    group: ap-northeast-1a
    addresses:
      web-c: [10.0.1.10]
      main: []
      tgw-1: []
  - id: sub-c
    label: sub-c
    prefix: 10.0.2.0/24
    group: ap-northeast-1c
    addresses:
      db-c: [10.0.2.20]
      main: []
      tgw-1: []
redundancy:
  - id: prod
    label: vSphere HA cluster prod
    nodes: [hv-1, hv-2]
nodes:
  - id: rt-1
    type: router
    product: yamaha/rtx3510
    group: server-room
  - id: hv-1
    type: server
    product: dell/poweredge-r750
    software: vmware/esxi
    group: server-room
  - id: hv-2
    type: server
    product: dell/poweredge-r750
    software: vmware/esxi
    group: server-room
  - id: fw-v
    type: firewall
    product: paloalto/vm-series
    host: hv-1
    group: server-room
  - id: app-1
    type: vm
    software: ubuntu
    host: prod
    group: server-room
  - id: main
    label: VPC main
    type: vpc
    description: VPC main, address range 10.0.0.0/16
    group: aws-tokyo
  - id: web-c
    type: vm
    product: aws/ec2/t3.medium
    software: amazon-linux
    group: ap-northeast-1a
  - id: db-c
    type: database
    product: aws/rds/mysql
    group: ap-northeast-1c
  - id: igw-1
    type: internet-gateway
    product: aws/internet-gateway
    group: aws-tokyo
  - id: tgw-1
    type: transit-gateway
    product: aws/transit-gateway
    group: aws-tokyo
links:
  - endpoints: [{ node: rt-1 }, { node: hv-1 }]
    speed: 10G
    segments: [vlan10]
  - endpoints: [{ node: rt-1 }, { node: hv-2 }]
    speed: 10G
    segments: [vlan10]
  - endpoints: [{ node: igw-1 }, { node: main }]
    virtual: true
    description: Internet gateway attached to the VPC
  - endpoints: [{ node: tgw-1 }, { node: main }]
    virtual: true
    segments: [sub-a, sub-c]
    description: Transit Gateway attachment through sub-a and sub-c
  - endpoints: [{ node: rt-1 }, { node: tgw-1 }]
    virtual: true
    description: Site-to-Site VPN, IPsec tunnel 1
  - endpoints: [{ node: rt-1 }, { node: tgw-1 }]
    virtual: true
    description: Site-to-Site VPN, IPsec tunnel 2
