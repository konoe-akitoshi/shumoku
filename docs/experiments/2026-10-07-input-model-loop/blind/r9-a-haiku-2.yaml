name: Server Room Virtualization

segments:
  - id: vlan-10
    label: VLAN 10 (Staff)
    vlan: 10
    prefix: 192.168.1.0/24
    addresses:
      web-1:
        - 192.168.1.20
  - id: vlan-30
    label: VLAN 30 (Database)
    vlan: 30
    prefix: 192.168.3.0/24
    addresses:
      db-1: []

nodes:
  - id: core
    label: core
    type: switch
  - id: esx-1
    label: esx-1
    type: hypervisor
    vendor: VMware
    model: ESXi
  - id: esx-2
    label: esx-2
    type: hypervisor
    vendor: VMware
    model: ESXi
  - id: esx-3
    label: esx-3
    type: hypervisor
    vendor: VMware
    model: ESXi
  - id: web-1
    label: web-1
    type: vm
  - id: db-1
    label: db-1
    type: vm
  - id: mon-1
    label: mon-1
    type: vm
    address: 10.99.0.50
    assumed: true

redundancy:
  - id: prod
    label: prod
    nodes:
      - esx-1
      - esx-2
      - esx-3

links:
  - endpoints:
      - node: core
      - node: esx-1
    speed: 25G
    segments:
      - vlan-10
      - vlan-30
  - endpoints:
      - node: core
      - node: esx-2
    speed: 25G
    segments:
      - vlan-10
      - vlan-30
  - endpoints:
      - node: core
      - node: esx-3
    speed: 25G
    segments:
      - vlan-10
      - vlan-30
  - endpoints:
      - node: esx-1
      - node: web-1
    virtual: true
    segments:
      - vlan-10
