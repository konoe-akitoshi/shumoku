connections:
  - id: transit-AS64510
    label: AS64500–AS64510 eBGP transit
  - id: peering-AS64520
    label: AS64500–AS64520 settlement-free eBGP peering
  - id: transit-AS64540
    label: AS64500–AS64540 eBGP transit
