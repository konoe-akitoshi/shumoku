groups:
  - id: hq
    label: 本社
  - id: osaka
    label: 大阪支店
nodes:
  - id: rt-1
    type: router
    group: hq
  - id: sw-1
    type: switch
    group: hq
  - id: sw-2
    type: switch
    group: hq
  - id: prn-1
    type: printer
    group: hq
  - id: rt-2
    type: router
    group: osaka
links:
  - endpoints:
      - node: rt-1
        port: te1
      - node: sw-1
        port: te0/1
    speed: 10G
  - endpoints:
      - node: sw-1
        port: te0/47
      - node: sw-2
        port: te0/47
    speed: 10G
    connection: lag-1
  - endpoints:
      - node: sw-1
        port: te0/48
      - node: sw-2
        port: te0/48
    speed: 10G
    connection: lag-1
  - endpoints:
      - node: sw-2
        port: ge0/10
      - node: prn-1
    speed: 100M
    bandwidth: 100M
  - endpoints:
      - node: rt-1
        port: ge0
      - node: rt-2
        port: ge0
    speed: 1G
    bandwidth: 300M
  - endpoints:
      - node: rt-1
      - routingDomain: azure
    bandwidth: 2G
    connection: expressroute-1
    virtual: true
  - endpoints:
      - node: rt-2
      - node: rt-1
    connection: ipsec-backup
    virtual: true
connections:
  - id: lag-1
    label: LAG
  - id: expressroute-1
    label: ExpressRoute
  - id: ipsec-backup
    label: バックアップ IPsec トンネル
routingDomains:
  - id: azure
    label: Azure
