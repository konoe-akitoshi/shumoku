version: 2
updates:
  # The repo's only JS lockfile is bun.lock. The "npm" ecosystem cannot read or
  # update it, so npm-ecosystem PRs shipped a package.json bump with a stale
  # lockfile and every one of them failed CI on `bun install --frozen-lockfile`.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    # Undici 6 remains supported through 2027-04. Major upgrades raise the
    # public plugin SDK Node minimum and require a separate runtime migration.
    ignore:
      # TypeScript 7 removes the legacy compiler API. svelte2tsx emitDts rejects
      # it; svelte-check and TypeDoc support only TS 5/6 (#768).
      # Resume when the Svelte/TypeDoc migration checklist in #771 is satisfied.
      - dependency-name: "typescript"
        versions: ["7.x"]
      - dependency-name: "undici"
        # Public Node runtime migration and minimum-version CI: #773.
        update-types: ["version-update:semver-major"]
      # Nano ID 6 drops Node 18/20 in the public core package (#762).
      # Adopt it with the explicit library runtime-support migration in #773.
      - dependency-name: "nanoid"
        versions: ["6.x"]
      # js-yaml 5 changes default schemas, merge keys and empty-input handling,
      # as well as ESM exports (#765). Saved YAML compatibility checklist: #772.
      - dependency-name: "js-yaml"
        versions: ["5.x"]
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Future major Action updates require a coordinated CLI/workflow migration.
    ignore:
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]
