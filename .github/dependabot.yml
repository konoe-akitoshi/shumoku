version: 2
updates:
  # The repo's only JS lockfile is bun.lock. The "npm" ecosystem cannot read or
  # update it, so npm-ecosystem PRs shipped a package.json bump with a stale
  # lockfile and every one of them failed CI on `bun install --frozen-lockfile`.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    # Undici 6 remains supported through 2027-04. Major upgrades raise the
    # public plugin SDK Node minimum and require a separate runtime migration.
    ignore:
      # 1.6 changes route inference and requires an observation input-contract
      # migration; keep this separate from compatible Hono runtime updates.
      - dependency-name: "@hono/zod-openapi"
        versions: ["1.6.x"]
      - dependency-name: "undici"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Future major Action updates require a coordinated CLI/workflow migration.
    ignore:
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]
