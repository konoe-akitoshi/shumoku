name: Company network
description: On-premises server room and AWS Tokyo region
groups:
  - id: server-room
    label: On-premises server room
  - id: ap-northeast-1a
    label: AWS ap-northeast-1a
  - id: ap-northeast-1c
    label: AWS ap-northeast-1c

segments:
  - id: vlan-10
    label: VLAN 10
    vlan: 10
    prefix: 192.168.10.0/24
    addresses:
      fw-v:
        - 192.168.10.2
      app-1:
        - 192.168.10.20
  - id: sub-a
    label: sub-a
    prefix: 10.0.1.0/24
    group: ap-northeast-1a
    addresses:
      web-c:
        - 10.0.1.10
  - id: sub-c
    label: sub-c
    prefix: 10.0.2.0/24
    group: ap-northeast-1c
    addresses:
      db-c:
        - 10.0.2.20

redundancy:
  - id: prod
    label: prod
    nodes:
      - hv-1
      - hv-2

nodes:
  - id: rt-1
    label: rt-1
    type: router
    product: yamaha/rtx3510
    group: server-room
  - id: hv-1
    label: hv-1
    type: server
    product: dell/poweredge/r750
    software: VMware ESXi
    group: server-room
  - id: hv-2
    label: hv-2
    type: server
    product: dell/poweredge/r750
    software: VMware ESXi
    group: server-room
  - id: fw-v
    label: fw-v
    type: firewall
    product: palo-alto-networks/vm-series
    software: Palo Alto Networks VM-Series firewall software
    host: hv-1
  - id: app-1
    label: app-1
    type: virtual machine
    software: Ubuntu
    host: prod
  - id: main
    label: VPC main
    type: VPC
    prefix: 10.0.0.0/16
    group: ap-northeast-1
  - id: web-c
    label: web-c
    type: EC2 instance
    product: aws/ec2/t3.medium
    software: Amazon Linux
    host: main
  - id: db-c
    label: db-c
    type: database
    product: aws/rds/mysql
    host: main
  - id: igw-1
    label: igw-1
    type: internet gateway
    host: main
  - id: tgw-1
    label: tgw-1
    type: Transit Gateway
    product: aws/transit-gateway
  - id: vpn-1
    label: Site-to-Site VPN connection
    type: VPN
    host: tgw-1

links:
  - endpoints:
      - node: hv-1
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: hv-2
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: rt-1
      - node: vpn-1
    virtual: true
  - endpoints:
      - node: vpn-1
      - node: tgw-1
    virtual: true
    description: Two IPsec tunnels
  - endpoints:
      - node: tgw-1
      - node: sub-a
    virtual: true
  - endpoints:
      - node: tgw-1
      - node: sub-c
    virtual: true
