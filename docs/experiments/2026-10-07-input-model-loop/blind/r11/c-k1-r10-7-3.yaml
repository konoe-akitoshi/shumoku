name: Company network
description: On-premises server room and AWS in the Tokyo region

routingDomains:
  - id: guest
    label: guest
  - id: main
    label: main routing table
  - id: vpc-main
    label: VPC main
    prefix: 10.0.0.0/16

groups:
  - id: server-room
    label: Server room
  - id: prod
    label: prod cluster
  - id: tokyo
    label: AWS Tokyo region
    parent: aws
  - id: aws
    label: AWS
  - id: ap-northeast-1a
    label: ap-northeast-1a
    parent: tokyo
  - id: ap-northeast-1c
    label: ap-northeast-1c
    parent: tokyo

segments:
  - id: vlan-20
    label: VLAN 20
    vlan: 20
    prefix: 192.168.20.0/24
    routingDomain: guest
    group: server-room
    addresses:
      ap-1: 192.168.20.5
  - id: vlan-10
    label: VLAN 10
    vlan: 10
    prefix: 192.168.10.0/24
    routingDomain: main
    group: server-room
    addresses:
      fw-v: 192.168.10.2
      app-1: 192.168.10.20
  - id: sub-a
    label: sub-a
    prefix: 10.0.1.0/24
    routingDomain: vpc-main
    group: ap-northeast-1a
    addresses:
      web-c: 10.0.1.10
  - id: sub-c
    label: sub-c
    prefix: 10.0.2.0/24
    routingDomain: vpc-main
    group: ap-northeast-1c
    addresses:
      db-c: 10.0.2.20

connections:
  - id: vpn-1
    label: Site-to-Site VPN

redundancy:
  - id: prod
    label: prod cluster
    nodes:
      - hv-1
      - hv-2

nodes:
  - id: rt-1
    label: rt-1
    product: yamaha/rtx3510
    group: server-room
  - id: ap-1
    label: ap-1
    group: server-room
  - id: hv-1
    label: hv-1
    product: dell/poweredge/poweredge-r750
    software: VMware ESXi
    group: prod
  - id: hv-2
    label: hv-2
    product: dell/poweredge/poweredge-r750
    software: VMware ESXi
    group: prod
  - id: fw-v
    label: fw-v
    product: palo-alto-networks/vm-series
    software: Palo Alto Networks VM-Series
    host: hv-1
    group: prod
  - id: app-1
    label: app-1
    software: Ubuntu
    host: prod
    group: prod
  - id: igw-1
    label: igw-1
    routingDomain: vpc-main
    group: tokyo
  - id: tgw-1
    label: tgw-1
    routingDomain: vpc-main
    group: tokyo
  - id: web-c
    label: web-c
    type: EC2 instance
    product: amazon/ec2/t3.medium
    software: Amazon Linux
    routingDomain: vpc-main
    group: ap-northeast-1a
  - id: db-c
    label: db-c
    type: RDS MySQL database
    product: amazon/rds/mysql
    routingDomain: vpc-main
    group: ap-northeast-1c

links:
  - endpoints:
      - node: rt-1
        port: lan2
      - node: ap-1
    segments:
      - vlan-20
  - endpoints:
      - node: rt-1
      - node: hv-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: rt-1
      - node: hv-2
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: fw-v
      - segment: vlan-10
    virtual: true
  - endpoints:
      - node: app-1
      - segment: vlan-10
    virtual: true
  - endpoints:
      - node: igw-1
      - segment: sub-a
  - endpoints:
      - node: tgw-1
      - segment: sub-a
  - endpoints:
      - node: tgw-1
      - segment: sub-c
  - endpoints:
      - node: rt-1
      - node: tgw-1
    connection: vpn-1
    virtual: true
  - endpoints:
      - node: rt-1
      - node: tgw-1
    connection: vpn-1
    virtual: true
