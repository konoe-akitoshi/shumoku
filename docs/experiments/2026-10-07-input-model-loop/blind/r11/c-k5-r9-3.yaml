name: server-room
groups:
  - id: server-room
    label: Server room

segments:
  - id: vlan-10
    label: staff
    vlan: 10
    prefix: 192.168.1.0/24
    group: server-room
    addresses:
      web-1: 192.168.1.20
  - id: vlan-30
    label: database
    vlan: 30
    prefix: 192.168.3.0/24
    group: server-room

redundancy:
  - id: prod
    label: prod
    nodes:
      - esx-1
      - esx-2
      - esx-3

nodes:
  - id: core
    type: switch
    group: server-room
  - id: esx-1
    type: virtualization-host
    product: vmware/esxi
    group: server-room
  - id: esx-2
    type: virtualization-host
    product: vmware/esxi
    group: server-room
  - id: esx-3
    type: virtualization-host
    product: vmware/esxi
    group: server-room
  - id: web-1
    type: virtual-machine
    host: esx-1
    group: server-room
  - id: db-1
    type: virtual-machine
    host: prod
    group: server-room
  - id: mon-1
    type: virtual-machine
    address: 10.99.0.50

links:
  - endpoints:
      - node: core
      - node: esx-1
    speed: 25G
    segments:
      - vlan-10
      - vlan-30
  - endpoints:
      - node: core
      - node: esx-2
    speed: 25G
    segments:
      - vlan-10
      - vlan-30
  - endpoints:
      - node: core
      - node: esx-3
    speed: 25G
    segments:
      - vlan-10
      - vlan-30
  - endpoints:
      - node: web-1
      - segment: vlan-10
    virtual: true
  - endpoints:
      - node: db-1
      - segment: vlan-30
    virtual: true
