name: Office Building Network
description: Server room and 2nd floor network

groups:
  - id: server-room
    label: Server Room
  - id: floor-2
    label: 2nd Floor

segments:
  - id: vlan-10
    label: Users
    vlan: 10
    prefix: 10.10.0.0/24
    addresses:
      firewall: 10.10.0.1/24
  - id: vlan-99
    label: Management
    vlan: 99
    prefix: 10.99.0.0/24
    addresses:
      firewall: 10.99.0.1/24
      sw-2a: 10.99.0.3/24
      sw-2b: 10.99.0.4/24

nodes:
  - id: firewall
    label: Firewall
    vendor: Fortinet
    model: FortiGate-60F
    group: server-room
    description: Main firewall
  - id: core-switch
    label: Core Switch
    vendor: Cisco
    model: C9300
    group: server-room
    description: Stack of two units (core-1 and core-2)
    members:
      - label: core-1
      - label: core-2
  - id: sw-2a
    label: sw-2a
    group: floor-2
    address: 10.99.0.3/24
  - id: sw-2b
    label: sw-2b
    group: floor-2
    address: 10.99.0.4/24
  - id: wifi-ap
    label: Wi-Fi Access Point
    type: access-point
    group: floor-2
  - id: onu
    label: ONU (ISP)
    type: onu
    assumed: true
    description: ISP optical network unit

links:
  - endpoints:
      - node: firewall
        port: port1
      - node: core-switch
        port: Gi1/0/1
    speed: 10G
    segments: [vlan-10, vlan-99]
    description: Trunk to core
  - endpoints:
      - node: core-switch
        port: Gi1/0/2
      - node: sw-2a
        port: Gi0/1
    speed: 1G
    segments: [vlan-10, vlan-99]
    description: Access switch uplink
  - endpoints:
      - node: core-switch
      - node: sw-2b
    assumed: true
    segments: [vlan-10, vlan-99]
    description: Access switch uplink (ports unknown)
  - endpoints:
      - node: sw-2a
        port: Gi0/5
      - node: wifi-ap
    segments: [vlan-10]
    description: Wi-Fi AP uplink
  - endpoints:
      - node: firewall
        port: wan
      - node: onu
    assumed: true
    description: WAN connection to ISP
