name: ShowNet 2025 external network
description: >
  Internet-facing part of ShowNet 2025, AS290. Facts are from the public ShowNet 2025
  topology map and PeeringDB (2026-10).

routingDomains:
  - id: as290
    label: AS290

segments:
  - id: jpix
    label: JPIX
    prefix:
      - 210.171.224.0/23
      - 2001:de8:8::/64
    addresses:
      mx204:
        - 210.171.224.9
        - 2001:de8:8::20:82:1

  - id: dix-ie
    label: DIX-IE
    prefix:
      - 202.249.2.0/24
      - 2001:200:0:fe00::/64
    addresses:
      mx204:
        - 202.249.2.199
        - 2001:200:0:fe00::122:1

  - id: jpnap
    label: JPNAP
    prefix:
      - 210.173.176.0/23
      - 2001:7fa:7:1::/64
    addresses:
      ncs57c3:
        - 210.173.176.9
        - 2001:7fa:7:1::290:1

  - id: bbix-tokyo
    label: BBIX Tokyo
    prefix:
      - 101.203.88.0/22
      - 2001:de8:c::/64
    addresses:
      cisco8712:
        - 101.203.88.109
        - 2001:de8:c::290:1

nodes:
  - id: mx204
    type: router
    asn: 290
  - id: ncs57c3
    type: router
    asn: 290
  - id: cisco8712
    type: router
    asn: 290
  - id: kddi-cpe
    type: cpe
  - id: ncs5501se.kote
    type: switch
  - id: apn-cpe
    type: cpe
  - id: wxd
    type: optical device
  - id: wxt-1
    type: optical device
  - id: softbank-cpe
    type: cpe
  - id: ucxg-cpe
    type: cpe
  - id: kddi-internet-gateway
    label: KDDI Internet Gateway
    type: transit
  - id: ocn
    type: transit
  - id: softbank-smartinternet
    label: SmartInternet
    type: transit
  - id: iown-open-apn
    label: IOWN Open APN
    type: optical network
  - id: jpix-ix
    label: JPIX
    type: internet exchange
  - id: dix-ie-ix
    label: DIX-IE
    type: internet exchange
  - id: jpnap-ix
    label: JPNAP
    type: internet exchange
  - id: bbix-tokyo-ix
    label: BBIX Tokyo
    type: internet exchange
  - id: bbix-singapore
    label: BBIX Singapore
    type: internet exchange
  - id: bbix-hong-kong
    label: BBIX Hong Kong
    type: internet exchange
  - id: jcix
    label: JCIX
    type: internet exchange
  - id: enternet-ix
    label: ENTERNET IX
    type: internet exchange
  - id: ipa
    label: IPA
    type: internet exchange
  - id: jpnap-route-server
    label: JPNAP route server
    type: route server
  - id: bbix-tokyo-route-server
    label: BBIX Tokyo route server
    type: route server
  - id: dix-ie-route-server
    label: DIX-IE route server
    type: route server
  - id: other-jpix-peers
    label: Other ASes on JPIX (34 peers)
    type: peer group
  - id: other-jpnap-peers
    label: Other ASes on JPNAP (34 peers)
    type: peer group
  - id: other-bbix-tokyo-peers
    label: Other ASes on BBIX Tokyo (34 peers)
    type: peer group

links:
  - endpoints:
      - node: mx204
        port: 0-0-0
      - node: kddi-cpe
    segments: []
  - endpoints:
      - node: kddi-cpe
      - node: ncs5501se.kote
        port: 0-0-1-3
    description: Behind kddi-cpe; connection to ncs5501se.kote port 0-0-1-3
  - endpoints:
      - node: kddi-cpe
      - node: ncs5501se.kote
        port: 0-0-1-3

  - endpoints:
      - node: ncs5501se.kote
        port: 0-0-1-0
      - node: kddi-internet-gateway
    description: KDDI transit
  - endpoints:
      - node: ncs5501se.kote
        port: 0-0-1-1
      - segment: jpix
  - endpoints:
      - node: ncs5501se.kote
        port: 0-0-1-2
      - segment: dix-ie

  - endpoints:
      - node: ncs57c3
        port: 0-0-0-24
      - node: apn-cpe
    description: OCN transit comes through apn-cpe
  - endpoints:
      - node: apn-cpe
      - node: ocn
    description: OCN transit

  - endpoints:
      - node: ncs57c3
      - node: wxd
  - endpoints:
      - node: ncs57c3
      - node: wxt-1
  - endpoints:
      - node: wxd
      - node: iown-open-apn
  - endpoints:
      - node: wxt-1
      - node: iown-open-apn
  - endpoints:
      - segment: jpnap
      - node: iown-open-apn
    description: IOWN Open APN carries the JPNAP connection; wavelength not known

  - endpoints:
      - node: cisco8712
        port: 0-2-0-0
      - node: softbank-cpe
  - endpoints:
      - node: softbank-cpe
      - segment: bbix-tokyo
  - endpoints:
      - node: softbank-cpe
      - node: bbix-singapore
  - endpoints:
      - node: softbank-cpe
      - node: bbix-hong-kong
  - endpoints:
      - node: softbank-cpe
      - node: softbank-smartinternet
    description: SoftBank transit

  - endpoints:
      - node: cisco8712
        port: 0-1-0-0
      - node: ucxg-cpe
  - endpoints:
      - node: cisco8712
        port: 0-1-0-1
      - node: ucxg-cpe
  - endpoints:
      - node: ucxg-cpe
      - node: jcix
  - endpoints:
      - node: ucxg-cpe
      - node: enternet-ix
  - endpoints:
      - node: ucxg-cpe
      - node: ipa

  - endpoints:
      - node: mx204
      - segment: jpix
  - endpoints:
      - node: mx204
      - segment: dix-ie
  - endpoints:
      - node: ncs57c3
      - segment: jpnap
  - endpoints:
      - node: cisco8712
      - segment: bbix-tokyo

  - endpoints:
      - node: mx204
      - node: other-jpix-peers
    segments: [jpix]
    virtual: true
  - endpoints:
      - node: ncs57c3
      - node: other-jpnap-peers
    segments: [jpnap]
    virtual: true
  - endpoints:
      - node: cisco8712
      - node: other-bbix-tokyo-peers
    segments: [bbix-tokyo]
    virtual: true

  - endpoints:
      - node: ncs57c3
      - node: jpnap-route-server
    segments: [jpnap]
    virtual: true
  - endpoints:
      - node: cisco8712
      - node: bbix-tokyo-route-server
    segments: [bbix-tokyo]
    virtual: true
  - endpoints:
      - node: mx204
      - node: dix-ie-route-server
    segments: [dix-ie]
    virtual: true
