name: 本社とAWS東京VPC main
groups:
  - id: headquarters
    label: 本社
  - id: server-room
    label: サーバ室
    parent: headquarters
  - id: aws-tokyo
    label: AWS 東京
  - id: vpc-main
    label: VPC main
    parent: aws-tokyo
  - id: subnet-a
    label: サブネット sub-a
    parent: vpc-main
routingDomains:
  - id: guest
    label: guest
segments:
  - id: vlan-10
    label: VLAN 10（業務）
    vlan: 10
    prefix: 192.168.10.0/24
    group: server-room
    addresses:
      web-1: 192.168.10.20
  - id: vlan-20
    label: VLAN 20（来客）
    vlan: 20
    routingDomain: guest
    group: server-room
  - id: vpc-main-segment
    label: VPC main
    prefix: 10.0.0.0/16
    group: vpc-main
  - id: subnet-a-segment
    label: サブネット sub-a（ap-northeast-1a）
    prefix: 10.0.1.0/24
    group: subnet-a
nodes:
  - id: rt-1
    label: rt-1
    type: router
    product: Yamaha/RTX3510
    group: server-room
  - id: sw-1
    label: sw-1
    type: switch
    product: "?/SWX2322P-16MT"
    group: server-room
  - id: hv-1
    label: hv-1
    type: virtualization-host
    product: Dell/PowerEdge R750
    software: VMware ESXi
    group: server-room
  - id: web-1
    label: web-1
    type: virtual-machine
    host: hv-1
    group: server-room
  - id: igw-1
    label: igw-1
    type: internet-gateway
    group: vpc-main
  - id: vgw-1
    label: vgw-1
    type: virtual-private-gateway
    group: vpc-main
connections:
  - id: site-to-site-vpn
    label: IPsec Site-to-Site VPN
redundancy:
  - id: vpn-tunnels
    label: VPN トンネル
    nodes: [rt-1, vgw-1]
    pairingUnconfirmed: true
links:
  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: port 1
    speed: 1G
    cable: Cat6
    length: 3m
    segments: [vlan-10, vlan-20]
  - endpoints:
      - node: sw-1
      - node: hv-1
    speed: 10G
  - endpoints:
      - node: hv-1
      - node: web-1
    virtual: true
    segments: [vlan-10]
  - endpoints:
      - node: igw-1
      - node: vgw-1
    virtual: true
  - endpoints:
      - node: rt-1
      - node: vgw-1
    virtual: true
    connection: site-to-site-vpn
