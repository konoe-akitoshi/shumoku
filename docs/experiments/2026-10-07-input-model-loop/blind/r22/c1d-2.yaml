groups:
  - id: hq
    label: 本社
  - id: server-room
    label: サーバ室
    parent: hq

routingDomains:
  - id: guest
    label: guest
  - id: main
    label: AWS 東京 VPC main
    prefix: 10.0.0.0/16

connections:
  - id: site-to-site-vpn
    label: IPsec Site-to-Site VPN

segments:
  - id: vlan-10
    label: 業務
    vlan: 10
    prefix: 192.168.10.0/24
  - id: vlan-20
    label: 来客
    vlan: 20
    routingDomain: guest
  - id: sub-a
    label: sub-a
    prefix: 10.0.1.0/24
    routingDomain: main
    group: ap-northeast-1a

nodes:
  - id: rt-1
    label: rt-1
    type: router
    product: Yamaha/RTX3510
    group: server-room
  - id: sw-1
    label: sw-1
    type: switch
    product: ?/SWX2322P-16MT
    group: server-room
  - id: hv-1
    label: hv-1
    type: server
    product: Dell/PowerEdge R750
    software: VMware ESXi
    group: server-room
  - id: web-1
    label: web-1
    type: VM
    host: hv-1
    group: server-room
  - id: igw-1
    label: igw-1
    type: internet gateway
    group: ap-northeast-1
  - id: vgw-1
    label: vgw-1
    type: virtual private gateway
    group: main

links:
  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: port 1
    speed: 1G
    cable: Cat6
    length: 3m
    segments:
      - vlan-10
      - vlan-20
  - endpoints:
      - node: sw-1
      - node: hv-1
    speed: 10G
  - virtual: true
    endpoints:
      - node: web-1
      - segment: vlan-10
    segments:
      - vlan-10
    description: VLAN 10 ポートグループのアダプタ
  - virtual: true
    connection: site-to-site-vpn
    endpoints:
      - node: rt-1
      - node: vgw-1
    description: IPsec Site-to-Site VPN トンネル 1
  - virtual: true
    connection: site-to-site-vpn
    endpoints:
      - node: rt-1
      - node: vgw-1
    description: IPsec Site-to-Site VPN トンネル 2
  - virtual: true
    endpoints:
      - node: igw-1
      - routingDomain: main
    description: VPC へのインターネットゲートウェイ接続

redundancy: []
