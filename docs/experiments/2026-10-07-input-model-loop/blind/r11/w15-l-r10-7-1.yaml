name: Server room and AWS Tokyo

routingDomains:
  - id: guest
  - id: vpc-main
    label: VPC main
    prefix: 10.0.0.0/16

groups:
  - id: server-room
    label: On-premises server room
  - id: ap-northeast-1a
    label: ap-northeast-1a
  - id: ap-northeast-1c
    label: ap-northeast-1c

segments:
  - id: vlan-20
    label: VLAN 20
    vlan: 20
    prefix: 192.168.20.0/24
    routingDomain: guest
    group: server-room
    addresses:
      ap-1: 192.168.20.5
  - id: vlan-10
    label: VLAN 10
    vlan: 10
    prefix: 192.168.10.0/24
    group: server-room
    addresses:
      fw-v: 192.168.10.2
      app-1: 192.168.10.20
  - id: sub-a
    label: sub-a
    prefix: 10.0.1.0/24
    routingDomain: vpc-main
    group: ap-northeast-1a
    addresses:
      web-c: 10.0.1.10
  - id: sub-c
    label: sub-c
    prefix: 10.0.2.0/24
    routingDomain: vpc-main
    group: ap-northeast-1c
    addresses:
      db-c: 10.0.2.20

redundancy:
  - id: prod
    label: prod
    nodes: [hv-1, hv-2]

connections:
  - id: vpn-rt-1-tgw-1
    label: Site-to-Site VPN

nodes:
  - id: rt-1
    label: rt-1
    product: yamaha/rtx3510
    group: server-room
  - id: ap-1
    label: ap-1
    group: server-room
  - id: hv-1
    label: hv-1
    product: dell/poweredge-r750
    software: vmware/esxi
    group: server-room
  - id: hv-2
    label: hv-2
    product: dell/poweredge-r750
    software: vmware/esxi
    group: server-room
  - id: fw-v
    label: fw-v
    product: palo-alto-networks/vm-series
    host: hv-1
    group: server-room
  - id: app-1
    label: app-1
    software: ubuntu
    host: prod
    group: server-room
  - id: web-c
    label: web-c
    type: EC2 t3.medium
    software: Amazon Linux
    group: ap-northeast-1a
  - id: db-c
    label: db-c
    type: Amazon RDS for MySQL
    group: ap-northeast-1c
  - id: igw-1
    label: igw-1
    type: internet gateway
    routingDomain: vpc-main
  - id: tgw-1
    label: tgw-1
    type: Transit Gateway
    routingDomain: vpc-main
  - id: vpn-1
    label: VPN tunnel 1
    type: IPsec tunnel
    virtual: true
  - id: vpn-2
    label: VPN tunnel 2
    type: IPsec tunnel
    virtual: true

links:
  - endpoints:
      - node: rt-1
        port: lan2
      - segment: vlan-20
  - endpoints:
      - node: rt-1
      - node: hv-1
    speed: 10G
    segments: [vlan-10]
  - endpoints:
      - node: rt-1
      - node: hv-2
    speed: 10G
    segments: [vlan-10]
  - endpoints:
      - node: hv-1
      - segment: vlan-10
    virtual: true
    description: fw-v adapter in the VLAN 10 port group
  - endpoints:
      - node: prod
      - segment: vlan-10
    virtual: true
    description: app-1 adapter in the VLAN 10 port group; host within prod cluster unknown
  - endpoints:
      - node: web-c
      - segment: sub-a
  - endpoints:
      - node: db-c
      - segment: sub-c
  - endpoints:
      - node: igw-1
      - segment: vpc-main
    virtual: true
  - endpoints:
      - node: tgw-1
      - segment: sub-a
    virtual: true
  - endpoints:
      - node: tgw-1
      - segment: sub-c
    virtual: true
  - endpoints:
      - node: rt-1
      - node: vpn-1
    connection: vpn-rt-1-tgw-1
    virtual: true
  - endpoints:
      - node: vpn-1
      - node: tgw-1
    connection: vpn-rt-1-tgw-1
    virtual: true
  - endpoints:
      - node: rt-1
      - node: vpn-2
    connection: vpn-rt-1-tgw-1
    virtual: true
  - endpoints:
      - node: vpn-2
      - node: tgw-1
    connection: vpn-rt-1-tgw-1
    virtual: true
