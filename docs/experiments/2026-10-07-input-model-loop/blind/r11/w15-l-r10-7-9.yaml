groups:
  - id: server-room
    label: On-premises server room
  - id: tokyo
    label: AWS Tokyo region
  - id: ap-northeast-1a
    parent: tokyo
  - id: ap-northeast-1c
    parent: tokyo

routingDomains:
  - id: guest
    label: guest
  - id: main
    label: VPC main
    prefix: 10.0.0.0/16

connections:
  - id: rt-1-tgw-1-vpn
    label: Site-to-Site VPN

segments:
  - id: vlan-20
    vlan: 20
    prefix: 192.168.20.0/24
    routingDomain: guest
    addresses:
      ap-1: 192.168.20.5
  - id: vlan-10
    vlan: 10
    prefix: 192.168.10.0/24
    addresses:
      fw-v: 192.168.10.2
      app-1: 192.168.10.20
  - id: sub-a
    prefix: 10.0.1.0/24
    routingDomain: main
    group: ap-northeast-1a
    addresses:
      web-c: 10.0.1.10
  - id: sub-c
    prefix: 10.0.2.0/24
    routingDomain: main
    group: ap-northeast-1c
    addresses:
      db-c: 10.0.2.20

redundancy:
  - id: prod
    label: vSphere HA cluster prod
    nodes:
      - hv-1
      - hv-2

nodes:
  - id: rt-1
    type: router
    product: yamaha/rtx3510
    group: server-room
  - id: ap-1
    type: access-point
    group: server-room
  - id: hv-1
    type: server
    product: dell/poweredge/r750
    software: VMware ESXi
    group: server-room
  - id: hv-2
    type: server
    product: dell/poweredge/r750
    software: VMware ESXi
    group: server-room
  - id: fw-v
    type: firewall
    product: palo-alto-networks/vm-series
    host: hv-1
    group: server-room
  - id: app-1
    type: virtual-machine
    software: Ubuntu
    host: prod
    group: server-room
  - id: web-c
    type: virtual-machine
    product: aws/ec2/t3.medium
    software: Amazon Linux
    group: ap-northeast-1a
  - id: db-c
    type: database
    product: aws/rds/mysql
    group: ap-northeast-1c
  - id: igw-1
    type: internet-gateway
    product: aws/internet-gateway
    routingDomain: main
    group: tokyo
  - id: tgw-1
    type: transit-gateway
    product: aws/transit-gateway
    group: tokyo

links:
  - endpoints:
      - node: ap-1
      - node: rt-1
        port: lan2
    segments:
      - vlan-20
  - endpoints:
      - node: hv-1
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: hv-2
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: fw-v
      - segment: vlan-10
    segments:
      - vlan-10
    virtual: true
  - endpoints:
      - node: app-1
      - segment: vlan-10
    segments:
      - vlan-10
    virtual: true
  - endpoints:
      - node: tgw-1
      - segment: sub-a
    segments:
      - sub-a
    virtual: true
  - endpoints:
      - node: tgw-1
      - segment: sub-c
    segments:
      - sub-c
    virtual: true
  - endpoints:
      - node: rt-1
      - node: tgw-1
    connection: rt-1-tgw-1-vpn
    description: IPsec tunnel
    virtual: true
  - endpoints:
      - node: rt-1
      - node: tgw-1
    connection: rt-1-tgw-1-vpn
    description: IPsec tunnel
    virtual: true
