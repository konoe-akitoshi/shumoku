segments:
  - { id: staff, vlan: 10, prefix: 192.168.1.0/24, addresses: { web-1: 192.168.1.20 } }
  - { id: database, vlan: 30, prefix: 192.168.3.0/24, addresses: { db-1: [] } }
redundancy:
  - { id: prod, nodes: [esx-1, esx-2, esx-3] }
nodes:
  - { id: core }
  - { id: esx-1, type: server }
  - { id: esx-2, type: server }
  - { id: esx-3, type: server }
  - { id: web-1, type: server, host: esx-1 }
  - { id: db-1, type: server, host: prod }
  - { id: mon-1, type: server, address: 10.99.0.50 }
links:
  - { endpoints: [{ node: core }, { node: esx-1 }], speed: 25G, segments: [staff, database] }
  - { endpoints: [{ node: core }, { node: esx-2 }], speed: 25G, segments: [staff, database] }
  - { endpoints: [{ node: core }, { node: esx-3 }], speed: 25G, segments: [staff, database] }
