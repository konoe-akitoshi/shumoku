name: Company network
routingDomains:
  - id: guest
    label: Guest VRF
  - id: main
    label: VPC main
    prefix: 10.0.0.0/16
groups:
  - id: server-room
    label: Server room
  - id: ap-northeast-1
    label: AWS Tokyo region
  - id: ap-northeast-1a
    label: ap-northeast-1a
    parent: ap-northeast-1
  - id: ap-northeast-1c
    label: ap-northeast-1c
    parent: ap-northeast-1
segments:
  - id: vlan-20
    label: VLAN 20
    vlan: 20
    prefix: 192.168.20.0/24
    routingDomain: guest
    addresses:
      ap-1: 192.168.20.5
  - id: vlan-10
    label: VLAN 10
    vlan: 10
    prefix: 192.168.10.0/24
    addresses:
      fw-v: 192.168.10.2
      app-1: 192.168.10.20
  - id: sub-a
    label: sub-a
    prefix: 10.0.1.0/24
    routingDomain: main
    group: ap-northeast-1a
    addresses:
      web-c: 10.0.1.10
  - id: sub-c
    label: sub-c
    prefix: 10.0.2.0/24
    routingDomain: main
    group: ap-northeast-1c
    addresses:
      db-c: 10.0.2.20
redundancy:
  - id: prod
    label: vSphere HA cluster prod
    nodes:
      - hv-1
      - hv-2
nodes:
  - id: rt-1
    type: router
    product: yamaha/rtx3510
    group: server-room
  - id: ap-1
    type: access-point
    group: server-room
    segments:
      - vlan-20
  - id: hv-1
    type: server
    product: dell/poweredge/r750
    software: VMware ESXi
    group: server-room
  - id: hv-2
    type: server
    product: dell/poweredge/r750
    software: VMware ESXi
    group: server-room
  - id: fw-v
    type: firewall
    product: palo-alto-networks/vm-series
    host: hv-1
    group: server-room
    segments:
      - vlan-10
  - id: app-1
    type: server
    software: Ubuntu
    host: prod
    segments:
      - vlan-10
  - id: web-c
    type: ec2-instance
    product: aws/ec2/t3.medium
    software: Amazon Linux
    routingDomain: main
    group: ap-northeast-1a
    segments:
      - sub-a
  - id: db-c
    type: database
    product: aws/rds/mysql
    routingDomain: main
    group: ap-northeast-1c
    segments:
      - sub-c
  - id: igw-1
    type: internet-gateway
    routingDomain: main
  - id: tgw-1
    type: transit-gateway
    routingDomain: main
connections:
  - id: vpn-1
    label: Site-to-Site VPN
links:
  - endpoints:
      - node: rt-1
        port: lan2
      - node: ap-1
    segments:
      - vlan-20
  - endpoints:
      - node: hv-1
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: hv-2
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: igw-1
      - node: main
  - endpoints:
      - node: tgw-1
      - node: sub-a
  - endpoints:
      - node: tgw-1
      - node: sub-c
  - endpoints:
      - node: rt-1
      - node: tgw-1
    connection: vpn-1
    assumed: true
    virtual: true
  - endpoints:
      - node: rt-1
      - node: tgw-1
    connection: vpn-1
    assumed: true
    virtual: true
