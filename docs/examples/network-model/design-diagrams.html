<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Shumoku ネットワークモデルの設計図</title>
    <style>
      :root {
        font-family: "Segoe UI", Meiryo, sans-serif;
        color: #18232e;
        background: #f4f6f8;
        font-size: 15px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      header {
        padding: 20px 28px 12px;
        background: white;
        border-bottom: 1px solid #d6dfe6;
      }
      h1 {
        font-size: 23px;
        margin: 0 0 8px;
      }
      p {
        line-height: 1.65;
        margin: 4px 0;
      }
      .status {
        color: #526474;
        font-size: 13px;
      }
      nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        padding: 14px 28px 8px;
      }
      button {
        font: inherit;
        border: 1px solid #b9c7d2;
        border-radius: 6px;
        background: white;
        padding: 8px 13px;
        cursor: pointer;
        color: #263d4d;
      }
      button:hover {
        background: #e7eff5;
      }
      button[aria-pressed="true"] {
        background: #225474;
        color: white;
        border-color: #225474;
      }
      .toolbar {
        padding: 6px 28px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      h2 {
        font-size: 17px;
        margin: 0 auto 0 0;
      }
      output {
        font-variant-numeric: tabular-nums;
        min-width: 48px;
        text-align: center;
      }
      .viewport {
        margin: 0 28px;
        max-width: calc(100vw - 56px);
        height: calc(100vh - 264px);
        min-height: 360px;
        overflow: auto;
        padding: 24px;
        background: white;
        border: 1px solid #cad5dd;
        border-radius: 7px;
      }
      .viewport:focus {
        outline: 2px solid #225474;
      }
      img {
        display: block;
        max-width: none;
        height: auto;
      }
      footer {
        padding: 12px 28px;
        font-size: 13px;
        color: #526474;
      }
      a {
        color: #225474;
      }
      @media (max-width: 700px) {
        header,
        nav,
        .toolbar,
        footer {
          padding-left: 14px;
          padding-right: 14px;
        }
        .viewport {
          margin: 0 14px;
          max-width: calc(100vw - 28px);
        }
        h1 {
          font-size: 19px;
        }
      }
      @media print {
        nav,
        .toolbar button,
        .toolbar output {
          display: none;
        }
        .viewport {
          height: auto;
          overflow: visible;
          border: 0;
          padding: 0;
          margin: 0;
          max-width: 100%;
        }
        img {
          width: 100%;
        }
        header,
        footer {
          padding: 8px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Shumoku 構成データの設計図</h1>
      <p>
        初期コアと候補方式を確認する論理設計案。採用理由と範囲外の例は
        <a href="../../network-model-concept-review.ja.md">概念選定レビュー</a>を参照。
      </p>
      <p class="status">
        2026-10-06 · 実装での適合は未検証。制約と変更例は
        <a href="../../network-model-design.ja.md">設計文書</a>で確認できます。
      </p>
    </header>
    <nav aria-label="設計図を選択"></nav>
    <div class="toolbar">
      <h2 id="diagram-title">基本構造の ER 図</h2>
      <button type="button" id="fit">全体表示</button><button type="button" id="actual">原寸</button
      ><button type="button" id="smaller" aria-label="縮小">−</button><output id="zoom"></output
      ><button type="button" id="larger" aria-label="拡大">＋</button>
    </div>
    <section class="viewport" id="viewport" aria-label="設計図。拡大時はスクロールできます">
      <img id="diagram" alt="基本構造の ER 図">
    </section>
    <footer>
      初期表示は文字を読める大きさにしています。スクロールで移動し、全体表示で関係を確認できます。図は
      Mermaid 12.1.0 で描画した SVG。閲覧時の外部通信は不要です。
    </footer>
    <script>
      const diagrams = [
        {
          title: '基本構造の ER 図',
          src: 'diagrams/design-1.svg',
          width: 1256.103515625,
          height: 1157.953125,
        },
        {
          title: '表示と拡張の参照図',
          src: 'diagrams/design-2.svg',
          width: 1394.9921875,
          height: 772.25,
        },
        {
          title: '編集と情報源のデータフロー',
          src: 'diagrams/design-3.svg',
          width: 804.67578125,
          height: 928,
        },
        {
          title: 'ポート削除のシーケンス図',
          src: 'diagrams/design-4.svg',
          width: 1425,
          height: 1076,
        },
        {
          title: 'source 更新のシーケンス図',
          src: 'diagrams/design-5.svg',
          width: 1841,
          height: 905,
        },
        {
          title: '構成から表示範囲を作るフロー',
          src: 'diagrams/design-6.svg',
          width: 577.78125,
          height: 691.859375,
        },
      ]
      const nav = document.querySelector('nav')
      const image = document.querySelector('#diagram')
      const viewport = document.querySelector('#viewport')
      // A scrollable diagram region must be reachable by keyboard users.
      viewport.tabIndex = 0
      const title = document.querySelector('#diagram-title')
      const output = document.querySelector('#zoom')
      let selected = 0
      let scale = 1
      const shortTitles = [
        '基本構造 ER',
        '表示と拡張',
        '編集と情報源',
        'ポート削除',
        'source 更新',
        '表示範囲の変換',
      ]
      function resize(next) {
        scale = Math.max(0.2, Math.min(2.5, next))
        image.style.width = `${Math.round(diagrams[selected].width * scale)}px`
        output.textContent = `${Math.round(scale * 100)}%`
      }
      function fitDiagram() {
        const diagram = diagrams[selected]
        resize(
          Math.min(
            1,
            (viewport.clientWidth - 48) / diagram.width,
            (viewport.clientHeight - 48) / diagram.height,
          ),
        )
      }
      function show(index) {
        selected = index
        image.src = diagrams[index].src
        image.alt = diagrams[index].title
        title.textContent = diagrams[index].title
        for (const [buttonIndex, button] of [...nav.querySelectorAll('button')].entries()) {
          button.setAttribute('aria-pressed', String(buttonIndex === index))
        }
        fitDiagram()
        resize(Math.max(scale, 0.65))
        viewport.scrollTop = 0
        viewport.scrollLeft = Math.max(
          0,
          (diagrams[index].width * scale - viewport.clientWidth + 48) / 2,
        )
      }
      for (const [index, diagram] of diagrams.entries()) {
        const button = document.createElement('button')
        button.type = 'button'
        button.textContent = `${index + 1}. ${shortTitles[index]}`
        button.title = diagram.title
        button.addEventListener('click', () => show(index))
        nav.appendChild(button)
      }
      document.querySelector('#fit').addEventListener('click', fitDiagram)
      document.querySelector('#actual').addEventListener('click', () => resize(1))
      document.querySelector('#smaller').addEventListener('click', () => resize(scale / 1.25))
      document.querySelector('#larger').addEventListener('click', () => resize(scale * 1.25))
      window.addEventListener('beforeprint', () => {
        image.style.width = '100%'
      })
      window.addEventListener('afterprint', () => resize(scale))
      show(0)
    </script>
  </body>
</html>
