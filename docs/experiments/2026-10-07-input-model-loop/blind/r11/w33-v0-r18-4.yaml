name: ShowNet 2025 external network

routingDomains:
  - id: as290
    label: AS290

segments:
  - id: jpix
    label: JPIX peering LAN
    prefix:
      - 210.171.224.0/23
      - 2001:de8:8::/64
    addresses:
      mx204:
        - 210.171.224.9
        - 2001:de8:8::20:82:1

  - id: dix-ie
    label: DIX-IE peering LAN
    prefix:
      - 202.249.2.0/24
      - 2001:200:0:fe00::/64
    addresses:
      mx204:
        - 202.249.2.199
        - 2001:200:0:fe00::122:1

  - id: jpnap
    label: JPNAP peering LAN
    prefix:
      - 210.173.176.0/23
      - 2001:7fa:7:1::/64
    addresses:
      ncs57c3:
        - 210.173.176.9
        - 2001:7fa:7:1::290:1

  - id: bbix-tokyo
    label: BBIX Tokyo peering LAN
    prefix:
      - 101.203.88.0/22
      - 2001:de8:c::/64
    addresses:
      cisco8712:
        - 101.203.88.109
        - 2001:de8:c::290:1

nodes:
  - id: mx204
    product: juniper/mx204
    asn: 290
  - id: ncs57c3
    product: cisco/ncs-57c3
    asn: 290
  - id: cisco8712
    product: cisco/8712
    asn: 290
  - id: kddi-cpe
  - id: ncs5501se.kote
  - id: apn-cpe
  - id: wxd
  - id: wxt-1
  - id: softbank-cpe
  - id: ucxg-cpe
  - id: kddi-internet-gateway
    label: KDDI Internet Gateway
  - id: ocn
    label: OCN
  - id: jpix-route-server
    label: JPIX route server
  - id: dix-ie-route-server
    label: DIX-IE route server
  - id: jpnap-route-server
    label: JPNAP route server
  - id: bbix-tokyo-route-server
    label: BBIX Tokyo route server

links:
  - endpoints:
      - node: mx204
        port: 0-0-0
      - node: kddi-cpe

  - endpoints:
      - node: kddi-cpe
      - node: ncs5501se.kote
        port: 0-0-1-3

  - endpoints:
      - node: ncs5501se.kote
        port: 0-0-1-0
      - node: kddi-internet-gateway
    description: KDDI transit

  - endpoints:
      - node: ncs5501se.kote
        port: 0-0-1-1
      - segment: jpix

  - endpoints:
      - node: ncs5501se.kote
        port: 0-0-1-2
      - segment: dix-ie

  - endpoints:
      - node: ncs57c3
        port: 0-0-0-24
      - node: apn-cpe
    description: OCN transit

  - endpoints:
      - node: ncs57c3
      - node: wxd
    description: IOWN Open APN optical network

  - endpoints:
      - node: ncs57c3
      - node: wxt-1
    description: IOWN Open APN optical network

  - endpoints:
      - node: wxd
      - node: wxt-1
    description: IOWN Open APN optical network

  - endpoints:
      - node: softbank-cpe
      - node: cisco8712
        port: 0-2-0-0
    description: BBIX Tokyo, BBIX Singapore, BBIX Hong Kong and SmartInternet (SoftBank transit)

  - endpoints:
      - node: ucxg-cpe
      - node: cisco8712
        port: 0-1-0-0

  - endpoints:
      - node: ucxg-cpe
      - node: cisco8712
        port: 0-1-0-1
