# Full Featured Example
# Demonstrates all available options and features
name: Full Featured Network
description: Comprehensive example showcasing all Shumoku features
groups:
  - id: site-datacenter
    label: Tokyo Data Center
    groups: [{id: cluster-vmware, label: VMware Cluster}]
  - id: site-dr
    label: Osaka DR Site
  - id: site-office
    label: Head Office
segments:
  - id: vlan-100
    vlan: 100
  - id: vlan-200
    vlan: 200
  - id: vlan-300
    vlan: 300
  - id: vlan-10
    vlan: 10
  - id: vlan-20
    vlan: 20
redundancy:
  - id: core-rt-01-core-rt-02
    nodes: [core-rt-01, core-rt-02]
  - id: core-sw-01-core-sw-02
    nodes: [core-sw-01, core-sw-02]
nodes:
  - id: core-rt-01
    label: core-rt-01
    type: router
    product: yamaha/rtx3510
    group: site-datacenter
    address: 10.0.0.1
    description: 'Status: Active'
  - id: core-rt-02
    label: core-rt-02
    type: router
    product: yamaha/rtx3510
    group: site-datacenter
    address: 10.0.0.2
    description: 'Status: Active'
  - id: core-sw-01
    label: core-sw-01
    type: l3-switch
    product: juniper/qfx5120
    group: site-datacenter
    address: 10.0.1.1
  - id: core-sw-02
    label: core-sw-02
    type: l3-switch
    product: juniper/qfx5120
    group: site-datacenter
    address: 10.0.1.2
  - id: access-sw-01
    label: access-sw-01
    type: l2-switch
    product: juniper/ex2300
    group: site-datacenter
    address: 10.0.2.1
  - id: access-sw-02
    label: access-sw-02
    type: l2-switch
    product: juniper/ex2300
    group: site-datacenter
    address: 10.0.2.2
  - id: esxi-01
    label: esxi-01
    type: server
    group: cluster-vmware
    address: 10.0.10.1
    description: VMware ESXi 8.0
  - id: esxi-02
    label: esxi-02
    type: server
    group: cluster-vmware
    address: 10.0.10.2
    description: VMware ESXi 8.0
  - id: vm-web-01
    label: vm-web-01
    type: server
    group: cluster-vmware
    address: 10.0.20.10
    description: 4vCPU / 16GB
  - id: vm-db-01
    label: vm-db-01
    type: server
    group: cluster-vmware
    address: 10.0.20.20
    description: 8vCPU / 32GB
  - id: fw-01
    label: fw-01 (Active)
    type: firewall
    product: juniper/srx4100
    group: site-datacenter
    address: 10.0.100.1
  - id: new-sw-01
    label: new-sw-01
    type: l2-switch
    group: site-datacenter
    description: (Planned Q2)
  - id: failed-ap-01
    label: failed-ap-01
    type: access-point
    group: site-datacenter
    description: OFFLINE
  - id: dr-rt-01
    label: dr-rt-01
    type: router
    product: yamaha/rtx1300
    group: site-dr
    address: 10.1.0.1
  - id: dr-sw-01
    label: dr-sw-01
    type: l3-switch
    group: site-dr
    address: 10.1.1.1
  - id: dr-storage-01
    label: dr-storage-01
    type: server
    group: site-dr
    address: 10.1.10.1
    description: Backup Storage
  - id: office-rt-01
    label: office-rt-01
    type: router
    group: site-office
    address: 10.2.0.1
  - id: office-sw-01
    label: office-sw-01
    type: l2-switch
    product: yamaha/swx2310
    group: site-office
    address: 10.2.1.1
  - id: office-ap-01
    label: office-ap-01
    type: access-point
    product: aruba/ap-505
    group: site-office
  - id: office-ap-02
    label: office-ap-02
    type: access-point
    product: aruba/ap-505
    group: site-office
links:
  - endpoints: [{node: core-rt-01, port: xe-0/0/0}, {node: core-rt-02, port: xe-0/0/0}]
    speed: 100G
  - endpoints: [{node: core-rt-01, port: xe-0/0/1}, {node: core-sw-01, port: xe-0/0/0}]
    segments: [vlan-100, vlan-200, vlan-300]
    speed: 40G
  - endpoints: [{node: core-rt-01, port: xe-0/0/2}, {node: core-sw-02, port: xe-0/0/0}]
    segments: [vlan-100, vlan-200, vlan-300]
    speed: 40G
  - endpoints: [{node: core-rt-02, port: xe-0/0/1}, {node: core-sw-01, port: xe-0/0/1}]
    segments: [vlan-100, vlan-200, vlan-300]
    speed: 40G
  - endpoints: [{node: core-rt-02, port: xe-0/0/2}, {node: core-sw-02, port: xe-0/0/1}]
    segments: [vlan-100, vlan-200, vlan-300]
    speed: 40G
  - endpoints: [{node: core-sw-01, port: xe-0/0/10}, {node: core-sw-02, port: xe-0/0/10}]
    segments: [vlan-100, vlan-200, vlan-300]
    speed: 100G
  - endpoints: [{node: core-sw-01, port: xe-0/0/5}, {node: fw-01, port: xe-0/0/0}]
    segments: [vlan-100]
    speed: 10G
  - endpoints: [{node: core-sw-01, port: ge-0/0/1}, {node: access-sw-01, port: ge-0/0/48}]
    segments: [vlan-200, vlan-300]
    virtual: true
    speed: 10G
  - endpoints: [{node: core-sw-02, port: ge-0/0/1}, {node: access-sw-02, port: ge-0/0/48}]
    segments: [vlan-200, vlan-300]
    virtual: true
    speed: 10G
  - endpoints: [{node: access-sw-01, port: ge-0/0/1}, {node: esxi-01, port: vmnic0}]
    segments: [vlan-200]
    speed: 25G
  - endpoints: [{node: access-sw-01, port: ge-0/0/2}, {node: esxi-02, port: vmnic0}]
    segments: [vlan-200]
    speed: 25G
  - endpoints: [{node: access-sw-02, port: ge-0/0/1}, {node: esxi-01, port: vmnic1}]
    segments: [vlan-200]
    speed: 25G
  - endpoints: [{node: access-sw-02, port: ge-0/0/2}, {node: esxi-02, port: vmnic1}]
    segments: [vlan-200]
    speed: 25G
  - endpoints: [{node: esxi-01, port: vSwitch0}, {node: vm-web-01, port: eth0}]
    segments: [vlan-200]
    virtual: true
    speed: 10G
  - endpoints: [{node: esxi-02, port: vSwitch0}, {node: vm-db-01, port: eth0}]
    segments: [vlan-300]
    virtual: true
    speed: 10G
  - endpoints: [{node: core-rt-01, port: xe-0/0/10}, {node: dr-rt-01, port: ge-0/0/0}]
    speed: 10G
  - endpoints: [{node: dr-rt-01, port: ge-0/0/1}, {node: dr-sw-01, port: ge-0/0/48}]
    segments: [vlan-100, vlan-200]
    speed: 1G
  - endpoints: [{node: dr-sw-01, port: ge-0/0/1}, {node: dr-storage-01, port: eth0}]
    segments: [vlan-200]
    speed: 1G
  - endpoints: [{node: core-rt-02, port: tun0}, {node: office-rt-01, port: tun0}]
    virtual: true
  - endpoints: [{node: office-rt-01, port: ge-0/0/1}, {node: office-sw-01, port: ge-0/0/48}]
    segments: [vlan-10, vlan-20]
    speed: 1G
  - endpoints: [{node: office-sw-01, port: ge-0/0/1}, {node: office-ap-01, port: eth0}]
    segments: [vlan-20]
    speed: 1G
  - endpoints: [{node: office-sw-01, port: ge-0/0/2}, {node: office-ap-02, port: eth0}]
    segments: [vlan-20]
    speed: 1G
