name: Company network

routingDomains:
  - id: company
    label: Company
  - id: staff
    label: Staff
    prefix: 192.168.1.0/24
  - id: database
    label: Database
    prefix: 192.168.3.0/24

segments:
  - id: vlan-10
    label: Staff
    vlan: 10
    prefix: 192.168.1.0/24
    routingDomain: staff
    addresses:
      web-1: 192.168.1.20
  - id: vlan-30
    label: Database
    vlan: 30
    prefix: 192.168.3.0/24
    routingDomain: database

nodes:
  - id: core
    label: Core switch
    type: switch
    routingDomain: company
  - id: esx-1
    label: esx-1
    type: virtualization-host
    product: vmware/esxi
    routingDomain: company
  - id: esx-2
    label: esx-2
    type: virtualization-host
    product: vmware/esxi
    routingDomain: company
  - id: esx-3
    label: esx-3
    type: virtualization-host
    product: vmware/esxi
    routingDomain: company
  - id: web-1
    label: web-1
    type: virtual-machine
    host: esx-1
    segments:
      - vlan-10
  - id: db-1
    label: db-1
    type: virtual-machine
    host: prod
    segments:
      - vlan-30
  - id: mon-1
    label: mon-1
    assumed: true
    address: 10.99.0.50

redundancy:
  - id: prod
    label: prod
    nodes:
      - esx-1
      - esx-2
      - esx-3

links:
  - endpoints:
      - node: core
      - node: esx-1
    speed: 25G
    segments:
      - vlan-10
      - vlan-30
  - endpoints:
      - node: core
      - node: esx-2
    speed: 25G
    segments:
      - vlan-10
      - vlan-30
  - endpoints:
      - node: core
      - node: esx-3
    speed: 25G
    segments:
      - vlan-10
      - vlan-30
