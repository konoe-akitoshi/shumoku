name: Small branch office
segments:
  - id: staff
    label: staff
    vlan: 10
    prefix: 192.168.10.0/24
    addresses:
      router: [192.168.10.1]
      sw-1: [192.168.10.2]
      printer: [192.168.10.50]
  - id: guest
    label: guest
    vlan: 20
    prefix: 192.168.20.0/24
    addresses:
      router: [192.168.20.1]
  - id: nas-net
    prefix: 10.0.0.0/24
    addresses:
      nas: [10.0.0.5]
nodes:
  - id: router
    type: router
    vendor: Yamaha
    model: RTX1300
  - id: sw-1
    type: switch
  - id: sw-2
    type: switch
  - id: printer
    type: printer
  - id: nas
    type: nas
  - id: isp
    label: ISP
links:
  - endpoints:
      - { node: router, port: lan1 }
      - { node: sw-1, port: "1" }
    speed: 1G
    segments: [staff, guest]
  - endpoints:
      - { node: sw-1, port: "2" }
      - { node: sw-2 }
  - endpoints:
      - { node: printer }
      - { node: sw-2 }
  - endpoints:
      - { node: router, port: wan }
      - { node: isp }
