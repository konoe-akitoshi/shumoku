                        - u8: ["変換: 暗号", 3, 続きあり, "", {depth: 1}]
                        - u8: ["  予約", 0, "0", "", {depth: 2}]
                        - u16: ["  変換の長さ", 12, "12", "", {depth: 2}]
                        - u8: ["  種類", 1, "1 (暗号)", "", {depth: 2}]
                        - u8: ["  予約", 0, "0", "", {depth: 2}]
