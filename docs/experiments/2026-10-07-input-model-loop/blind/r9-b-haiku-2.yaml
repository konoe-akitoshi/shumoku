name: Server Room Virtualization
description: Virtual machines in a server room with a core switch and ESXi cluster

groups:
  - id: server-room
    label: Server Room

segments:
  - id: vlan-10
    label: Staff
    vlan: 10
    prefix: 192.168.1.0/24
    addresses:
      web-1:
        - 192.168.1.20

  - id: vlan-30
    label: Database
    vlan: 30
    prefix: 192.168.3.0/24

redundancy:
  - id: prod
    label: vSphere HA Cluster
    nodes:
      - esx-1
      - esx-2
      - esx-3

nodes:
  - id: core
    label: Core Switch
    type: switch
    group: server-room

  - id: esx-1
    label: ESXi Host 1
    type: hypervisor
    vendor: VMware
    group: server-room

  - id: esx-2
    label: ESXi Host 2
    type: hypervisor
    vendor: VMware
    group: server-room

  - id: esx-3
    label: ESXi Host 3
    type: hypervisor
    vendor: VMware
    group: server-room

  - id: web-1
    label: Web Server
    type: vm
    host: esx-1

  - id: db-1
    label: Database VM
    type: vm
    host: prod

  - id: mon-1
    label: Monitoring VM
    type: vm
    address: 10.99.0.50

links:
  - endpoints:
      - node: core
      - node: esx-1
    speed: 25G
    segments:
      - vlan-10
      - vlan-30

  - endpoints:
      - node: core
      - node: esx-2
    speed: 25G
    segments:
      - vlan-10
      - vlan-30

  - endpoints:
      - node: core
      - node: esx-3
    speed: 25G
    segments:
      - vlan-10
      - vlan-30

  - endpoints:
      - node: esx-1
      - node: web-1
    virtual: true
    segments:
      - vlan-10
