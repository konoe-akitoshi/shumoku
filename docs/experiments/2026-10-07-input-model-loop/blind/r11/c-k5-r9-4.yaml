name: company server room
groups:
  - id: server-room
    label: Server room
redundancy:
  - id: prod
    label: prod
    nodes: [esx-1, esx-2, esx-3]
nodes:
  - id: core
    label: Core switch
    group: server-room
  - id: esx-1
    label: esx-1
    product: vmware
    software: vmware-esxi
    group: server-room
  - id: esx-2
    label: esx-2
    product: vmware
    software: vmware-esxi
    group: server-room
  - id: esx-3
    label: esx-3
    product: vmware
    software: vmware-esxi
    group: server-room
  - id: web-1
    label: web-1
    host: esx-1
    group: server-room
  - id: db-1
    label: db-1
    host: prod
    group: server-room
  - id: mon-1
    label: mon-1
    address: 10.99.0.50
links:
  - endpoints:
      - node: core
      - node: esx-1
    speed: 25G
    segments: [staff, database]
  - endpoints:
      - node: core
      - node: esx-2
    speed: 25G
    segments: [staff, database]
  - endpoints:
      - node: core
      - node: esx-3
    speed: 25G
    segments: [staff, database]
  - endpoints:
      - node: web-1
      - segment: staff
    virtual: true
  - endpoints:
      - node: db-1
      - segment: database
    virtual: true
segments:
  - id: staff
    label: VLAN 10
    vlan: 10
    prefix: 192.168.1.0/24
    group: server-room
    addresses:
      web-1: 192.168.1.20
  - id: database
    label: VLAN 30
    vlan: 30
    prefix: 192.168.3.0/24
    group: server-room
