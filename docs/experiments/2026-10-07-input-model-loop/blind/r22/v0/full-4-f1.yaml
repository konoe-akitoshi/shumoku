name: Headquarters and AWS Tokyo
groups:
  - id: server-room
    label: Server room
  - id: aws-ap-northeast-1a
    label: ap-northeast-1a
routingDomains:
  - id: guest
    label: guest
segments:
  - id: vlan-10
    label: Business
    vlan: 10
    prefix: 192.168.10.0/24
  - id: vlan-20
    label: Guest
    vlan: 20
    routingDomain: guest
  - id: vpc-main
    label: main
    prefix: 10.0.0.0/16
  - id: sub-a
    label: sub-a
    prefix: 10.0.1.0/24
    group: aws-ap-northeast-1a
    routingDomain: vpc-main
nodes:
  - id: rt-1
    type: router
    product: yamaha/rtx3510
    group: server-room
  - id: sw-1
    type: switch
    product: ?/swx2322p-16mt
    group: server-room
  - id: hv-1
    type: server
    product: dell/poweredge-r750
    software: VMware ESXi
    group: server-room
  - id: web-1
    type: vm
    host: hv-1
    address: 192.168.10.20
  - id: igw-1
    type: internet-gateway
    group: aws-ap-northeast-1a
  - id: vgw-1
    type: vpn-gateway
    label: Virtual private gateway
    group: aws-ap-northeast-1a
links:
  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: port 1
    speed: 1G
    cable: Cat6
    length: 3m
    segments: [vlan-10, vlan-20]
  - endpoints:
      - node: hv-1
      - node: sw-1
    speed: 10G
  - endpoints:
      - node: web-1
      - segment: vlan-10
    virtual: true
  - endpoints:
      - node: igw-1
      - routingDomain: vpc-main
  - endpoints:
      - node: rt-1
      - node: vgw-1
    connection: vpn-rt-1-vgw-1
    description: Site-to-Site VPN
redundancy:
  - id: vpn-rt-1-vgw-1
    label: VPN tunnels
    nodes: [rt-1, vgw-1]
    assumed: true
