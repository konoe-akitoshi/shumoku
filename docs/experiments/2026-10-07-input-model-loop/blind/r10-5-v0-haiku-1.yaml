name: Company Network
description: On-premises server room and AWS Tokyo region

groups:
  - id: onprem
    label: Server Room
  - id: aws
    label: AWS Tokyo
  - id: aws-ap-ne-1a
    label: AP-NE-1a
    parent: aws
  - id: aws-ap-ne-1c
    label: AP-NE-1c
    parent: aws

segments:
  - id: vlan-10
    label: VLAN 10
    vlan: 10
    prefix: 192.168.10.0/24
    group: onprem
    addresses:
      rt-1: []
      hv-1: []
      hv-2: []
      fw-v: ["192.168.10.2"]
      app-1: ["192.168.10.20"]

  - id: sub-a
    label: Subnet A
    prefix: 10.0.1.0/24
    group: aws-ap-ne-1a
    addresses:
      main: []
      tgw-1: []
      web-c: ["10.0.1.10"]

  - id: sub-c
    label: Subnet C
    prefix: 10.0.2.0/24
    group: aws-ap-ne-1c
    addresses:
      main: []
      tgw-1: []
      db-c: ["10.0.2.20"]

redundancy:
  - id: prod
    label: vSphere HA Cluster prod
    nodes: [hv-1, hv-2]

nodes:
  - id: rt-1
    label: rt-1
    type: router
    product: yamaha/rtx3510
    group: onprem

  - id: hv-1
    label: hv-1
    type: hypervisor
    product: dell/poweredge/r750
    software: vmware/esxi
    group: onprem

  - id: hv-2
    label: hv-2
    type: hypervisor
    product: dell/poweredge/r750
    software: vmware/esxi
    group: onprem

  - id: fw-v
    label: fw-v
    type: firewall
    product: paloaltonetworks/vm-series
    host: hv-1

  - id: app-1
    label: app-1
    type: vm
    software: ubuntu
    host: prod

  - id: web-c
    label: web-c
    type: instance
    product: aws/ec2/t3.medium
    software: amazon-linux
    group: aws-ap-ne-1a

  - id: db-c
    label: db-c
    type: database
    product: aws/rds/mysql
    software: mysql
    group: aws-ap-ne-1c

  - id: igw-1
    label: igw-1
    type: gateway
    product: aws/internet-gateway

  - id: tgw-1
    label: tgw-1
    type: gateway
    product: aws/transit-gateway

  - id: main
    label: VPC main
    type: vpc
    prefix: 10.0.0.0/16

links:
  - endpoints: [{ node: hv-1 }, { node: rt-1 }]
    speed: 10G
    segments: [vlan-10]

  - endpoints: [{ node: hv-2 }, { node: rt-1 }]
    speed: 10G
    segments: [vlan-10]

  - endpoints: [{ node: rt-1 }, { node: tgw-1 }]
    virtual: true
    description: IPsec Tunnel 1

  - endpoints: [{ node: rt-1 }, { node: tgw-1 }]
    virtual: true
    description: IPsec Tunnel 2
