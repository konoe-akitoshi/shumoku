replicaCount: 1

image:
  repository: ghcr.io/konoe-akitoshi/shumoku
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # Set true for the bundled in-cluster Kubernetes data source.
  # null preserves the cluster default for existing installations.
  automountServiceAccountToken: null
  annotations: {}
  name: ""

# Read-only API access for the bundled Kubernetes data source. Does not create a data source.
kubernetesDiscovery:
  enabled: false
  clusterWide: false
  # Required for Services and workloads view; disable when using only Pod view.
  includeWorkloads: true
  # Empty means this Helm release's namespace when clusterWide is false.
  namespaces: []
  # Node placement requires cluster-wide Node list access even with namespace-scoped Pods.
  includeNodes: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: shumoku.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

httproute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: my-gateway
      namespace: default
  hostnames:
    - shumoku.local
  rules:
    - paths:
        - path: /
          pathType: PathPrefix

demoMode: false

auth:
  # Existing Kubernetes Secret containing the one-time bootstrap administrator
  # password. Use this OR bootstrapAdminPassword for a fresh deployment.
  existingSecret: ""
  # Create a chart-managed Secret for first-time setup (at least 8 characters).
  # Values are retained in Helm release metadata. Prefer existingSecret when possible.
  # Changing this value does not reset an already configured administrator.
  bootstrapAdminPassword: ""
  passwordKey: admin-password
  secureCookies: false
  trustProxy: false

resources: {}

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 1Gi
  storageClass: ""
  existingClaim: ""

config: {}
  # server:
  #   port: 8080
  #   host: 0.0.0.0
  #   dataDir: /data
  #   pollInterval: 5000
  #   backgroundPollInterval: 60000
  #   concurrencyLimit: 3

env: []

nodeSelector: {}

tolerations: []

affinity: {}
