  - endpoints:
      - node: br2
      - node: transit-router-64540
    connection: br2-as64540-ebgp
    virtual: true
connections:
  - id: br1-as64510-ebgp
    label: eBGP session to AS64510 (transit)
  - id: br2-as64520-ebgp
    label: eBGP session to AS64520 (settlement-free peering)
  - id: br2-as64540-ebgp
    label: eBGP session to AS64540 (transit)
