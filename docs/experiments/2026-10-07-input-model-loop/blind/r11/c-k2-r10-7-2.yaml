name: Company network
routingDomains:
  - id: guest
    label: Guest VRF
    prefix: 192.168.20.0/24
  - id: main
    label: VPC main
    prefix: 10.0.0.0/16

groups:
  - id: server-room
    label: On-premises server room
  - id: ap-northeast-1a
    label: ap-northeast-1a
  - id: ap-northeast-1c
    label: ap-northeast-1c

segments:
  - id: vlan-20
    label: VLAN 20
    vlan: 20
    prefix: 192.168.20.0/24
    routingDomain: guest
    addresses:
      ap-1: 192.168.20.5
  - id: vlan-10
    label: VLAN 10
    vlan: 10
    prefix: 192.168.10.0/24
    addresses:
      fw-v: 192.168.10.2
      app-1: 192.168.10.20
  - id: sub-a
    label: sub-a
    prefix: 10.0.1.0/24
    routingDomain: main
    group: ap-northeast-1a
    addresses:
      web-c: 10.0.1.10
  - id: sub-c
    label: sub-c
    prefix: 10.0.2.0/24
    routingDomain: main
    group: ap-northeast-1c
    addresses:
      db-c: 10.0.2.20

nodes:
  - id: rt-1
    label: rt-1
    product: yamaha/rtx3510
    group: server-room
  - id: ap-1
    label: ap-1
    group: server-room
  - id: hv-1
    label: hv-1
    product: dell/poweredge/r750
    software: vmware/esxi
    group: server-room
    members:
      - hv-1
  - id: hv-2
    label: hv-2
    product: dell/poweredge/r750
    software: vmware/esxi
    group: server-room
    members:
      - hv-2
  - id: fw-v
    label: fw-v
    product: palo-alto-networks/vm-series
    host: hv-1
    group: server-room
  - id: app-1
    label: app-1
    software: ubuntu
    host: prod
    group: server-room
  - id: web-c
    label: web-c
    product: amazon/ec2/t3.medium
    software: amazon-linux
    group: ap-northeast-1a
  - id: db-c
    label: db-c
    product: amazon/rds/mysql
    group: ap-northeast-1c
  - id: igw-1
    label: igw-1
    product: amazon/internet-gateway
  - id: tgw-1
    label: tgw-1
    product: amazon/transit-gateway

redundancy:
  - id: prod
    label: vSphere HA cluster prod
    nodes:
      - hv-1
      - hv-2

connections:
  - id: vpn-1
    label: Site-to-Site VPN rt-1 to tgw-1

links:
  - endpoints:
      - node: ap-1
      - node: rt-1
        port: lan2
    segments:
      - vlan-20
  - endpoints:
      - node: hv-1
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: hv-2
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: fw-v
      - segment: vlan-10
    virtual: true
  - endpoints:
      - node: app-1
      - segment: vlan-10
    virtual: true
  - endpoints:
      - node: igw-1
      - routingDomain: main
  - endpoints:
      - node: tgw-1
      - segment: sub-a
  - endpoints:
      - node: tgw-1
      - segment: sub-c
  - endpoints:
      - node: rt-1
      - node: tgw-1
    connection: vpn-1
    assumed: true
    virtual: true
  - endpoints:
      - node: rt-1
      - node: tgw-1
    connection: vpn-1
    assumed: true
    virtual: true
