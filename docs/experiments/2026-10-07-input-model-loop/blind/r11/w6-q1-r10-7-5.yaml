name: Company network
description: On-premises server room and AWS Tokyo region.

networks:
  - id: guest
  - id: main
    label: VPC main
    prefix: 10.0.0.0/16

connections:
  - id: vpn-1
    label: Site-to-Site VPN

groups:
  - id: server-room
    label: Server room
  - id: ap-northeast-1a
    label: ap-northeast-1a
  - id: ap-northeast-1c
    label: ap-northeast-1c

segments:
  - id: vlan-20
    label: VLAN 20
    vlan: 20
    prefix: 192.168.20.0/24
    network: guest
    addresses:
      ap-1: 192.168.20.5
  - id: vlan-10
    label: VLAN 10
    vlan: 10
    prefix: 192.168.10.0/24
    addresses:
      fw-v: 192.168.10.2
      app-1: 192.168.10.20
  - id: sub-a
    label: sub-a
    prefix: 10.0.1.0/24
    network: main
    group: ap-northeast-1a
    addresses:
      web-c: 10.0.1.10
  - id: sub-c
    label: sub-c
    prefix: 10.0.2.0/24
    network: main
    group: ap-northeast-1c
    addresses:
      db-c: 10.0.2.20

redundancy:
  - id: prod
    label: vSphere HA cluster prod
    nodes: [hv-1, hv-2]

nodes:
  - id: rt-1
    label: rt-1
    product: yamaha/rtx3510
    group: server-room
  - id: ap-1
    label: ap-1
    group: server-room
  - id: hv-1
    label: hv-1
    product: dell/poweredge-r750
    software: vmware/esxi
    group: server-room
  - id: hv-2
    label: hv-2
    product: dell/poweredge-r750
    software: vmware/esxi
    group: server-room
  - id: fw-v
    label: fw-v
    product: palo-alto-networks/vm-series
    host: hv-1
  - id: app-1
    label: app-1
    software: ubuntu
    host: prod
  - id: web-c
    label: web-c
    product: aws/ec2/t3.medium
    software: amazon-linux
  - id: db-c
    label: db-c
    product: aws/rds/mysql
  - id: igw-1
    label: igw-1
    product: aws/internet-gateway
    network: main
  - id: tgw-1
    label: tgw-1
    product: aws/transit-gateway
    network: main

links:
  - endpoints:
      - node: rt-1
        port: lan2
      - node: ap-1
    segments: [vlan-20]
  - endpoints:
      - node: rt-1
      - node: hv-1
    speed: 10G
    segments: [vlan-10]
  - endpoints:
      - node: rt-1
      - node: hv-2
    speed: 10G
    segments: [vlan-10]
  - endpoints:
      - node: fw-v
      - node: hv-1
    virtual: true
    segments: [vlan-10]
  - endpoints:
      - node: app-1
      - node: hv-1
    virtual: true
    segments: [vlan-10]
  - endpoints:
      - node: app-1
      - node: hv-2
    virtual: true
    segments: [vlan-10]
  - endpoints:
      - node: rt-1
      - node: tgw-1
    connection: vpn-1
    virtual: true
  - endpoints:
      - node: rt-1
      - node: tgw-1
    connection: vpn-1
    virtual: true
