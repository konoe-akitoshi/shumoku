name: AWS + On-Premises Integration

groups:
  - id: server-room
    label: Server Room
  - id: aws-tokyo
    label: AWS Tokyo Region
  - id: vpc-main
    label: VPC Main
    parent: aws-tokyo

segments:
  - id: vlan-10
    label: VLAN 10
    vlan: 10
    prefix: 192.168.10.0/24
    addresses:
      rt-1: []
      hv-1: []
      hv-2: []
      fw-v:
        - 192.168.10.2
      app-1:
        - 192.168.10.20
  - id: subnet-a
    label: Subnet A (ap-northeast-1a)
    prefix: 10.0.1.0/24
    addresses:
      web-c:
        - 10.0.1.10
      tgw-1: []
  - id: subnet-c
    label: Subnet C (ap-northeast-1c)
    prefix: 10.0.2.0/24
    addresses:
      db-c:
        - 10.0.2.20
      tgw-1: []

redundancy:
  - id: prod
    label: vSphere HA Cluster prod
    nodes:
      - hv-1
      - hv-2

nodes:
  - id: rt-1
    label: rt-1
    type: router
    vendor: Yamaha
    model: RTX3510
    group: server-room
  - id: hv-1
    label: hv-1
    type: hypervisor
    vendor: Dell
    model: PowerEdge R750
    software: VMware ESXi
    group: server-room
  - id: hv-2
    label: hv-2
    type: hypervisor
    vendor: Dell
    model: PowerEdge R750
    software: VMware ESXi
    group: server-room
  - id: fw-v
    label: fw-v
    type: firewall
    vendor: Palo Alto Networks
    model: VM-Series
    host: hv-1
  - id: app-1
    label: app-1
    type: vm
    software: Ubuntu
    host: prod
  - id: web-c
    label: web-c
    type: ec2
    vendor: Amazon
    model: t3.medium
    software: Amazon Linux
    group: vpc-main
  - id: db-c
    label: db-c
    type: rds
    vendor: Amazon
    software: MySQL
    group: vpc-main
  - id: igw-1
    label: igw-1
    type: internet-gateway
    vendor: Amazon
    group: vpc-main
  - id: tgw-1
    label: tgw-1
    type: transit-gateway
    vendor: Amazon
    group: vpc-main

links:
  - endpoints:
      - node: hv-1
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: hv-2
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: rt-1
      - node: tgw-1
    virtual: true
    description: Site-to-Site VPN with two IPsec tunnels
