  - id: br1-transit
    type: router
    asn: 64510
  - id: br2
    label: br2
    type: router
    asn: 64500
    group: dc-a
  - id: as64520
    type: router
    asn: 64520
  - id: as64530
    type: router
    asn: 64530
  - id: as64540
    type: router
