name: 本社のサーバ室とAWS東京
routingDomains:
  - id: guest
    label: guest
    prefix: 192.168.20.0/24
groups:
  - id: headquarters-server-room
    label: 本社 サーバ室
  - id: aws-tokyo
    label: AWS 東京
  - id: vpc-main
    label: VPC main
  - id: subnet-sub-a
    label: サブネット sub-a
connections:
  - id: site-to-site-vpn
    label: IPsec Site-to-Site VPN
segments:
  - id: vlan-10
    label: 業務
    vlan: 10
    prefix: 192.168.10.0/24
  - id: vlan-20
    label: 来客
    vlan: 20
    routingDomain: guest
  - id: vpc-main-cidr
    label: VPC main
    prefix: 10.0.0.0/16
  - id: subnet-sub-a-cidr
    label: sub-a
    prefix: 10.0.1.0/24
nodes:
  - id: rt-1
    label: rt-1
    type: router
    product: Yamaha/RTX3510
    group: headquarters-server-room
  - id: sw-1
    label: sw-1
    type: switch
    product: '?/SWX2322P-16MT'
    group: headquarters-server-room
  - id: hv-1
    label: hv-1
    type: virtualization host
    product: Dell/PowerEdge R750
    software: VMware ESXi
    group: headquarters-server-room
  - id: web-1
    label: web-1
    type: virtual machine
    host: hv-1
    group: headquarters-server-room
  - id: aws
    label: AWS 東京
    type: cloud
    group: aws-tokyo
  - id: vpc-main
    label: main
    type: VPC
    group: vpc-main
  - id: subnet-sub-a
    label: sub-a (ap-northeast-1a)
    type: subnet
    group: subnet-sub-a
  - id: igw-1
    label: igw-1
    type: internet gateway
    group: vpc-main
  - id: vgw-1
    label: vgw-1
    type: virtual private gateway
    group: vpc-main
links:
  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: '1'
    speed: 1G
    cable: Cat6
    length: 3m
    segments:
      - vlan-10
      - vlan-20
  - endpoints:
      - node: sw-1
      - node: hv-1
    speed: 10G
  - endpoints:
      - node: web-1
      - segment: vlan-10
  - endpoints:
      - node: rt-1
      - node: vgw-1
    virtual: true
    connection: site-to-site-vpn
    description: IPsec Site-to-Site VPN、トンネル2本
  - endpoints:
      - node: igw-1
      - node: vpc-main-cidr
  - endpoints:
      - node: vpc-main
      - node: subnet-sub-a-cidr
  - endpoints:
      - node: subnet-sub-a
      - segment: subnet-sub-a-cidr
