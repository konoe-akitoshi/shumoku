name: 本社・大阪支店ネットワーク

groups:
  - id: hq
    label: 本社
  - id: osaka
    label: 大阪支店

connections:
  - id: lag-sw1-sw2
    label: sw-1–sw-2 LAG
  - id: wan-hq-osaka
    label: 広域イーサネット
  - id: expressroute
    label: ExpressRoute
  - id: ipsec-backup
    label: バックアップ IPsec トンネル

nodes:
  - id: rt-1
    group: hq
  - id: sw-1
    group: hq
  - id: sw-2
    group: hq
  - id: prn-1
    group: hq
    type: printer
  - id: rt-2
    group: osaka
  - id: ergw
    label: Azure ExpressRoute ゲートウェイ

links:
  - endpoints:
      - node: rt-1
        port: te1
      - node: sw-1
        port: te0/1
    speedMbps: 10000

  - endpoints:
      - node: sw-1
        port: te0/47
      - node: sw-2
        port: te0/47
    speedMbps: 10000
    connection: lag-sw1-sw2

  - endpoints:
      - node: sw-1
        port: te0/48
      - node: sw-2
        port: te0/48
    speedMbps: 10000
    connection: lag-sw1-sw2

  - endpoints:
      - node: sw-2
        port: ge0/10
      - node: prn-1
    speedMbps: 100
    description: sw-2 のポートは 1G 対応

  - endpoints:
      - node: rt-1
        port: ge0
      - node: rt-2
        port: ge0
    speedMbps: 1000
    connection: wan-hq-osaka
    description: 契約帯域 300M

  - endpoints:
      - node: rt-1
      - node: ergw
    speedMbps: 2000
    connection: expressroute
    assumed: true
    description: 途中の機器は不明

  - endpoints:
      - node: rt-1
      - node: rt-2
    connection: ipsec-backup
    virtual: true
