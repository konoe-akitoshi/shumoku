name: Head office
groups:
  - id: server-room
    label: Server room
routingDomains:
  - id: guest
    label: guest
segments:
  - id: vlan-10
    label: Business
    vlan: 10
    prefix: 192.168.10.0/24
    addresses:
      web-1: 192.168.10.20
  - id: vlan-20
    label: Guest
    vlan: 20
    routingDomain: guest
nodes:
  - id: rt-1
    type: router
    product: yamaha/rtx3510
    group: server-room
  - id: sw-1
    type: switch
    product: ?/swx2322p-16mt
    group: server-room
  - id: hv-1
    type: server
    product: dell/poweredge-r750
    software: VMware ESXi
    group: server-room
  - id: web-1
    type: vm
    host: hv-1
  - id: igw-1
    type: internet-gateway
  - id: vgw-1
    type: vpn-gateway
  - id: vpc-main
    label: main
    type: cloud-network
  - id: sub-a
    type: subnet
    group: vpc-main
    zone: ap-northeast-1a
links:
  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: port 1
    speed: 1G
    cable: Cat6
    length: 3m
    segments: [vlan-10, vlan-20]
  - endpoints:
      - node: hv-1
      - node: sw-1
    speed: 10G
  - endpoints:
      - node: web-1
      - segment: vlan-10
    virtual: true
  - endpoints:
      - node: igw-1
      - node: vpc-main
  - endpoints:
      - node: sub-a
      - node: vpc-main
  - endpoints:
      - node: rt-1
      - node: vgw-1
    connection: vpn-1
    description: IPsec Site-to-Site VPN, 2 tunnels
