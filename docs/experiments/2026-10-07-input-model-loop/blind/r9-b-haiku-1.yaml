name: Server Room Virtualization Network
description: A company runs virtual machines in its server room

segments:
  - id: vlan-10
    label: staff
    vlan: 10
    prefix: 192.168.1.0/24
    addresses:
      web-1: [192.168.1.20]
  - id: vlan-30
    label: database
    vlan: 30
    prefix: 192.168.3.0/24
    addresses:
      db-1: []

redundancy:
  - id: prod
    nodes: [esx-1, esx-2, esx-3]

nodes:
  - id: core
    type: switch
  - id: esx-1
    type: host
    vendor: VMware
    model: ESXi
  - id: esx-2
    type: host
    vendor: VMware
    model: ESXi
  - id: esx-3
    type: host
    vendor: VMware
    model: ESXi
  - id: web-1
    type: vm
    host: esx-1
  - id: db-1
    type: vm
    host: prod
  - id: mon-1
    type: vm
    address: 10.99.0.50
    assumed: true

links:
  - endpoints: [{node: core}, {node: esx-1}]
    speed: 25G
    segments: [vlan-10, vlan-30]
  - endpoints: [{node: core}, {node: esx-2}]
    speed: 25G
    segments: [vlan-10, vlan-30]
  - endpoints: [{node: core}, {node: esx-3}]
    speed: 25G
    segments: [vlan-10, vlan-30]
