name: Main network
groups:
  - id: headquarters
    label: 本社
  - id: server-room
    label: サーバ室
    parent: headquarters
routingDomains:
  - id: guest
    label: guest
    prefix: 192.168.20.0/24
connections:
  - id: site-to-site-vpn
    label: IPsec Site-to-Site VPN
segments:
  - id: vlan-10
    label: 業務
    vlan: 10
    prefix: 192.168.10.0/24
  - id: vlan-20
    label: 来客
    vlan: 20
    routingDomain: guest
  - id: aws-vpc-main
    label: AWS 東京 VPC main
    prefix: 10.0.0.0/16
  - id: aws-sub-a
    label: AWS 東京 サブネット sub-a
    prefix: 10.0.1.0/24
nodes:
  - id: rt-1
    type: router
    product: Yamaha RTX3510
    group: server-room
  - id: sw-1
    type: switch
    product: SWX2322P-16MT
    group: server-room
  - id: hv-1
    type: server
    product: Dell PowerEdge R750
    software: VMware ESXi
    group: server-room
  - id: web-1
    type: vm
    host: hv-1
    address: 192.168.10.20
  - id: igw-1
    type: internet-gateway
  - id: vgw-1
    type: vpn-gateway
links:
  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: port 1
    speed: 1G
    cable: Cat6
    length: 3m
    segments:
      - vlan-10
      - vlan-20
  - endpoints:
      - node: sw-1
      - node: hv-1
    speed: 10G
  - endpoints:
      - node: igw-1
      - segment: aws-vpc-main
  - endpoints:
      - node: vgw-1
      - segment: aws-vpc-main
  - endpoints:
      - node: igw-1
      - segment: aws-sub-a
  - endpoints:
      - node: vgw-1
      - segment: aws-sub-a
  - endpoints:
      - node: rt-1
      - node: vgw-1
    connection: site-to-site-vpn
