name: Company network

routingDomains:
  - id: guest
  - id: main
  - id: vpc-main
    label: VPC main
    prefix: 10.0.0.0/16

groups:
  - id: server-room
    label: On-premises server room
  - id: ap-northeast-1a
    label: ap-northeast-1a
  - id: ap-northeast-1c
    label: ap-northeast-1c

segments:
  - id: vlan-20
    label: VLAN 20
    vlan: 20
    prefix: 192.168.20.0/24
    routingDomain: guest
    group: server-room
    addresses:
      ap-1: 192.168.20.5
  - id: vlan-10
    label: VLAN 10
    vlan: 10
    prefix: 192.168.10.0/24
    routingDomain: main
    group: server-room
    addresses:
      fw-v: 192.168.10.2
      app-1: 192.168.10.20
  - id: sub-a
    label: sub-a
    prefix: 10.0.1.0/24
    routingDomain: vpc-main
    group: ap-northeast-1a
    addresses:
      web-c: 10.0.1.10
  - id: sub-c
    label: sub-c
    prefix: 10.0.2.0/24
    routingDomain: vpc-main
    group: ap-northeast-1c
    addresses:
      db-c: 10.0.2.20

redundancy:
  - id: prod
    label: prod
    nodes:
      - hv-1
      - hv-2

connections:
  - id: rt-1-tgw-1-vpn
    label: Site-to-Site VPN

nodes:
  - id: rt-1
    label: rt-1
    type: router
    product: yamaha/rtx3510
    group: server-room
  - id: ap-1
    label: ap-1
    type: access point
    group: server-room
  - id: hv-1
    label: hv-1
    type: server
    product: dell/poweredge-r750
    software: vmware/esxi
    group: server-room
  - id: hv-2
    label: hv-2
    type: server
    product: dell/poweredge-r750
    software: vmware/esxi
    group: server-room
  - id: fw-v
    label: fw-v
    type: firewall
    product: paloalto/vm-series
    host: hv-1
    group: server-room
  - id: app-1
    label: app-1
    type: virtual machine
    software: ubuntu
    host: prod
    group: server-room
  - id: igw-1
    label: igw-1
    type: internet gateway
    group: ap-northeast-1
  - id: tgw-1
    label: tgw-1
    type: transit gateway
    group: ap-northeast-1
  - id: web-c
    label: web-c
    type: EC2 instance
    product: aws/ec2/t3.medium
    software: amazon-linux
    group: ap-northeast-1a
  - id: db-c
    label: db-c
    type: RDS database
    product: aws/rds/mysql
    group: ap-northeast-1c

links:
  - endpoints:
      - node: ap-1
        port: wlan
      - node: rt-1
        port: lan2
    segments:
      - vlan-20
  - endpoints:
      - node: hv-1
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: hv-2
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: fw-v
      - segment: vlan-10
    virtual: true
  - endpoints:
      - node: app-1
      - segment: vlan-10
    virtual: true
  - endpoints:
      - node: igw-1
      - routingDomain: vpc-main
  - endpoints:
      - node: tgw-1
      - routingDomain: vpc-main
  - endpoints:
      - node: tgw-1
      - segment: sub-a
    virtual: true
  - endpoints:
      - node: tgw-1
      - segment: sub-c
    virtual: true
  - endpoints:
      - node: rt-1
      - node: tgw-1
    connection: rt-1-tgw-1-vpn
    virtual: true
    assumed: true
  - endpoints:
      - node: rt-1
      - node: tgw-1
    connection: rt-1-tgw-1-vpn
    virtual: true
    assumed: true
