name: Headquarters and AWS Tokyo
groups:
  - id: server-room
    label: Server room
  - id: ap-northeast-1a
    label: ap-northeast-1a
routingDomains:
  - id: guest
    label: guest
  - id: main
    label: main
    prefix: 10.0.0.0/16
connections:
  - id: vpn-1
    label: IPsec Site-to-Site VPN
segments:
  - id: v10
    label: Business
    vlan: 10
    prefix: 192.168.10.0/24
    addresses:
      web-1: 192.168.10.20
  - id: v20
    label: VLAN 20
    vlan: 20
    routingDomain: guest
  - id: sub-a
    label: sub-a
    prefix: 10.0.1.0/24
    routingDomain: main
    group: ap-northeast-1a
nodes:
  - id: rt-1
    type: router
    product: yamaha/rtx3510
    group: server-room
  - id: sw-1
    type: switch
    product: ?/swx2322p-16mt
    group: server-room
  - id: hv-1
    type: server
    product: dell/poweredge-r750
    software: VMware ESXi
    group: server-room
  - id: web-1
    type: vm
    host: hv-1
  - id: vgw-1
    type: vpn-gateway
  - id: igw-1
    type: internet-gateway
links:
  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: port 1
    speed: 1G
    cable: Cat6
    length: 3m
    segments: [v10, v20]
  - endpoints:
      - node: hv-1
      - node: sw-1
    speed: 10G
  - endpoints:
      - node: web-1
      - segment: v10
    virtual: true
  - endpoints:
      - node: rt-1
      - routingDomain: main
  - endpoints:
      - node: rt-1
      - node: vgw-1
    connection: vpn-1
    description: IPsec Site-to-Site VPN, 2 tunnels
  - endpoints:
      - node: igw-1
      - routingDomain: main
    virtual: true
