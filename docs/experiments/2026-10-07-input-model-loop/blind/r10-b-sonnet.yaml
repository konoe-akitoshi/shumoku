groups:
  - id: server-room
    label: Server room
  - id: aws-tokyo
    label: AWS Tokyo region

nodes:
  - id: rt-1
    type: router
    vendor: Yamaha
    model: RTX3510
    group: server-room
  - id: hv-1
    type: hypervisor
    vendor: Dell
    model: PowerEdge R750
    description: Runs VMware ESXi
    group: server-room
  - id: fw-v
    type: firewall
    vendor: Palo Alto Networks
    model: VM-Series
    host: hv-1
    group: server-room
  - id: app-1
    type: vm
    description: Runs Ubuntu
    host: hv-1
    group: server-room
  - id: tgw-1
    type: transit-gateway
    vendor: AWS
    model: Transit Gateway
    group: aws-tokyo
  - id: web-c
    type: vm
    vendor: AWS
    model: EC2 t3.medium
    description: Runs Amazon Linux
    group: aws-tokyo

links:
  - endpoints:
      - node: rt-1
      - node: hv-1
    speed: 10G
  - endpoints:
      - node: rt-1
      - node: tgw-1
    virtual: true
    description: IPsec VPN
