name: AS64500
routingDomains:
  - id: internet-exchange
    label: IX-T
    prefix: 198.51.100.0/24
segments:
  - id: ix-t-peering-lan
    label: IX-T peering LAN
    prefix: 198.51.100.0/24
    addresses:
      br2: 198.51.100.10
      as64520: 198.51.100.20
      as64530: 198.51.100.30
nodes:
  - id: br1
    label: br1
    asn: 64500
    group: dc-a
  - id: br2
    label: br2
    asn: 64500
    group: dc-a
  - id: transit-router
    asn: 64510
  - id: as64520
    asn: 64520
  - id: as64530
    asn: 64530
  - id: as64540
    asn: 64540
groups:
  - id: dc-a
    label: DC-A
connections:
  - id: br1-transit
    label: eBGP to AS64510
  - id: br2-as64520
    label: eBGP peering with AS64520 over IX-T
  - id: br2-as64540
    label: eBGP transit from AS64540
links:
  - endpoints:
      - node: br1
        port: xe-0/0/0
      - node: transit-router
    speed: 10G
    connection: br1-transit
  - endpoints:
      - node: br2
      - node: as64520
    segments:
      - ix-t-peering-lan
    connection: br2-as64520
    virtual: true
  - endpoints:
      - node: br2
      - node: as64540
    connection: br2-as64540
    virtual: true
