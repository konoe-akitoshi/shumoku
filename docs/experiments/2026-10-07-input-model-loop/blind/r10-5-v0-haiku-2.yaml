name: Company On-Premises and AWS Network

groups:
  - id: server-room
    label: On-Premises Server Room
  - id: aws-tokyo
    label: AWS Tokyo Region
  - id: ap-northeast-1a
    label: Availability Zone ap-northeast-1a
    parent: aws-tokyo
  - id: ap-northeast-1c
    label: Availability Zone ap-northeast-1c
    parent: aws-tokyo

segments:
  - id: vlan-10
    label: VLAN 10
    vlan: 10
    prefix: 192.168.10.0/24
    group: server-room
    addresses:
      rt-1: []
      hv-1: []
      hv-2: []
      fw-v:
        - 192.168.10.2
      app-1:
        - 192.168.10.20

  - id: sub-a
    label: Subnet sub-a
    prefix: 10.0.1.0/24
    group: ap-northeast-1a
    addresses:
      vpc-main: []
      web-c:
        - 10.0.1.10

  - id: sub-c
    label: Subnet sub-c
    prefix: 10.0.2.0/24
    group: ap-northeast-1c
    addresses:
      vpc-main: []
      db-c:
        - 10.0.2.20

redundancy:
  - id: prod
    label: vSphere HA Cluster prod
    nodes:
      - hv-1
      - hv-2

nodes:
  - id: rt-1
    label: rt-1
    type: router
    product: yamaha/rtx3510
    group: server-room

  - id: hv-1
    label: hv-1
    type: hypervisor
    product: dell/poweredge/r750
    software: vmware/esxi
    group: server-room

  - id: hv-2
    label: hv-2
    type: hypervisor
    product: dell/poweredge/r750
    software: vmware/esxi
    group: server-room

  - id: fw-v
    label: fw-v
    type: firewall
    product: paloaltonetworks/vm-series
    host: hv-1
    group: server-room

  - id: app-1
    label: app-1
    type: vm
    software: ubuntu
    host: prod
    group: server-room

  - id: vpc-main
    label: VPC main
    type: vpc
    product: aws/vpc
    prefix: 10.0.0.0/16
    group: aws-tokyo

  - id: web-c
    label: web-c
    type: ec2
    product: aws/ec2/t3.medium
    software: amazon-linux
    group: ap-northeast-1a

  - id: db-c
    label: db-c
    type: rds
    product: aws/rds/mysql
    group: ap-northeast-1c

  - id: igw-1
    label: igw-1
    type: internet-gateway
    product: aws/internet-gateway
    group: aws-tokyo

  - id: tgw-1
    label: tgw-1
    type: transit-gateway
    product: aws/transit-gateway
    group: aws-tokyo

links:
  - endpoints:
      - node: hv-1
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10

  - endpoints:
      - node: hv-2
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10

  - endpoints:
      - node: vpc-main
      - node: igw-1

  - endpoints:
      - node: vpc-main
      - node: tgw-1
    segments:
      - sub-a
      - sub-c

  - endpoints:
      - node: rt-1
      - node: tgw-1
    description: Site-to-Site VPN with two IPsec tunnels
    virtual: true
