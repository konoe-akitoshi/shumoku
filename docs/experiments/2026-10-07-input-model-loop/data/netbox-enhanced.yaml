name: NetBox Enhanced Network
description: Example showcasing bandwidth, VLAN, and cable type visualization

groups:
  - { id: site-tokyo-dc, label: Tokyo DC }
  - { id: site-osaka-dc, label: Osaka DC }
  - { id: site-office, label: Head Office }

segments:
  - { id: vlan100, vlan: 100 }
  - { id: vlan200, vlan: 200 }
  - { id: vlan300, vlan: 300 }
  - { id: vlan10, vlan: 10 }
  - { id: vlan20, vlan: 20 }

redundancy:
  - { id: core-rt-pair, nodes: [core-rt-01, core-rt-02] }

nodes:
  - id: core-rt-01
    type: router
    vendor: yamaha
    model: rtx3510
    address: 10.0.0.1
    group: site-tokyo-dc
  - id: core-rt-02
    type: router
    vendor: yamaha
    model: rtx3510
    address: 10.0.0.2
    group: site-tokyo-dc
  - id: core-sw-01
    type: l3-switch
    vendor: juniper
    model: ex4400-48p
    address: 10.0.1.1
    group: site-tokyo-dc
  - { id: access-sw-01, type: l2-switch, group: site-tokyo-dc, address: 10.0.2.1 }
  - { id: access-sw-02, type: l2-switch, group: site-tokyo-dc, address: 10.0.2.2 }
  - id: osaka-rt-01
    type: router
    vendor: yamaha
    model: rtx1300
    address: 10.1.0.1
    group: site-osaka-dc
  - { id: osaka-sw-01, type: l3-switch, group: site-osaka-dc, address: 10.1.1.1 }
  - { id: office-rt-01, type: router, group: site-office, address: 10.2.0.1 }
  - { id: office-sw-01, type: l2-switch, group: site-office, address: 10.2.1.1 }
  - { id: office-ap-01, type: access-point, vendor: aruba, group: site-office }

links:
  - endpoints: [{ node: core-rt-01, port: xe-0/0/0 }, { node: core-rt-02, port: xe-0/0/0 }]
    speed: 100G
  - endpoints: [{ node: core-rt-01, port: xe-0/0/1 }, { node: core-sw-01, port: xe-0/0/0 }]
    speed: 40G
    segments: [vlan100, vlan200, vlan300]
  - endpoints: [{ node: core-rt-02, port: xe-0/0/1 }, { node: core-sw-01, port: xe-0/0/1 }]
    speed: 40G
    segments: [vlan100, vlan200, vlan300]
  - endpoints: [{ node: core-sw-01, port: ge-0/0/1 }, { node: access-sw-01, port: ge-0/0/0 }]
    speed: 10G
    segments: [vlan100, vlan200]
  - endpoints: [{ node: core-sw-01, port: ge-0/0/2 }, { node: access-sw-02, port: ge-0/0/0 }]
    speed: 10G
    segments: [vlan100, vlan300]
  - endpoints: [{ node: core-rt-01, port: xe-0/0/2 }, { node: osaka-rt-01, port: ge-0/0/0 }]
    speed: 10G
  - endpoints: [{ node: osaka-rt-01, port: ge-0/0/1 }, { node: osaka-sw-01, port: ge-0/0/0 }]
    speed: 1G
    segments: [vlan100]
  - endpoints: [{ node: core-rt-02, port: tun0 }, { node: office-rt-01, port: tun0 }]
    virtual: true
  - endpoints: [{ node: office-rt-01, port: ge-0/0/1 }, { node: office-sw-01, port: ge-0/0/0 }]
    speed: 1G
    segments: [vlan10, vlan20]
  - endpoints: [{ node: office-sw-01, port: ge-0/0/10 }, { node: office-ap-01, port: eth0 }]
    speed: 1G
    segments: [vlan20]
