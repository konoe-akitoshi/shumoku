name: Company network
groups:
  - id: server-room
    label: Server room
  - id: ap-northeast-1a
    label: ap-northeast-1a
  - id: ap-northeast-1c
    label: ap-northeast-1c

networks:
  - id: guest
    label: Guest VRF
  - id: main
    label: VPC main
    prefix: 10.0.0.0/16

segments:
  - id: vlan-20
    label: VLAN 20
    vlan: 20
    prefix: 192.168.20.0/24
    network: guest
    group: server-room
    addresses:
      ap-1: 192.168.20.5
  - id: vlan-10
    label: VLAN 10
    vlan: 10
    prefix: 192.168.10.0/24
    group: server-room
    addresses:
      fw-v: 192.168.10.2
      app-1: 192.168.10.20
    nodes:
      - hv-1
      - hv-2
  - id: sub-a
    label: sub-a
    prefix: 10.0.1.0/24
    network: main
    group: ap-northeast-1a
    addresses:
      web-c: 10.0.1.10
    nodes:
      - tgw-1
  - id: sub-c
    label: sub-c
    prefix: 10.0.2.0/24
    network: main
    group: ap-northeast-1c
    addresses:
      db-c: 10.0.2.20
      tgw-1: []

nodes:
  - id: rt-1
    label: rt-1
    product: yamaha/rtx3510
    group: server-room
    address: 192.168.20.1
  - id: ap-1
    label: ap-1
    group: server-room
    network: guest
  - id: hv-1
    label: hv-1
    product: dell/poweredge-r750
    software: vmware-esxi
    group: server-room
  - id: hv-2
    label: hv-2
    product: dell/poweredge-r750
    software: vmware-esxi
    group: server-room
  - id: fw-v
    label: fw-v
    product: palo-alto-networks/vm-series
    host: hv-1
    group: server-room
  - id: app-1
    label: app-1
    software: ubuntu
    host: prod
    group: server-room
  - id: web-c
    label: web-c
    product: aws/ec2/t3.medium
    software: amazon-linux
    network: main
  - id: db-c
    label: db-c
    product: aws/rds/mysql
    network: main
  - id: igw-1
    label: igw-1
    product: aws/internet-gateway
    network: main
  - id: tgw-1
    label: tgw-1
    product: aws/transit-gateway
    network: main

redundancy:
  - id: prod
    label: prod
    nodes:
      - hv-1
      - hv-2

links:
  - endpoints:
      - node: ap-1
      - node: rt-1
        port: lan2
    segments:
      - vlan-20
  - endpoints:
      - node: hv-1
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: hv-2
      - node: rt-1
    speed: 10G
    segments:
      - vlan-10
  - endpoints:
      - node: rt-1
      - node: tgw-1
    virtual: true
    description: Site-to-Site VPN tunnel 1
  - endpoints:
      - node: rt-1
      - node: tgw-1
    virtual: true
    description: Site-to-Site VPN tunnel 2
