name: Server room

nodes:
  - id: core
    type: switch

  - id: esx-1
    type: virtualization-host
    software: VMware ESXi

  - id: esx-2
    type: virtualization-host
    software: VMware ESXi

  - id: esx-3
    type: virtualization-host
    software: VMware ESXi

  - id: web-1
    type: virtual-machine
    host: esx-1
    address: 192.168.1.20

  - id: db-1
    type: virtual-machine
    host: prod

  - id: mon-1
    type: virtual-machine
    address: 10.99.0.50

links:
  - endpoints:
      - node: core
      - node: esx-1
    speed: 25G
    segments: [staff, database]

  - endpoints:
      - node: core
      - node: esx-2
    speed: 25G
    segments: [staff, database]

  - endpoints:
      - node: core
      - node: esx-3
    speed: 25G
    segments: [staff, database]

segments:
  - id: staff
    label: VLAN 10
    vlan: 10
    prefix: 192.168.1.0/24

  - id: database
    label: VLAN 30
    vlan: 30
    prefix: 192.168.3.0/24

redundancy:
  - id: prod
    label: prod
    nodes: [esx-1, esx-2, esx-3]
