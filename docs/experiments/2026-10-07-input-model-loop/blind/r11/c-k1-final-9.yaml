groups:
  - id: head-office
    label: Head office
  - id: server-room
    label: Server room
    parent: head-office
  - id: branch
    label: Branch
  - id: branch-2nd-floor
    label: 2nd floor
    parent: branch

segments:
  - id: staff
    label: Staff
    vlan: 10
    prefix: 192.168.1.0/24
    addresses:
      firewall-ha: 192.168.1.1
      fw-1: 192.168.1.2
      fw-2: 192.168.1.3
      web-1: 192.168.1.20
  - id: voice
    label: Voice
    vlan: 20

redundancy:
  - id: firewall-ha
    label: Firewall HA pair
    nodes: [fw-1, fw-2]

nodes:
  - id: fw-1
    type: firewall
    product: palo-alto/pa-3220
    group: server-room
  - id: fw-2
    type: firewall
    product: palo-alto/pa-3220
    group: server-room
  - id: core
    type: switch
    members: [sw-a, sw-b]
    address: 10.99.0.2
    description: Management address; its network is unknown.
    group: server-room
  - id: esx-1
    type: virtualization-host
    group: server-room
  - id: vSwitch0
    type: virtual-switch
    host: esx-1
    group: server-room
  - id: web-1
    type: virtual-machine
    host: esx-1
    group: server-room
  - id: br-rt
    type: router
    group: branch-2nd-floor
  - id: branch-ap
    type: access-point
    group: branch-2nd-floor
    assumed: true

links:
  - endpoints:
      - node: fw-1
        port: ethernet1/1
      - node: core
    speed: 10G
    segments: [staff, voice]
  - endpoints:
      - node: fw-2
      - node: core
  - endpoints:
      - node: esx-1
      - node: core
    speed: 25G
    segments: [staff]
  - endpoints:
      - node: web-1
      - node: vSwitch0
    segments: [staff]
    virtual: true
  - endpoints:
      - node: br-rt
        port: tun0
      - node: fw-1
        port: tun0
    description: IPsec tunnel
    virtual: true
