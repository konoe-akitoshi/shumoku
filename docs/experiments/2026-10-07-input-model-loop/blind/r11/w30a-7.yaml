name: AS64500

groups:
  - id: dc-a
    label: DC-A

segments:
  - id: ix-t-lan
    label: IX-T peering LAN
    prefix: 198.51.100.0/24
    addresses:
      br2: 198.51.100.10
      as64520: 198.51.100.20
      as64530: 198.51.100.30

nodes:
  - id: br1
    type: router
    asn: 64500
    group: dc-a
  - id: br2
    type: router
    asn: 64500
    group: dc-a
  - id: transit-64510-router
    type: router
    asn: 64510
    assumed: true
  - id: as64520
    type: router
    asn: 64520
  - id: as64530
    type: router
    asn: 64530
  - id: as64540
    type: router
    asn: 64540

links:
  - endpoints:
      - node: br1
        port: xe-0/0/0
      - node: transit-64510-router
    speed: 10G
    connection: transit-64510-session
  - endpoints:
      - node: br2
      - segment: ix-t-lan
    segments:
      - ix-t-lan
  - endpoints:
      - node: br2
      - node: as64520
    virtual: true
    connection: ix-t-64520-session
  - endpoints:
      - node: br2
      - node: as64540
    virtual: true
    connection: transit-64540-session

connections:
  - id: transit-64510-session
    label: eBGP session to AS64510
  - id: ix-t-64520-session
    label: settlement-free eBGP peering with AS64520 over IX-T
  - id: transit-64540-session
    label: transit eBGP session with AS64540
