name: 本社・AWS東京

groups:
  - id: hq
    label: 本社
    groups:
      - id: server-room
        label: サーバ室
  - id: aws-tokyo
    label: AWS 東京
    groups:
      - id: ap-northeast-1a
        label: ap-northeast-1a

routingDomains:
  - id: guest-vrf
    label: guest
  - id: main-vpc
    label: main
    prefix: 10.0.0.0/16

connections:
  - id: site-to-site-vpn
    label: IPsec Site-to-Site VPN

segments:
  - id: vlan-10
    label: 業務
    vlan: 10
    prefix: 192.168.10.0/24
  - id: vlan-20
    label: 来客
    vlan: 20
    routingDomain: guest-vrf
  - id: subnet-sub-a
    label: sub-a
    prefix: 10.0.1.0/24
    routingDomain: main-vpc
    group: ap-northeast-1a
    addresses:
      web-1: 192.168.10.20

nodes:
  - id: rt-1
    type: router
    product: Yamaha/RTX3510
    group: server-room
  - id: sw-1
    type: switch
    product: ?/SWX2322P-16MT
    group: server-room
  - id: hv-1
    type: virtualization-host
    product: Dell/PowerEdge R750
    software: VMware ESXi
    group: server-room
  - id: web-1
    type: vm
    host: hv-1
  - id: igw-1
    type: internet-gateway
    group: aws-tokyo
  - id: vgw-1
    type: virtual-private-gateway
    group: aws-tokyo

links:
  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: port 1
    speed: 1G
    cable: Cat6
    length: 3m
    segments:
      - vlan-10
      - vlan-20
  - endpoints:
      - node: hv-1
      - node: sw-1
    speed: 10G
  - endpoints:
      - node: web-1
      - segment: vlan-10
    virtual: true
  - endpoints:
      - node: igw-1
      - routingDomain: main-vpc
  - endpoints:
      - node: rt-1
      - node: vgw-1
    virtual: true
    connection: site-to-site-vpn
    description: IPsec Site-to-Site VPN トンネル1/2
  - endpoints:
      - node: rt-1
      - node: vgw-1
    virtual: true
    connection: site-to-site-vpn
    description: IPsec Site-to-Site VPN トンネル2/2
