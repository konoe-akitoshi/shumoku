#
# IPsec (IKEv2 + ESP) シナリオ (protoviz/site/js/protocols/ipsec.js MIT の移植)。
# パケットは全て inline 宣言 (IKE の長さ・連鎖は len/csum で実計算)。
# SPI 等の定数は protoviz と同じ seed の決定論的生成値を hex で書く。

id: ipsec
name: IPsec (IKEv2 + ESP)
title: 拠点間 VPN
group: ネットワーク層
layerLabel: "L3 · UDP 500/4500, IP プロトコル 50"

lifelines: [ha, ga, gb, hb]
nodeSub:
  ha: 10.1.0.10
  ga: 198.51.100.10
  gb: 203.0.113.20
  hb: 10.2.0.20

legend:
  - [blue, "拠点内の通信 (平文)"]
  - [amber, "IKE 要求"]
  - [violet, "IKE 応答"]
  - [green, "ESP (暗号化されたデータ)"]
  - [gray, "機器内の処理"]

overview:
  full: "IP Security — IKEv2 による鍵交換と ESP による暗号化"
  description: "IPsec は IP パケットそのものを暗号化する仕組みで、拠点同士を結ぶ VPN によく使われます。まず IKEv2 で「お互いが本物か」を確かめつつ暗号鍵を決め (2往復)、そのあとは ESP というヘッダを付けて、元のパケットを丸ごと暗号化して送ります。"
  facts:
    - [鍵交換, "IKEv2 (UDP 500, NAT 越えは 4500)"]
    - [データ, "ESP (IP プロトコル番号 50)"]
    - [モード, "トンネル (拠点間) / トランスポート"]
    - [認証, "証明書 or 事前共有鍵 (PSK)"]
    - [規格, "RFC 7296 (IKEv2), RFC 4303 (ESP)"]

steps:
  - title: "トンネルが必要になる"
    desc: "PC-A が拠点 B のサーバに ping を送ると、ゲートウェイ A は「これは暗号化して送るべき通信だ」と判断します。"
    detail: |
      ゲートウェイには「どの通信を保護するか」というポリシー (SPD) が設定されています。ここでは「10.1.0.0/24 と 10.2.0.0/24 の間は IPsec で保護」です。

      ところが、まだ相手と共有している鍵 (SA: セキュリティアソシエーション) がありません。そこでパケットを一時的に止めて、IKE による鍵交換を始めます。
    facts:
      - ["ポリシー (SPD)", "10.1.0.0/24 ⇄ 10.2.0.0/24 : 保護"]
      - ["SA (SAD)", "まだない"]
    events:
      - kind: pkt
        from: ha
        to: ga
        color: blue
        label: ping
        packet:
          summary: "ping 10.1.0.10 → 10.2.0.20 (拠点内は暗号化なし)"
          layers:
            - ipv4: {src: 10.1.0.10, dst: 10.2.0.20, proto: 1, id: 0x31c5}
            - name: "ICMP Echo Request"
              fields:
                - u8: [タイプ, 8, "8 (Echo Request)"]
                - u8: [コード, 0, "0"]
                - csum: [チェックサム, "", {kind: icmp4}]
                - u16: [識別子, 0x0b0c, "0x0b0c"]
                - u16: [シーケンス番号, 1, "1"]
                - str: [データ, "abcdefghijklmnopqrstuvwabcdefghi"]
      - kind: local
        node: ga
        label: "SPD に一致・SA なし"
        text: "ポリシーデータベース (SPD) を引くと「保護する」に一致した。しかし使える SA がまだないので、IKE デーモン (strongSwan など) に鍵交換を依頼し、パケットは保留する。"

  - title: "IKE_SA_INIT — 方式を決めて鍵を交換"
    desc: "1往復目。暗号方式の候補を出し合い、Diffie-Hellman 鍵交換の公開値とノンスを交換します。"
    detail: |
      A は「AES-GCM-256 / SHA2-256 / Curve25519 でどう？」と候補を出し、B はその中から選んで返します。同時に DH 鍵交換の公開値を交換するので、この1往復が終わった時点で、盗聴者には分からない共通の秘密が両者にできます。

      NAT_DETECTION の通知は、途中に NAT があるかを調べるためのものです。NAT があると分かれば、以降は UDP 4500 番に切り替えて ESP も UDP に包みます (NAT トラバーサル)。
    facts:
      - [暗号, "AES-GCM 256 ビット"]
      - [PRF, "HMAC-SHA2-256"]
      - [DH, "Curve25519 (グループ 31)"]
      - [ポート, "UDP 500 → 500"]
    events:
      - kind: pkt
        from: ga
        to: gb
        color: amber
        label: IKE_SA_INIT
        packet:
          summary: "IKE_SA_INIT 要求: 使える暗号方式の候補と、A の鍵交換の値"
          note: "このメッセージは暗号化されていない。DH 鍵交換の公開値だけを送り、秘密そのものは送らないので、盗聴されても鍵は分からない。"
          layers:
            - ipv4: {src: 198.51.100.10, dst: 203.0.113.20, proto: 17, id: 0x1a01}
            - udp: {sport: 500, dport: 500, sname: IKE, dname: IKE}
            - name: "IKEv2 ヘッダ"
              fields:
                - hex: ["イニシエータ SPI", d4671ec32c9f96dd, d4 67 1e c3 2c 9f 96 dd, "開始側が決めた 8 バイトの番号。この IKE SA を識別する"]
                - hex: ["レスポンダ SPI", "00 00 00 00 00 00 00 00", "0 (まだ決まっていない)", "応答側が決める番号。最初の要求ではまだ 0"]
                - u8: [次ペイロード, 33, "33 (SA)", "IKE はペイロードを数珠つなぎにする。各ペイロードが「次は何か」を持つ"]
                - u8: [バージョン, 0x20, "2.0"]
                - u8: [交換タイプ, 34, "34 (IKE_SA_INIT)"]
                - u8: [フラグ, 0x08, "I (イニシエータからの要求)"]
                - u32: ["メッセージ ID", 0, "0", "要求と応答の組を対応づける番号。再送の検出にも使う"]
                - len: [長さ, 4, "IKE メッセージ全体の長さ", {from: rest}]
            - name: "ペイロード: SA (セキュリティアソシエーション)"
              fields:
                - u8: [次ペイロード, 34, "34 (KE)"]
                - u8: [クリティカル / 予約, 0, "0"]
                - len: [ペイロード長, 2, "このペイロードの長さ"]
                - u8: ["プロポーザル: 最後か", 0, 最後, "イニシエータは候補を複数並べられる。応答側はその中から1つ選んで返す"]
                - u8: [予約, 0, "0"]
                - len: [プロポーザル長, 2, "", {adj: -4}]
                - u8: [プロポーザル番号, 1, "1"]
                - u8: [プロトコル, 1, "1 (IKE)"]
                - u8: [SPI サイズ, 0, "0"]
                - u8: ["変換の数", 3, "3"]
                - u8: ["変換: 暗号", 3, 続きあり, "", {depth: 1}]
                - u8: ["  予約", 0, "0", "", {depth: 2}]
                - u16: ["  変換の長さ", 12, "12", "", {depth: 2}]
                - u8: ["  種類", 1, "1 (暗号)", "", {depth: 2}]
                - u8: ["  予約", 0, "0", "", {depth: 2}]
                - u16: ["  ID", 20, "20 (AES-GCM 16バイト ICV)", "", {depth: 2}]
                - hex: ["  属性: 鍵長", "800e0100", "256 ビット", "", {depth: 2}]
                - u8: ["変換: 擬似乱数関数", 3, 続きあり, "", {depth: 1}]
                - u8: ["  予約", 0, "0", "", {depth: 2}]
                - u16: ["  変換の長さ", 8, "8", "", {depth: 2}]
                - u8: ["  種類", 2, "2 (擬似乱数関数)", "", {depth: 2}]
                - u8: ["  予約", 0, "0", "", {depth: 2}]
                - u16: ["  ID", 5, "5 (HMAC-SHA2-256)", "", {depth: 2}]
                - u8: ["変換: 鍵交換 (DH)", 0, 最後, "", {depth: 1}]
                - u8: ["  予約", 0, "0", "", {depth: 2}]
                - u16: ["  変換の長さ", 8, "8", "", {depth: 2}]
                - u8: ["  種類", 4, "4 (鍵交換 (DH))", "", {depth: 2}]
                - u8: ["  予約", 0, "0", "", {depth: 2}]
                - u16: ["  ID", 31, "31 (Curve25519)", "", {depth: 2}]
            - name: "ペイロード: 鍵交換 (KE)"
              fields:
                - u8: [次ペイロード, 40, "40 (Nonce)"]
                - u8: [クリティカル / 予約, 0, "0"]
                - len: [ペイロード長, 2, "このペイロードの長さ"]
                - u16: ["DH グループ", 31, "31 (Curve25519)"]
                - u16: [予約, 0, "0"]
                - blob: [公開値, ke-A, 32, "(32 バイト) A の公開鍵", "A は秘密の乱数を作り、そこから計算した公開値だけを送る。両者の公開値と自分の秘密から、同じ共有秘密が計算できる"]
            - name: "ペイロード: ノンス (Nonce)"
              fields:
                - u8: [次ペイロード, 41, "41 (Notify)"]
                - u8: [クリティカル / 予約, 0, "0"]
                - len: [ペイロード長, 2, "このペイロードの長さ"]
                - blob: [ノンス, nonce-A, 32, "(32 バイト) Ni", "使い捨ての乱数。鍵の材料に混ぜて、毎回違う鍵になるようにする"]
            - name: "ペイロード: Notify: NAT_DETECTION_SOURCE_IP"
              fields:
                - u8: [次ペイロード, 41, "41 (Notify)"]
                - u8: [クリティカル / 予約, 0, "0"]
                - len: [ペイロード長, 2, "このペイロードの長さ"]
                - u8: [プロトコル, 0, "0"]
                - u8: [SPI サイズ, 0, "0"]
                - u16: ["通知タイプ", 16388, "16388 (NAT_DETECTION_SOURCE_IP)"]
                - blob: [ハッシュ, natd-src-A, 20, "SHA-1(SPI, 送信元 IP, ポート)", "受け取った側が同じ計算をして一致しなければ、途中で NAT がアドレスを書き換えたと分かる"]
            - name: "ペイロード: Notify: NAT_DETECTION_DESTINATION_IP"
              fields:
                - u8: [次ペイロード, 0, "0 (なし)"]
                - u8: [クリティカル / 予約, 0, "0"]
                - len: [ペイロード長, 2, "このペイロードの長さ"]
                - u8: [プロトコル, 0, "0"]
                - u8: [SPI サイズ, 0, "0"]
                - u16: ["通知タイプ", 16389, "16389 (NAT_DETECTION_DESTINATION_IP)"]
                - blob: [ハッシュ, natd-dst-A, 20, "SHA-1(SPI, 宛先 IP, ポート)"]
      - kind: pkt
        from: gb
        to: ga
        color: violet
        label: IKE_SA_INIT
        packet:
          summary: "IKE_SA_INIT 応答: 候補から選んだ方式と、B の鍵交換の値"
          note: "このメッセージは暗号化されていない。DH 鍵交換の公開値だけを送り、秘密そのものは送らないので、盗聴されても鍵は分からない。"
          layers:
            - ipv4: {src: 203.0.113.20, dst: 198.51.100.10, proto: 17, id: 0x5b21}
            - udp: {sport: 500, dport: 500, sname: IKE, dname: IKE}
            - name: "IKEv2 ヘッダ"
              fields:
                - hex: ["イニシエータ SPI", d4671ec32c9f96dd, d4 67 1e c3 2c 9f 96 dd, "開始側が決めた 8 バイトの番号。この IKE SA を識別する"]
                - hex: ["レスポンダ SPI", c48c83d4ba16892c, c4 8c 83 d4 ba 16 89 2c, "応答側が決める番号"]
                - u8: [次ペイロード, 33, "33 (SA)", "IKE はペイロードを数珠つなぎにする。各ペイロードが「次は何か」を持つ"]
                - u8: [バージョン, 0x20, "2.0"]
                - u8: [交換タイプ, 34, "34 (IKE_SA_INIT)"]
                - u8: [フラグ, 0x20, "R (応答)"]
                - u32: ["メッセージ ID", 0, "0", "要求と応答の組を対応づける番号。再送の検出にも使う"]
                - len: [長さ, 4, "IKE メッセージ全体の長さ", {from: rest}]
            - name: "ペイロード: SA (セキュリティアソシエーション)"
              fields:
                - u8: [次ペイロード, 34, "34 (KE)"]
                - u8: [クリティカル / 予約, 0, "0"]
                - len: [ペイロード長, 2, "このペイロードの長さ"]
                - u8: ["プロポーザル: 最後か", 0, 最後, "イニシエータは候補を複数並べられる。応答側はその中から1つ選んで返す"]
                - u8: [予約, 0, "0"]
                - len: [プロポーザル長, 2, "", {adj: -4}]
                - u8: [プロポーザル番号, 1, "1"]
                - u8: [プロトコル, 1, "1 (IKE)"]
                - u8: [SPI サイズ, 0, "0"]
                - u8: ["変換の数", 3, "3"]
                - u8: ["変換: 暗号", 3, 続きあり, "", {depth: 1}]
                - u8: ["  予約", 0, "0", "", {depth: 2}]
                - u16: ["  変換の長さ", 12, "12", "", {depth: 2}]
                - u8: ["  種類", 1, "1 (暗号)", "", {depth: 2}]
                - u8: ["  予約", 0, "0", "", {depth: 2}]
                - u16: ["  ID", 20, "20 (AES-GCM 16バイト ICV)", "", {depth: 2}]
                - hex: ["  属性: 鍵長", "800e0100", "256 ビット", "", {depth: 2}]
                - u8: ["変換: 擬似乱数関数", 3, 続きあり, "", {depth: 1}]
                - u8: ["  予約", 0, "0", "", {depth: 2}]
                - u16: ["  変換の長さ", 8, "8", "", {depth: 2}]
                - u8: ["  種類", 2, "2 (擬似乱数関数)", "", {depth: 2}]
                - u8: ["  予約", 0, "0", "", {depth: 2}]
                - u16: ["  ID", 5, "5 (HMAC-SHA2-256)", "", {depth: 2}]
                - u8: ["変換: 鍵交換 (DH)", 0, 最後, "", {depth: 1}]
                - u8: ["  予約", 0, "0", "", {depth: 2}]
                - u16: ["  変換の長さ", 8, "8", "", {depth: 2}]
                - u8: ["  種類", 4, "4 (鍵交換 (DH))", "", {depth: 2}]
                - u8: ["  予約", 0, "0", "", {depth: 2}]
                - u16: ["  ID", 31, "31 (Curve25519)", "", {depth: 2}]
            - name: "ペイロード: 鍵交換 (KE)"
              fields:
                - u8: [次ペイロード, 40, "40 (Nonce)"]
                - u8: [クリティカル / 予約, 0, "0"]
                - len: [ペイロード長, 2, "このペイロードの長さ"]
                - u16: ["DH グループ", 31, "31 (Curve25519)"]
                - u16: [予約, 0, "0"]
                - blob: [公開値, ke-B, 32, "(32 バイト) B の公開鍵", "B は秘密の乱数を作り、そこから計算した公開値だけを送る。両者の公開値と自分の秘密から、同じ共有秘密が計算できる"]
            - name: "ペイロード: ノンス (Nonce)"
              fields:
                - u8: [次ペイロード, 41, "41 (Notify)"]
                - u8: [クリティカル / 予約, 0, "0"]
                - len: [ペイロード長, 2, "このペイロードの長さ"]
                - blob: [ノンス, nonce-B, 32, "(32 バイト) Nr", "使い捨ての乱数。鍵の材料に混ぜて、毎回違う鍵になるようにする"]
            - name: "ペイロード: Notify: NAT_DETECTION_SOURCE_IP"
              fields:
                - u8: [次ペイロード, 41, "41 (Notify)"]
                - u8: [クリティカル / 予約, 0, "0"]
                - len: [ペイロード長, 2, "このペイロードの長さ"]
                - u8: [プロトコル, 0, "0"]
                - u8: [SPI サイズ, 0, "0"]
                - u16: ["通知タイプ", 16388, "16388 (NAT_DETECTION_SOURCE_IP)"]
                - blob: [ハッシュ, natd-src-B, 20, "SHA-1(SPI, 送信元 IP, ポート)", "受け取った側が同じ計算をして一致しなければ、途中で NAT がアドレスを書き換えたと分かる"]
            - name: "ペイロード: Notify: NAT_DETECTION_DESTINATION_IP"
              fields:
                - u8: [次ペイロード, 0, "0 (なし)"]
                - u8: [クリティカル / 予約, 0, "0"]
                - len: [ペイロード長, 2, "このペイロードの長さ"]
                - u8: [プロトコル, 0, "0"]
                - u8: [SPI サイズ, 0, "0"]
                - u16: ["通知タイプ", 16389, "16389 (NAT_DETECTION_DESTINATION_IP)"]
                - blob: [ハッシュ, natd-dst-B, 20, "SHA-1(SPI, 宛先 IP, ポート)"]

  - title: "鍵を計算する"
    desc: "両方のゲートウェイが、交換した値から同じ鍵の束を計算します。鍵そのものは一度も回線を流れません。"
    detail: "DH の共有秘密とノンスから SKEYSEED を作り、そこから用途別の鍵を導出します。SK_d (この後の ESP 用の鍵の素)、SK_ei / SK_er (IKE メッセージの暗号化用、向きごと)、SK_pi / SK_pr (認証用) などです。"
    facts:
      - [SKEYSEED, "prf(Ni | Nr, DH 共有秘密)"]
      - [導出, "SK_d, SK_ei, SK_er, SK_pi, SK_pr"]
    state:
      ga: "IKE 鍵あり"
      gb: "IKE 鍵あり"
    events:
      - kind: local
        node: ga
        label: "鍵を導出"
        text: "自分の DH 秘密と B の公開値から共有秘密を計算 → SKEYSEED = prf(Ni|Nr, 共有秘密) → SK_d, SK_ei, SK_er, SK_pi, SK_pr を導出。"
      - kind: local
        node: gb
        label: "鍵を導出"
        text: "B も自分の DH 秘密と A の公開値から、まったく同じ共有秘密と鍵の束を計算する。"
        with: true

  - title: "IKE_AUTH — 相手が本物か確かめる"
    desc: "2往復目。ここからは暗号化されています。お互いに名乗り、署名で本人確認をし、データ用の SA (Child SA) を作ります。"
    detail: |
      DH 鍵交換だけでは「誰と鍵を共有したか」が分かりません (途中で中間者がすり替わっているかもしれない)。そこで IKE_AUTH で、IKE_SA_INIT のやりとり全体に証明書の鍵で署名して送ります。相手の署名を確かめられれば、相手が本物で、しかも1往復目が改ざんされていないことが分かります。

      同じメッセージで、データ用の ESP の SA と、どの範囲の通信を流すか (トラフィックセレクタ: TSi / TSr) も決めます。
    facts:
      - [A の ID, "gw-a.example.net"]
      - [B の ID, "gw-b.example.net"]
      - [トンネルに通す範囲, "10.1.0.0/24 ⇄ 10.2.0.0/24"]
    events:
      - kind: pkt
        from: ga
        to: gb
        color: amber
        label: IKE_AUTH
        packet:
          summary: "IKE_AUTH 要求: A の名前・署名と、作りたい ESP の SA"
          note: "IKE_SA_INIT で作った鍵 (SK_e) で中身が暗号化されている。下の 🔓 の層は、復号するとこう見えるという中身。"
          layers:
            - ipv4: {src: 198.51.100.10, dst: 203.0.113.20, proto: 17, id: 0x1a02}
            - udp: {sport: 500, dport: 500, sname: IKE, dname: IKE}
            - name: "IKEv2 ヘッダ"
              fields:
                - hex: ["イニシエータ SPI", d4671ec32c9f96dd, d4 67 1e c3 2c 9f 96 dd, "開始側が決めた 8 バイトの番号。この IKE SA を識別する"]
                - hex: ["レスポンダ SPI", c48c83d4ba16892c, c4 8c 83 d4 ba 16 89 2c, "応答側が決める番号"]
                - u8: [次ペイロード, 46, "46 (SK (暗号化))", "IKE はペイロードを数珠つなぎにする。各ペイロードが「次は何か」を持つ"]
                - u8: [バージョン, 0x20, "2.0"]
                - u8: [交換タイプ, 35, "35 (IKE_AUTH)"]
                - u8: [フラグ, 0x08, "I (イニシエータからの要求)"]
                - u32: ["メッセージ ID", 1, "1", "要求と応答の組を対応づける番号。再送の検出にも使う"]
                - len: [長さ, 4, "IKE メッセージ全体の長さ", {from: rest}]
            - name: "ペイロード: SK (暗号化されたペイロード)"
              fields:
                - u8: [次ペイロード, 35, "35 (IDi)"]
                - u8: [クリティカル / 予約, 0, "0"]
                - len: [ペイロード長, 2, "このペイロードの長さ"]
                - blob: [IV, iv-auth-false, 8, "(8 バイト)", "AES-GCM の初期化ベクトル。毎回変える"]
                - blob: [暗号文, ct-auth-false, 181, "(181 バイト) 暗号化された ID・AUTH・SA・TS", "中身は下の 🔓 の層"]
                - blob: ["ICV (改ざん検知)", icv-auth-false, 16, "(16 バイト)", "1ビットでも書き換えられていれば復号に失敗する"]
              embed:
                spec:
                  layers:
                    - name: "ペイロード: IDi (自分の名前)"
                      decoded: true
                      fields:
                        - u8: [次ペイロード, 39, "39 (AUTH)"]
                        - u8: [クリティカル / 予約, 0, "0"]
                        - len: [ペイロード長, 2, "このペイロードの長さ"]
                        - u8: [ID の種類, 2, "2 (FQDN)"]
                        - hex: [予約, "000000", "0"]
                        - str: [ID, "gw-a.example.net", "相手に名乗る名前。証明書や事前共有鍵 (PSK) はこの名前に結びついている"]
                    - name: "ペイロード: AUTH (認証)"
                      decoded: true
