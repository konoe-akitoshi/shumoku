name: 本社・AWS 東京ネットワーク
groups:
  - id: hq
    label: 本社
  - id: server-room
    label: サーバ室
    parent: hq
  - id: ap-northeast-1a
    label: ap-northeast-1a

routingDomains:
  - id: main
    label: main
    prefix: 10.0.0.0/16
  - id: guest
    label: guest

segments:
  - id: vlan10
    label: 業務
    vlan: 10
    prefix: 192.168.10.0/24
  - id: vlan20
    label: 来客
    vlan: 20
    routingDomain: guest
  - id: sub-a
    label: sub-a
    prefix: 10.0.1.0/24
    routingDomain: main
    group: ap-northeast-1a

connections:
  - id: vpn
    label: IPsec Site-to-Site VPN

nodes:
  - id: rt-1
    type: router
    product: yamaha/rtx3510
    group: server-room
  - id: sw-1
    type: switch
    product: ?/swx2322p-16mt
    group: server-room
  - id: hv-1
    type: server
    product: dell/poweredge-r750
    software: VMware ESXi
    group: server-room
  - id: web-1
    type: vm
    host: hv-1
  - id: pdu-1
    type: pdu
    group: server-room
  - id: igw-1
    type: internet-gateway
    routingDomain: main
  - id: vgw-1
    type: vpn-gateway
    routingDomain: main

links:
  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: "1"
    speed: 1G
    cable: cat6
    length: 3m
    segments:
      - vlan10
      - vlan20
  - endpoints:
      - node: hv-1
      - node: sw-1
    speed: 10G
    segments:
      - vlan10
  - endpoints:
      - node: web-1
      - segment: vlan10
    virtual: true
  - endpoints:
      - node: igw-1
      - routingDomain: main
  - endpoints:
      - node: vgw-1
      - routingDomain: main
  - endpoints:
      - node: rt-1
      - node: vgw-1
    virtual: true
    connection: vpn
  - endpoints:
      - node: rt-1
      - node: vgw-1
    virtual: true
    connection: vpn
  - endpoints:
      - node: rt-1
        port: power
      - node: pdu-1
        port: "1"
    cable: power
  - endpoints:
      - node: sw-1
        port: power
      - node: pdu-1
        port: "2"
    cable: power

view:
  - match:
      cable: power
    stroke: gray
  - match:
      segment: vlan20
    stroke: orange
  - match:
      virtual: true
    dashed: true
