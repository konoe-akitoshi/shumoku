groups:
  - id: headquarters
    label: 本社
  - id: server-room
    label: サーバ室
    parent: headquarters
  - id: aws-main
    label: AWS 東京 VPC main

routingDomains:
  - id: guest
    label: guest
  - id: aws-main
    label: main
    prefix: 10.0.0.0/16

connections:
  - id: site-to-site-vpn
    label: IPsec Site-to-Site VPN

segments:
  - id: vlan-10
    label: 業務
    vlan: 10
    prefix: 192.168.10.0/24
    group: server-room
  - id: vlan-20
    label: 来客
    vlan: 20
    routingDomain: guest
    group: server-room
  - id: aws-sub-a
    label: sub-a
    prefix: 10.0.1.0/24
    routingDomain: aws-main
  - id: hv-1-vlan-10
    label: VLAN 10 ポートグループ
    routingDomain: guest

nodes:
  - id: rt-1
    label: rt-1
    type: router
    product: Yamaha/RTX3510
    group: server-room
  - id: sw-1
    label: sw-1
    type: switch
    product: ?/SWX2322P-16MT
    group: server-room
  - id: hv-1
    label: hv-1
    type: virtualization host
    product: Dell/PowerEdge R750
    software: VMware ESXi
    group: server-room
  - id: web-1
    label: web-1
    type: VM
    host: hv-1
    group: server-room
  - id: igw-1
    label: igw-1
    type: internet gateway
    group: aws-main
  - id: vgw-1
    label: vgw-1
    type: virtual private gateway
    group: aws-main

links:
  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: port 1
    speed: 1G
    cable: Cat6
    length: 3m
    segments:
      - vlan-10
      - vlan-20
  - endpoints:
      - node: hv-1
      - node: sw-1
    speed: 10G
    segments:
      - hv-1-vlan-10
  - virtual: true
    description: web-1 のアダプタ。VLAN 10 のポートグループ
    endpoints:
      - node: web-1
      - segment: vlan-10
  - endpoints:
      - node: igw-1
      - routingDomain: aws-main
  - virtual: true
    description: IPsec Site-to-Site VPN トンネル 1
    connection: site-to-site-vpn
    endpoints:
      - node: rt-1
      - node: vgw-1
  - virtual: true
    description: IPsec Site-to-Site VPN トンネル 2
    connection: site-to-site-vpn
    endpoints:
      - node: rt-1
      - node: vgw-1
