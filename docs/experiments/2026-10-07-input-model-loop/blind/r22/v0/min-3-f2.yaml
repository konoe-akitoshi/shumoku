name: Branch office network
groups:
  - id: headquarters-server-room
    label: Headquarters server room
nodes:
  - id: rt-1
    label: rt-1
    type: router
    product: Yamaha/RTX3510
    group: headquarters-server-room
  - id: sw-1
    label: sw-1
    type: switch
    model: SWX2322P-16MT
    group: headquarters-server-room
  - id: hv-1
    label: hv-1
    type: server
    product: Dell/PowerEdge-R750
    software: VMware-ESXi
    group: headquarters-server-room
  - id: web-1
    label: web-1
    type: virtual-machine
    address: 192.168.10.20
    host: hv-1
links:
  - endpoints:
      - node: rt-1
        port: lan3
      - node: sw-1
        port: "1"
    speed: 1G
    cable:
      length: 3m
      type: Cat6
    vlans:
      - id: 10
        label: business
        subnet: 192.168.10.0/24
      - id: 20
        label: guest
    vrf: guest
  - endpoints:
      - node: hv-1
      - node: sw-1
    speed: 10G
  - endpoints:
      - node: rt-1
      - node: vgw-1
    type: ipsec-site-to-site-vpn
    tunnels: 2
nodes:
  - id: vpc-main
    label: main
    type: vpc
    cidr: 10.0.0.0/16
  - id: sub-a
    label: sub-a
    type: subnet
    cidr: 10.0.1.0/24
    availability_zone: ap-northeast-1a
    parent: vpc-main
  - id: igw-1
    label: igw-1
    type: internet-gateway
    attached_to: vpc-main
  - id: vgw-1
    label: vgw-1
    type: virtual-private-gateway
    attached_to: vpc-main
