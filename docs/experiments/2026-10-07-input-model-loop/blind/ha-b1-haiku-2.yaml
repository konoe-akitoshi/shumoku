name: Data Center

nodes:
  - id: rt-1
    vendor: Juniper
    model: MX204
  - id: rt-2
    vendor: Juniper
    model: MX204
  - id: sw-1
  - id: fw-a
  - id: fw-b
    assumed: true
  - id: core
    members: [core-1, core-2]

segments:
  - id: vlan-100
    label: VLAN 100
    vlan: 100
    prefix: 10.0.0.0/24
    addresses:
      rt-1: [10.0.0.2]
      rt-2: [10.0.0.3]
      vrrp-1: [10.0.0.1]

redundancy:
  - id: vrrp-1
    nodes: [rt-1, rt-2]
  - id: fw-ha
    nodes: [fw-a, fw-b]
    assumed: true

links:
  - endpoints: [{node: rt-1, port: et-0/0/1}, {node: rt-2, port: et-0/0/1}]
    description: keepalive
  - endpoints: [{node: rt-1}, {node: sw-1, port: "1"}]
    segments: [vlan-100]
  - endpoints: [{node: rt-2}, {node: sw-1, port: "2"}]
    segments: [vlan-100]
  - endpoints: [{node: fw-a}, {node: sw-1, port: "3"}]
  - endpoints: [{node: core}, {node: sw-1, port: "4"}]
