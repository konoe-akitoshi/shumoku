name: 本社と大阪支店のネットワーク

groups:
  - id: hq
    label: 本社
  - id: osaka
    label: 大阪支店

connections:
  - id: lag-sw1-sw2
    label: sw-1 と sw-2 の LAG
  - id: ipsec-backup
    label: バックアップ IPsec トンネル

nodes:
  - id: rt-1
    label: rt-1
    group: hq
  - id: sw-1
    label: sw-1
    group: hq
  - id: sw-2
    label: sw-2
    group: hq
  - id: prn-1
    label: prn-1
    group: hq
  - id: rt-2
    label: rt-2
    group: osaka
  - id: ergw
    label: Azure ExpressRoute ゲートウェイ

links:
  - endpoints:
      - node: rt-1
        port: te1
      - node: sw-1
        port: te0/1
    speed: 10G

  - endpoints:
      - node: sw-1
        port: te0/47
      - node: sw-2
        port: te0/47
    speed: 10G
    connection: lag-sw1-sw2

  - endpoints:
      - node: sw-1
        port: te0/48
      - node: sw-2
        port: te0/48
    speed: 10G
    connection: lag-sw1-sw2

  - endpoints:
      - node: sw-2
        port: ge0/10
      - node: prn-1
    speed: 100M
    bandwidth: 100M

  - endpoints:
      - node: rt-1
        port: ge0
      - node: rt-2
        port: ge0
    speed: 1G
    bandwidth: 300M
    description: 通信事業者の広域イーサネット

  - endpoints:
      - node: rt-1
      - node: ergw
    bandwidth: 2G
    description: ExpressRoute 回線。途中の機器は不明

  - endpoints:
      - node: rt-2
      - node: rt-1
    virtual: true
    description: バックアップ IPsec トンネル
    connection: ipsec-backup
