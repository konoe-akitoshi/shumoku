name: 'On-premises + AWS Tokyo'
description: 'Company server room with vSphere cluster and AWS Tokyo infrastructure'

groups:
  - id: server-room
    label: 'Server Room'
  - id: ap-northeast-1a
    label: 'ap-northeast-1a'
  - id: ap-northeast-1c
    label: 'ap-northeast-1c'

segments:
  - id: vlan-10
    label: 'VLAN 10'
    vlan: 10
    prefix: '192.168.10.0/24'
    group: server-room
    addresses:
      fw-v:
        - '192.168.10.2'
      app-1:
        - '192.168.10.20'

  - id: sub-a
    label: 'sub-a'
    prefix: '10.0.1.0/24'
    group: ap-northeast-1a
    addresses:
      web-c:
        - '10.0.1.10'

  - id: sub-c
    label: 'sub-c'
    prefix: '10.0.2.0/24'
    group: ap-northeast-1c
    addresses:
      db-c:
        - '10.0.2.20'

redundancy:
  - id: prod
    label: 'prod'
    nodes:
      - hv-1
      - hv-2

nodes:
  - id: rt-1
    label: 'rt-1'
    type: 'router'
    product: 'yamaha/rtx3510'
    group: server-room

  - id: hv-1
    label: 'hv-1'
    type: 'hypervisor'
    product: 'dell/poweredge/r750'
    software: 'vmware-esxi'
    group: server-room

  - id: hv-2
    label: 'hv-2'
    type: 'hypervisor'
    product: 'dell/poweredge/r750'
    software: 'vmware-esxi'
    group: server-room

  - id: fw-v
    label: 'fw-v'
    type: 'firewall'
    product: 'paloaltonetworks/vm-series'
    host: hv-1

  - id: app-1
    label: 'app-1'
    type: 'vm'
    product: 'ubuntu'
    host: prod

  - id: web-c
    label: 'web-c'
    type: 'instance'
    product: 'amazon/ec2/t3.medium'
    software: 'amazon-linux'
    group: ap-northeast-1a

  - id: db-c
    label: 'db-c'
    type: 'database'
    product: 'amazon/rds/mysql'
    group: ap-northeast-1c

  - id: igw-1
    label: 'igw-1'
    type: 'internet-gateway'

  - id: tgw-1
    label: 'tgw-1'
    type: 'transit-gateway'

links:
  - endpoints:
      - node: rt-1
      - node: hv-1
    speed: '10G'
    segments:
      - vlan-10

  - endpoints:
      - node: rt-1
      - node: hv-2
    speed: '10G'
    segments:
      - vlan-10

  - endpoints:
      - node: rt-1
      - node: tgw-1
    virtual: true
    description: 'IPsec tunnel 1'

  - endpoints:
      - node: rt-1
      - node: tgw-1
    virtual: true
    description: 'IPsec tunnel 2'
